<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Granny</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; touch-action: none; }
  #ld { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: 70%; max-width: 360px; }
  #pb { height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 8px; }
  #pf { height: 100%; width: 0; background: #00e5a8; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
<style>
#ctl{display:none;position:fixed;inset:0;z-index:9;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
#ctl.show{display:block}
#stick{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,229,168,.5);pointer-events:none}
#fire{position:absolute;right:20px;bottom:20px;width:112px;height:112px;border-radius:50%;border:0;background:rgba(192,23,58,.7);color:#fff;font:800 16px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:auto;touch-action:none}
#fire.on{background:rgba(0,229,168,.6)}
#acts{position:absolute;right:20px;bottom:150px;display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,50px);gap:8px;pointer-events:auto}
#acts button{border:0;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;font:800 15px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none}
#acts button.on{background:rgba(0,229,168,.6)}
#look{display:none;position:fixed;top:46px;right:0;width:50%;bottom:270px;z-index:8;touch-action:none}
#look.show{display:block}
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas><div id="ld"><div id="tx">Lade Spiel …</div><div id="pb"><div id="pf"></div></div></div></div>
<script>
// Laedt das Spiel aus dem GitHub-Repo (raw.githubusercontent.com, fester Commit). Keine Werbung, keine Tracker.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/de90655e7a498431d69cc4187514fcacc8feee3d/granny-own/";
const ORIGIN = new URL(BASE).origin;

// --- Netz-Sperre: nur Repo-Ursprung, blob: und data: erlaubt.
(function () {
  function ok(u) { try { var x = new URL(String(u), location.href); return x.protocol === "blob:" || x.protocol === "data:" || x.origin === ORIGIN || x.protocol === "about:"; } catch (e) { return true; } }
  var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) { this._blocked = !ok(u); return open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function () {
    if (!this._blocked) return send.apply(this, arguments);
    var x = this; setTimeout(function () { x.dispatchEvent(new ProgressEvent("error")); x.dispatchEvent(new ProgressEvent("loadend")); }, 0);
  };
  var f = window.fetch;
  window.fetch = function (r) { return ok(r && r.url || r) ? f.apply(this, arguments) : Promise.reject(new TypeError("Failed to fetch")); };
  if (navigator.sendBeacon) navigator.sendBeacon = function () { return false; };
  window.open = function () { return null; };
})();

// --- Yandex-SDK-Ersatz: Werbung wird sofort als gesehen gemeldet, keine Anzeige.
window.YaGames = { init: function () { var ys = {
  deviceInfo: { type: "desktop" },
  environment: { i18n: { lang: "en", tld: "com" }, app: { id: "local" } },
  features: {
    GamesAPI: { getAllGames: function () { return Promise.resolve({ items: [], games: [] }); }, getGameByID: function () { return Promise.resolve({}); } },
    LoadingAPI: { ready: function () {} },
    GameplayAPI: { start: function () {}, stop: function () {} }
  },
  adv: {
    showRewardedVideo: function (o) { var c = (o && o.callbacks) || {}; c.onOpen && c.onOpen(); c.onRewarded && c.onRewarded(); c.onClose && c.onClose(true); return Promise.resolve(); },
    showFullscreenAdv: function (o) { var c = (o && o.callbacks) || {}; c.onOpen && c.onOpen(); c.onClose && c.onClose(false); return Promise.resolve(); }
  },
  getPlayer: function () { return Promise.reject(new Error("no player")); },
  getPayments: function () { return Promise.reject(new Error("no payments")); },
  getLeaderboards: function () { return Promise.reject(new Error("no lb")); }
}; window.ysdk = ys; return Promise.resolve(ys); } };

// Englisch automatisch: nach dem Laden einmal auf die britische Flagge tippen (Anteil der Canvas-Groesse).
function pickEnglish(canvas) {
  var r = canvas.getBoundingClientRect();
  var x = r.left + r.width * 0.534, y = r.top + r.height * 0.858;
  var o = { clientX: x, clientY: y, bubbles: true, cancelable: true, buttons: 1 };
  canvas.dispatchEvent(new MouseEvent("mousemove", o));
  canvas.dispatchEvent(new MouseEvent("mousedown", o));
  setTimeout(function () { canvas.dispatchEvent(new MouseEvent("mouseup", o)); }, 120);
}

const tx = document.getElementById("tx"), pf = document.getElementById("pf");
(async () => {
  try {
    const get = (f, kind) => fetch(BASE + f).then(r => { if (!r.ok) throw new Error(f + ": " + r.status); return r[kind](); });
    let done = 0; const bump = () => { done++; pf.style.width = (done / 4 * 50) + "%"; };
    const [loaderTxt, fw, dataBlob, wasmBlob] = await Promise.all([
      get("Build/Granny.loader.js", "text").then(x => { bump(); return x; }),
      get("Build/Granny.framework.js", "blob").then(x => { bump(); return x; }),
      get("Build/Granny.data", "blob").then(x => { bump(); return x; }),
      get("Build/Granny.wasm", "blob").then(x => { bump(); return x; })
    ]);
    const s = document.createElement("script"); s.textContent = loaderTxt; document.body.appendChild(s);
    tx.textContent = "Starte …";
    const canvas = document.getElementById("c");
    const inst = await createUnityInstance(canvas, {
      dataUrl: URL.createObjectURL(new Blob([dataBlob], { type: "application/octet-stream" })),
      codeUrl: URL.createObjectURL(new Blob([wasmBlob], { type: "application/wasm" })),
      frameworkUrl: URL.createObjectURL(new Blob([fw], { type: "text/javascript" })),
      streamingAssetsUrl: BASE + "StreamingAssets",
      companyName: "Anastasia Kazantseva", productName: "Granny", productVersion: "1.0"
    }, p => { pf.style.width = (50 + p * 50) + "%"; });
    window.unityGame = inst; window.myGameInstance = inst;
    document.getElementById("ld").remove();
    setTimeout(function () { pickEnglish(canvas); }, 4000);
  } catch (e) { tx.textContent = "Fehler beim Laden: " + (e.message || e); }
})();
</script>
<div id="look"></div>
<div id="ctl">
  <div id="stick"><div id="knob"></div></div>
  <button id="fire">Schlagen</button>
  <div id="acts"><button data-k="e">E</button><button data-k="sp">Werfen</button><button data-k="c">C</button><button data-k="r">R</button><button data-k="f">F</button><button data-k="sh">Rennen</button></div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const ctl=$("ctl"), look=$("look"), stick=$("stick"), knob=$("knob"), fire=$("fire");
  const KEYS={w:{key:"w",code:"KeyW",keyCode:87},a:{key:"a",code:"KeyA",keyCode:65},s:{key:"s",code:"KeyS",keyCode:83},d:{key:"d",code:"KeyD",keyCode:68},
    e:{key:"e",code:"KeyE",keyCode:69},sp:{key:" ",code:"Space",keyCode:32},c:{key:"c",code:"KeyC",keyCode:67},r:{key:"r",code:"KeyR",keyCode:82},f:{key:"f",code:"KeyF",keyCode:70},sh:{key:"Shift",code:"ShiftLeft",keyCode:16}};
  const canvas=()=>$("c")||document.body;
  function key(type,k){ canvas().dispatchEvent(new KeyboardEvent(type,{key:k.key,code:k.code,keyCode:k.keyCode,which:k.keyCode,bubbles:true,cancelable:true})); }
  function mouse(type,btn){ const c=canvas(); const r=c.getBoundingClientRect(); c.dispatchEvent(new MouseEvent(type,{button:btn,buttons:type==="mouseup"?0:1,clientX:r.left+r.width/2,clientY:r.top+r.height/2,bubbles:true,cancelable:true})); }
  const held=new Set();
  function setKeys(want){
    for(const k of [...held]) if(!want.has(k)){ held.delete(k); key("keyup",KEYS[k]); }
    for(const k of want) if(!held.has(k)){ held.add(k); key("keydown",KEYS[k]); }
  }
  let sid=null;
  function stickMove(e){
    const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, R=r.width/2;
    let dx=(e.clientX-cx)/R, dy=(e.clientY-cy)/R; const len=Math.hypot(dx,dy); if(len>1){dx/=len;dy/=len;}
    knob.style.transform=`translate(${dx*(R-40)}px,${dy*(R-40)}px)`;
    const want=new Set(); const t=0.3;
    if(dy<-t) want.add("w"); if(dy>t) want.add("s"); if(dx<-t) want.add("a"); if(dx>t) want.add("d");
    setKeys(want);
  }
  function stickEnd(){ sid=null; knob.style.transform=""; setKeys(new Set()); }
  stick.addEventListener("pointerdown",e=>{ e.preventDefault(); sid=e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
  stick.addEventListener("pointermove",e=>{ if(e.pointerId===sid) stickMove(e); });
  stick.addEventListener("pointerup",e=>{ if(e.pointerId===sid) stickEnd(); });
  stick.addEventListener("pointercancel",stickEnd);
  // Schlagen (Maus 1) halten
  fire.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); fire.setPointerCapture(e.pointerId); fire.classList.add("on"); mouse("mousedown",0); });
  fire.addEventListener("pointerup",e=>{ e.preventDefault(); fire.classList.remove("on"); mouse("mouseup",0); });
  fire.addEventListener("pointercancel",()=>{ fire.classList.remove("on"); mouse("mouseup",0); });
  // Spieltasten
  document.querySelectorAll("#acts button").forEach(b=>{
    const k=KEYS[b.dataset.k]; let isDown=false;
    const down=()=>{ if(isDown) return; isDown=true; b.classList.add("on"); key("keydown",k); };
    const up=()=>{ if(!isDown) return; isDown=false; b.classList.remove("on"); key("keyup",k); };
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); down(); });
    b.addEventListener("pointerup",e=>{ e.preventDefault(); up(); });
    b.addEventListener("pointercancel",up); b.addEventListener("pointerleave",up);
  });
  // Umsehen: Ziehen rechts dreht nur, kein Schlag.
  let lx=null, ly=null, lid=null;
  ["touchstart","touchmove"].forEach(t=>look.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  look.addEventListener("pointerdown",e=>{ e.preventDefault(); lid=e.pointerId; lx=e.clientX; ly=e.clientY; look.setPointerCapture(e.pointerId); });
  look.addEventListener("pointermove",e=>{
    if(e.pointerId!==lid) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    canvas().dispatchEvent(new MouseEvent("mousemove",{clientX:e.clientX,clientY:e.clientY,movementX:dx*2,movementY:dy*2,bubbles:true}));
  });
  const endLook=e=>{ if(e.pointerId===lid) lid=null; };
  look.addEventListener("pointerup",endLook); look.addEventListener("pointercancel",endLook);
  function hide(){ ctl.classList.remove("show"); look.classList.remove("show"); stickEnd(); fire.classList.remove("on"); }
  window.addEventListener("blur",hide);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") hide(); });
  // Erscheint nur in der Runde: Menue-Schritte merken (Play unten, dann Play Mitte), danach Tippen auf Start unten Mitte.
  let stage = 0;
  document.addEventListener("pointerdown",e=>{
    if(e.target.closest && e.target.closest("#ctl, #look")) return;
    const x=e.clientX, y=e.clientY, W=innerWidth, H=innerHeight;
    if(stage===0 && y>H*0.88 && Math.abs(x-W/2)<W*0.1){ stage=0; return; }
    if(stage===0 && y>H*0.62 && y<H*0.72 && Math.abs(x-W/2)<W*0.12){ stage=1; return; }
    if(stage===1 && y>H*0.88 && Math.abs(x-W/2)<W*0.14){ stage=2; ctl.classList.add("show"); look.classList.add("show"); return; }
  },true);
})();
</script>
</body>
</html>

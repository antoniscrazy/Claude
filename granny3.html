<style>
  html, body { touch-action: manipulation; margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; touch-action: none; }
  #ld { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: 70%; max-width: 360px; }
  #pb { height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 8px; }
  #pf { height: 100%; width: 0; background: #00e5a8; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
<style>
#jz{display:none;position:fixed;left:0;bottom:0;width:50%;height:60%;z-index:9;touch-action:none}
#jz.show{display:block}
#jb{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none;z-index:9}
#jk{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35)}
#rb{position:fixed;left:0;top:0;width:100%;height:100%;display:none;z-index:9;pointer-events:none}
#rb.show{display:block}
#rb button{position:absolute;transform:translate(-50%,-50%);width:clamp(66px,11vh,104px);height:clamp(66px,11vh,104px);border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);padding:0;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#rb button svg{width:clamp(34px,5.5vh,54px);height:clamp(34px,5.5vh,54px);stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#rb button.on{filter:brightness(1.4)}
#rb #fire{left:68.6%;top:60%;background:rgba(0,200,120,.45);border-color:#2ee6a0}
#rb #b_take{left:79.4%;top:60%;background:rgba(255,200,40,.5);border-color:#ffd23f}
#rb #b_drop{left:74%;top:76%;background:rgba(0,0,0,.6);border-color:#111}
#rb #b_sneak{left:91.5%;top:50%;background:rgba(40,110,255,.45);border-color:#3b82f6}
#pz{position:fixed;left:14px;top:56px;transform:none}
#pz{display:none;position:fixed;left:12px;top:56px;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;font:800 15px system-ui,sans-serif;z-index:10;touch-action:none}
#pz.show{display:block}
#look{display:none;position:fixed;top:46px;right:0;width:45%;bottom:210px;z-index:8;touch-action:none}
#look.show{display:block}
</style>
<script>
document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
document.addEventListener('touchmove',function(e){ if(e.touches.length>1) e.preventDefault(); },{passive:false});
var __lastTouchEnd=0;
document.addEventListener('touchend',function(e){ var n=Date.now(); if(n-__lastTouchEnd<350) e.preventDefault(); __lastTouchEnd=n; },{passive:false});
document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});
</script>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas><div id="ld"><div id="tx">Lade Spiel …</div><div id="pb"><div id="pf"></div></div></div></div>
<script>
// Laedt das Spiel aus dem GitHub-Repo (raw.githubusercontent.com, fester Commit). Keine Werbung, keine Tracker.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/78fffee4cb57038e6e5e3dde84d8ccb01949270f/granny3/";
const ORIGIN = new URL(BASE).origin;

// --- Netz-Sperre: nur Repo-Ursprung, blob: und data: erlaubt.
(function () {
  function ok(u) { try { var x = new URL(String(u), location.href); return x.protocol === "blob:" || x.protocol === "data:" || x.origin === ORIGIN || x.protocol === "about:"; } catch (e) { return true; } }
  var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) { this._blocked = !ok(u); return open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function () {
    if (!this._blocked) return send.apply(this, arguments);
    var x = this; setTimeout(function () { x.dispatchEvent(new ProgressEvent("error")); x.dispatchEvent(new ProgressEvent("loadend")); }, 0);
  };
  var f = window.fetch;
  window.fetch = function (r) { return ok(r && r.url || r) ? f.apply(this, arguments) : Promise.reject(new TypeError("Failed to fetch")); };
  if (navigator.sendBeacon) navigator.sendBeacon = function () { return false; };
  window.open = function () { return null; };
})();

const tx = document.getElementById("tx"), pf = document.getElementById("pf");
(async () => {
  try {
    const get = (f, kind) => fetch(BASE + f).then(r => { if (!r.ok) throw new Error(f + ": " + r.status); return r[kind](); });
    let done = 0; const bump = () => { done++; pf.style.width = (done / 4 * 70) + "%"; };
    const [loaderTxt, fw, dataBlob, wasmBlob] = await Promise.all([
      get("Build/Build.loader.js", "text").then(x => { bump(); return x; }),
      get("Build/Build.framework.js", "blob").then(x => { bump(); return x; }),
      get("Build/Build.data", "blob").then(x => { bump(); return x; }),
      get("Build/Build.wasm", "blob").then(x => { bump(); return x; })
    ]);
    const s = document.createElement("script"); s.textContent = loaderTxt; document.body.appendChild(s);
    tx.textContent = "Starte …";
    const inst = await createUnityInstance(document.getElementById("c"), {
      dataUrl: URL.createObjectURL(new Blob([dataBlob], { type: "application/octet-stream" })),
      codeUrl: URL.createObjectURL(new Blob([wasmBlob], { type: "application/wasm" })),
      frameworkUrl: URL.createObjectURL(new Blob([fw], { type: "text/javascript" })),
      companyName: "Kiz10", productName: "Granny 3 Return the School", productVersion: "1.0.0"
    }, p => { pf.style.width = (70 + p * 30) + "%"; });
    window.unityGame = inst;
    document.getElementById("ld").remove(); window.__ready = true;
  } catch (e) { tx.textContent = "Fehler beim Laden: " + (e.message || e); }
})();
</script>
<div id="look"></div>
<div id="jz"><div id="jb"><div id="jk"></div></div></div>
<button id="pz" type="button"><svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round"><path d="M9 5v14M15 5v14"/></svg></button>
<div id="rb"><button id="fire" type="button" aria-label="Schießen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button><button id="b_take" data-k="e" type="button" aria-label="Nehmen"><svg viewBox="0 0 24 24"><path d="M7 13V6a1.5 1.5 0 0 1 3 0v5M10 11V4a1.5 1.5 0 0 1 3 0v7M13 11V5a1.5 1.5 0 0 1 3 0v7l1-1a1.5 1.5 0 0 1 2 2l-3 5a6 6 0 0 1-5 3H10a6 6 0 0 1-5-3L3 14a1.5 1.5 0 0 1 2-2l2 2"/></svg></button><button id="b_drop" data-k="sp" type="button" aria-label="Fallen lassen"><svg viewBox="0 0 24 24"><path d="M3 9h18v11H3z"/><path d="M12 4v9M8 9l4 4 4-4"/></svg></button><button id="b_sneak" data-k="c" type="button" aria-label="Sneaken"><svg viewBox="0 0 24 24"><circle cx="14" cy="6" r="2"/><path d="M11 22l2-6 3 1 2-3M6 14l3-2 3 4M9 9l3 1 2 4"/></svg></button></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const jz=$("jz"), jb=$("jb"), jk=$("jk"), look=$("look"), pz=$("pz"), rb=$("rb"), fire=$("fire");
  const KEYS={w:{key:"w",code:"KeyW",keyCode:87},a:{key:"a",code:"KeyA",keyCode:65},s:{key:"s",code:"KeyS",keyCode:83},d:{key:"d",code:"KeyD",keyCode:68},
    e:{key:"e",code:"KeyE",keyCode:69},sp:{key:" ",code:"Space",keyCode:32},c:{key:"c",code:"KeyC",keyCode:67},r:{key:"r",code:"KeyR",keyCode:82},f:{key:"f",code:"KeyF",keyCode:70},tab:{key:"Tab",code:"Tab",keyCode:9}};
  const canvas=()=>$("c")||document.body;
  function key(type,k){ canvas().dispatchEvent(new KeyboardEvent(type,{key:k.key,code:k.code,keyCode:k.keyCode,which:k.keyCode,bubbles:true,cancelable:true})); }
  const held=new Set();
  function setKeys(want){
    for(const k of [...held]) if(!want.has(k)){ held.delete(k); key("keyup",KEYS[k]); }
    for(const k of want) if(!held.has(k)){ held.add(k); key("keydown",KEYS[k]); }
  }
  // Schwebender Stick: Basis erscheint dort, wo der Finger links unten aufsetzt.
  let jid=null, ox=0, oy=0;
  function jMove(e){
    let dx=e.clientX-ox, dy=e.clientY-oy; const R=60; const len=Math.hypot(dx,dy); if(len>R){dx=dx/len*R; dy=dy/len*R;}
    jk.style.transform=`translate(${dx}px,${dy}px)`;
    const want=new Set(); const t=0.35*R;
    if(dy<-t) want.add("w"); if(dy>t) want.add("s"); if(dx<-t) want.add("a"); if(dx>t) want.add("d");
    setKeys(want);
  }
  function jEnd(){ jid=null; jb.style.display="none"; jk.style.transform=""; setKeys(new Set()); }
  jz.addEventListener("pointerdown",e=>{ e.preventDefault(); jid=e.pointerId; jz.setPointerCapture(e.pointerId); ox=e.clientX; oy=e.clientY; jb.style.left=ox+"px"; jb.style.top=oy+"px"; jb.style.display="block"; });
  jz.addEventListener("pointermove",e=>{ if(e.pointerId===jid) jMove(e); });
  jz.addEventListener("pointerup",e=>{ if(e.pointerId===jid) jEnd(); });
  jz.addEventListener("pointercancel",jEnd);
  // Knoepfe rechts: halten = gedrueckt
  function mouse(type){ const c=canvas(); const r=c.getBoundingClientRect(); c.dispatchEvent(new MouseEvent(type,{button:0,buttons:type==="mouseup"?0:1,clientX:vx(),clientY:vy(),bubbles:true,cancelable:true})); }
  function vx(){ const r=canvas().getBoundingClientRect(); return r.left+r.width/2; }
  function vy(){ const r=canvas().getBoundingClientRect(); return r.top+r.height/2; }
  rb.querySelectorAll("button").forEach(b=>{
    if(b.id==="fire"){
      b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); b.setPointerCapture(e.pointerId); b.classList.add("on"); mouse("mousedown"); });
      b.addEventListener("pointerup",e=>{ e.preventDefault(); b.classList.remove("on"); mouse("mouseup"); });
      b.addEventListener("pointercancel",()=>{ b.classList.remove("on"); mouse("mouseup"); });
      return;
    }
    const k=KEYS[b.dataset.k]; let isDown=false;
    const down=()=>{ if(isDown) return; isDown=true; b.classList.add("on"); key("keydown",k); };
    const up=()=>{ if(!isDown) return; isDown=false; b.classList.remove("on"); key("keyup",k); };
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); down(); });
    b.addEventListener("pointerup",e=>{ e.preventDefault(); up(); });
    b.addEventListener("pointercancel",up); b.addEventListener("pointerleave",up);
  });
  // Pause (oben links)
  pz.addEventListener("click",()=>{ key("keydown",KEYS.tab); setTimeout(()=>key("keyup",KEYS.tab),80); });
  // Umsehen: Ziehen rechts oben, mit virtuellem Cursor, sanft gedaempft.
  let lid=null, lx=0, ly=0, accX=0, accY=0, raf=0, vX=0, vY=0;
  const MAX=18;
  function step(){
    let mx=Math.max(-MAX,Math.min(MAX,accX*0.3)), my=Math.max(-MAX,Math.min(MAX,accY*0.3));
    accX-=mx; accY-=my;
    if(Math.abs(mx)>0.01||Math.abs(my)>0.01){
      const r=canvas().getBoundingClientRect();
      vX=Math.max(r.left+2,Math.min(r.left+r.width-2,vX+mx)); vY=Math.max(r.top+2,Math.min(r.top+r.height-2,vY+my));
      canvas().dispatchEvent(new MouseEvent("mousemove",{clientX:vX,clientY:vY,movementX:mx,movementY:my,bubbles:true}));
    }
    if(lid!==null||Math.abs(accX)>0.5||Math.abs(accY)>0.5){ raf=requestAnimationFrame(step); } else { raf=0; accX=0; accY=0; }
  }
  ["touchstart","touchmove"].forEach(t=>look.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  look.addEventListener("pointerdown",e=>{ e.preventDefault(); lid=e.pointerId; lx=e.clientX; ly=e.clientY; vX=vx(); vY=vy(); look.setPointerCapture(e.pointerId); if(!raf) raf=requestAnimationFrame(step); });
  look.addEventListener("pointermove",e=>{ if(e.pointerId!==lid) return; accX+=e.clientX-lx; accY+=e.clientY-ly; lx=e.clientX; ly=e.clientY; });
  const endLook=e=>{ if(e.pointerId===lid) lid=null; };
  look.addEventListener("pointerup",endLook); look.addEventListener("pointercancel",endLook);
  function vx2(){ return vx(); } function vy2(){ return vy(); }
  function show(){ jz.classList.add("show"); rb.classList.add("show"); pz.classList.add("show"); look.classList.add("show"); }
  function hide(){ jz.classList.remove("show"); rb.classList.remove("show"); pz.classList.remove("show"); look.classList.remove("show"); jEnd(); }
  window.addEventListener("blur",hide);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") hide(); });
  // Erscheint in der Runde (Ausloeser je Spiel):
  document.addEventListener("pointerdown",e=>{
    if(!window.__ready) return; if(!(e.target.closest && e.target.closest("#wrap"))) return;
    if(e.target.closest && e.target.closest("#jz, #look, #rb, #pz")) return;
    const x=e.clientX, y=e.clientY, W=innerWidth, H=innerHeight;
    if(y>H*0.76 && y<H*0.86 && Math.abs(x-W*0.695)<W*0.08) show();
  },true);
})();
</script>
</body>

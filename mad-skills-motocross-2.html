<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mad Skills Motocross 2</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (über jsDelivr, mit Commit-Version fest verdrahtet).
// Kein lokaler Server nötig – die Datei funktioniert auch per Doppelklick.
const BASE = "https://cdn.jsdelivr.net/gh/55gms/assets@6915de137180a03ce3a0723144b063c2dfc5315f/misc/mad-skills-motocross-2/";
const MERGE_JS = "(function () {\n  \"use strict\";\n\n  const defaultConfig = {\n    files: [],\n    basePath: \"\",\n    debug: true,\n  };\n\n  const config = Object.assign(\n    {},\n    defaultConfig,\n    window.fileMergerConfig || {},\n  );\n  window.mergedFiles = window.mergedFiles || {};\n\n  const mergeStatus = {};\n  const mergeProgress = {};\n\n  let loadingDiv;\n  let loadingContent;\n\n  function initializeUI() { return;\n    loadingDiv = document.createElement(\"div\");\n    loadingDiv.id = \"file-merger-loading\";\n    loadingDiv.style.cssText = `\n      position: fixed;\n      top: 50%;\n      left: 50%;\n      transform: translate(-50%, -50%);\n      background: rgba(0, 0, 0, 0.9);\n      color: white;\n      padding: 30px 40px;\n      border-radius: 10px;\n      font-family: monospace;\n      font-size: 16px;\n      z-index: 10000;\n      min-width: 300px;\n      text-align: center;\n    `;\n\n    loadingContent = document.createElement(\"div\");\n    loadingContent.id = \"file-merger-content\";\n    loadingDiv.appendChild(loadingContent);\n    document.body.appendChild(loadingDiv);\n  }\n\n  function updateLoadingDisplay() { return;\n    if (!loadingContent) return;\n\n    const lines = [\n      '<div style=\"font-size: 18px; margin-bottom: 15px;\">loading...</div>',\n      '<a href=\"https://www.gn-math.dev/\" style=\"font-size: 15px; color: #d42222; text-decoration: underline; margin-bottom: 10px; display: block;\">gn-math</a>',\n      '<a href=\"https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/\" style=\"font-size: 15px; color: #14b4f3; text-decoration: underline; margin-bottom: 10px; display: block;\">ugs</a>',\n    ];\n\n    config.files.forEach((file) => {\n      const status = mergeStatus[file.name] || \"waiting\";\n      const progress = mergeProgress[file.name] || {\n        current: 0,\n        total: file.parts,\n      };\n\n      let statusText = \"\";\n      let color = \"#888\";\n\n      if (status === \"merging\") {\n        statusText = ` merging... ${progress.current}/${progress.total}`;\n        color = \"#ffa500\";\n      } else if (status === \"ready\") {\n        statusText = \"done\";\n        color = \"#00ff00\";\n      } else if (status === \"failed\") {\n        statusText = \"failed\";\n        color = \"#ff0000\";\n      } else {\n        statusText = \"Waiting...\";\n      }\n\n      lines.push(\n        `<div style=\"margin: 8px 0; color: ${color};\">${file.name}: ${statusText}</div>`,\n      );\n    });\n    loadingContent.innerHTML = lines.join(\"\");\n\n    const allDone = config.files.every(\n      (file) =>\n        mergeStatus[file.name] === \"ready\" ||\n        mergeStatus[file.name] === \"failed\",\n    );\n\n    if (allDone) {\n      setTimeout(() => {\n        loadingDiv.style.opacity = \"0\";\n        loadingDiv.style.transition = \"opacity 0.5s\";\n        setTimeout(() => loadingDiv.remove(), 500);\n      }, 1000);\n    }\n  }\n\n  function log(...args) {\n    if (config.debug) console.log(\"[FileMerger]\", ...args);\n  }\n\n  function error(...args) {\n    console.error(\"[FileMerger]\", ...args);\n  }\n\n  function normalizeUrl(url) {\n    try {\n      return decodeURIComponent(url.toString().split(\"?\")[0]);\n    } catch (e) {\n      return url;\n    }\n  }\n\n  function urlsMatch(url1, url2) {\n    const norm1 = normalizeUrl(url1);\n    const norm2 = normalizeUrl(url2);\n\n    if (norm1 === norm2) return true;\n    if (norm1.endsWith(norm2) || norm2.endsWith(norm1)) return true;\n\n    return norm1.split(\"/\").pop() === norm2.split(\"/\").pop();\n  }\n\n  async function mergeSplitFiles(filePath, numParts) {\n    const fileName = filePath.split(\"/\").pop();\n    mergeProgress[fileName] = { current: 0, total: numParts };\n    updateLoadingDisplay();\n\n    try {\n      const parts = [];\n      for (let i = 1; i <= numParts; i++) {\n        parts.push(`${filePath}.part${i}`);\n      }\n\n      log(`Merging ${filePath} from ${numParts} parts...`);\n\n      const buffers = [];\n      for (let i = 0; i < parts.length; i++) {\n        const response = await window.originalFetch(parts[i]);\n\n        if (!response.ok) {\n          if (response.status === 403 || response.status === 404) {\n            throw new Error(`Part missing: ${parts[i]}`);\n          }\n          throw new Error(\n            `failed to load sowwy (make a report in bug-reports in the discord) ${parts[i]}: ${response.status}`,\n          );\n        }\n\n        const buffer = await response.arrayBuffer();\n        buffers.push(buffer);\n\n        mergeProgress[fileName].current = i + 1;\n        updateLoadingDisplay();\n      }\n\n      const totalSize = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);\n      const mergedArray = new Uint8Array(totalSize);\n      let offset = 0;\n\n      for (const buffer of buffers) {\n        mergedArray.set(new Uint8Array(buffer), offset);\n        offset += buffer.byteLength;\n      }\n\n      log(` ${filePath} done: ${(totalSize / 1024 / 1024).toFixed(2)} MB`);\n      return mergedArray.buffer;\n    } catch (err) {\n      error(`Failed to merge ${filePath}:`, err);\n      throw err;\n    }\n  }\n\n  function shouldInterceptFile(url) {\n    const urlStr = normalizeUrl(url);\n    if (urlStr.includes(\".part\")) return null;\n\n    for (const file of config.files) {\n      const fileName = file.name;\n      const fullPath = config.basePath\n        ? `${config.basePath}${fileName}`\n        : fileName;\n\n      if (\n        urlsMatch(urlStr, fileName) ||\n        urlsMatch(urlStr, fullPath) ||\n        urlsMatch(urlStr, fileName + \".br\") ||\n        urlsMatch(urlStr, fullPath + \".br\")\n      ) {\n        return fileName;\n      }\n    }\n\n    return null;\n  }\n\n  function getMergedFile(filename) {\n    if (window.mergedFiles[filename]) return window.mergedFiles[filename];\n\n    for (const [key, value] of Object.entries(window.mergedFiles)) {\n      if (urlsMatch(key, filename)) return value;\n    }\n\n    return null;\n  }\n\n  if (!window.originalFetch) window.originalFetch = window.fetch;\n\n  window.fetch = function (url, ...args) {\n    const filename = shouldInterceptFile(url);\n\n    if (filename) {\n      log(\"Intercepting fetch for:\", filename);\n\n      return new Promise((resolve, reject) => {\n        const maxWait = 60000;\n        const startTime = Date.now();\n\n        const check = setInterval(() => {\n          const buffer = getMergedFile(filename);\n\n          if (buffer) {\n            clearInterval(check);\n            const contentType = filename.endsWith(\".wasm\")\n              ? \"application/wasm\"\n              : \"application/octet-stream\";\n            resolve(\n              new Response(buffer, {\n                status: 200,\n                statusText: \"OK\",\n                headers: {\n                  \"Content-Type\": contentType,\n                  \"Content-Length\": buffer.byteLength.toString(),\n                },\n              }),\n            );\n          } else if (mergeStatus[filename] === \"failed\") {\n            clearInterval(check);\n            reject(new Error(`Merge failed for ${filename}`));\n          } else if (Date.now() - startTime > maxWait) {\n            clearInterval(check);\n            reject(new Error(`Timeout waiting for ${filename}`));\n          }\n        }, 100);\n      });\n    }\n\n    return window.originalFetch.call(this, url, ...args);\n  };\n\n  if (!window.OriginalXMLHttpRequest)\n    window.OriginalXMLHttpRequest = window.XMLHttpRequest;\n\n  window.XMLHttpRequest = function (options) {\n    const xhr = new window.OriginalXMLHttpRequest(options);\n    const originalOpen = xhr.open;\n    const originalSend = xhr.send;\n    let requestUrl = \"\";\n\n    xhr.open = function (method, url, ...args) {\n      requestUrl = url;\n      return originalOpen.call(this, method, url, ...args);\n    };\n\n    xhr.send = function (...args) {\n      const filename = shouldInterceptFile(requestUrl);\n\n      if (filename) {\n        log(\"Intercepting XHR for:\", filename);\n\n        const waitForMerge = () => {\n          const buffer = getMergedFile(filename);\n\n          if (buffer) {\n            Object.defineProperties(xhr, {\n              status: { value: 200 },\n              statusText: { value: \"OK\" },\n              response: { value: buffer },\n              responseType: { value: \"arraybuffer\" },\n              readyState: { value: 4 },\n            });\n\n            setTimeout(() => {\n              if (xhr.onreadystatechange) xhr.onreadystatechange();\n              if (xhr.onload) xhr.onload({ type: \"load\", target: xhr });\n            }, 1);\n          } else if (mergeStatus[filename] === \"failed\") {\n            if (xhr.onerror) xhr.onerror(new Error(\"Merge Failed\"));\n          } else {\n            setTimeout(waitForMerge, 100);\n          }\n        };\n\n        waitForMerge();\n        return;\n      }\n\n      return originalSend.call(this, ...args);\n    };\n\n    return xhr;\n  };\n\n  async function autoMergeFiles() {\n    if (!config.files.length) return;\n\n    updateLoadingDisplay();\n\n    try {\n      const promises = config.files.map((file) => {\n        const fullPath = config.basePath\n          ? `${config.basePath}${file.name}`\n          : file.name;\n\n        mergeStatus[file.name] = \"merging\";\n        updateLoadingDisplay();\n\n        return mergeSplitFiles(fullPath, file.parts)\n          .then((buffer) => {\n            window.mergedFiles[file.name] = buffer;\n            window.mergedFiles[fullPath] = buffer;\n            mergeStatus[file.name] = \"ready\";\n            updateLoadingDisplay();\n          })\n          .catch((err) => {\n            mergeStatus[file.name] = \"failed\";\n            updateLoadingDisplay();\n            error(err);\n          });\n      });\n\n      await Promise.all(promises);\n    } catch (e) {\n      error(e);\n    }\n  }\n  function init() {\n    if (document.body) {\n      initializeUI();\n      autoMergeFiles();\n    } else {\n      if (document.readyState === \"loading\") {\n        document.addEventListener(\"DOMContentLoaded\", () => {\n          initializeUI();\n          autoMergeFiles();\n        });\n      } else {\n        setTimeout(init, 10);\n      }\n    }\n  }\n\n  init();\n})();\n\n;try{Object.assign(window.XMLHttpRequest,{UNSENT:0,OPENED:1,HEADERS_RECEIVED:2,LOADING:3,DONE:4});window.XMLHttpRequest.prototype=window.OriginalXMLHttpRequest.prototype;}catch(e){}\n";
const SHIM = '<script>window.fileMergerConfig={files:[{name:"0dbaa831198375b1e4861b7868f73a4580740180.zip",parts:3}],basePath:"' + BASE + '",debug:false};<\/script><script>' + MERGE_JS + '<\/script>';
fetch(BASE + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    // eigene Teile-Zusammensetzung statt der Seite der Originalquelle; Version auf festen Stand setzen
    html = html.replace(/<script src="\/assets\/js\/game-parts\.js[^"]*"><\/script>/, "");
    html = html.replace(/<script>\s*GameParts\.serve\([\s\S]*?\);\s*<\/script>/, "");
    html = html.replace(/@main\//g, "@6915de137180a03ce3a0723144b063c2dfc5315f/");
    html = html.replace('<script defer src="poki-sdk.js" onload="poki_sdk_loaded()"><\/script>', () => '<script defer src="poki-sdk.js" onload="try{PokiSDK.rewardedBreak=function(){return Promise.resolve(true)}}catch(e){}poki_sdk_loaded()"><\/script>');
    html = html.replace("<head>", () => '<head><base href="' + BASE + '">' + SHIM);
    document.getElementById("game").srcdoc = html;
  })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

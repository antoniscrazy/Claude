<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solar Smash</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; background: #000; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *" allowfullscreen></iframe>
<script>
// Spiel aus deinem GitHub-Repo: index.html + grosse Dateien ueber raw.githubusercontent.com, Loader/Framework ueber jsDelivr (Skripte). Commit fest.
const RAW = "https://raw.githubusercontent.com/antoniscrazy/Claude/d4b259d35bb6ab57ef1500947afb8694f06a26d5/solar-smash/";
const JSD = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@a403b636f4218eb1207a92ecf661003bfb53d643/solar-smash/";
const PRE = '<base href="' + RAW + '"><script>window.__JSD=' + JSON.stringify(JSD) + ';window.__RAW=' + JSON.stringify(RAW) + ';(function(){var OK=[' + JSON.stringify(new URL(RAW).origin) + ',"https://cdn.jsdelivr.net"];function ok(u){try{var x=new URL(String(u),location.href);return x.protocol==="blob:"||x.protocol==="data:"||x.protocol==="about:"||OK.indexOf(x.origin)>=0}catch(e){return true}}var o=XMLHttpRequest.prototype.open,s=XMLHttpRequest.prototype.send;XMLHttpRequest.prototype.open=function(m,u){this._b=!ok(u);return o.apply(this,arguments)};XMLHttpRequest.prototype.send=function(){if(!this._b)return s.apply(this,arguments);var x=this;setTimeout(function(){x.dispatchEvent(new ProgressEvent("error"));x.dispatchEvent(new ProgressEvent("loadend"))},0)};var f=window.fetch;window.fetch=function(r){return ok(r&&r.url||r)?f.apply(this,arguments):Promise.reject(new TypeError("Failed to fetch"))};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false};window.open=function(){return null}})()<\/script>';
fetch(RAW + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => { document.getElementById("game").srcdoc = html.replace("<head>", () => "<head>" + PRE); })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

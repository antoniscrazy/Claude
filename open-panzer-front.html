<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Open Panzer Front</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *; pointer-lock *; clipboard-write *" allowfullscreen></iframe>
<script>
// Lädt das Spiel direkt aus deinem GitHub-Repo (raw.githubusercontent.com, Commit fest verdrahtet). Kein Server, keine Werbung.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/27ba516ce3d1ceb6faa16edb53d84932acfd8132/open-panzer-front/";
const esc = t => t.replace(/<\/script/gi, "<\\/script");
Promise.all([fetch(BASE + "game.js").then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }), fetch(BASE + "game.css").then(r => r.text())])
.then(([js, css]) => {
  const html = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="' + BASE + '"><title>Open Panzer Front</title><style>' + css + '</style></head><body><div id="root"></div><script type="module">' + esc(js) + '<\/script></body></html>';
  document.getElementById("game").srcdoc = html;
}).catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ultimate Car Driving</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #ld { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: 70%; max-width: 360px; }
  #pb { height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 8px; }
  #pf { height: 100%; width: 0; background: #00e5a8; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }

  /* Touch-Steuerung */
  #tc { display:none; position:absolute; inset:0; pointer-events:none; z-index:5; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
  body.touch #tc.on { display:block; }
  .tb { position:absolute; pointer-events:auto; touch-action:none; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:50%; background:rgba(0,0,0,.42); border:2px solid rgba(255,255,255,.55); color:#fff; font:700 12px system-ui,sans-serif; }
  .tb.act { background:rgba(0,229,168,.6); }
  #t-left { left:18px; bottom:24px; width:96px; height:96px; font-size:34px; }
  #t-right { left:128px; bottom:24px; width:96px; height:96px; font-size:34px; }
  #t-gas { right:18px; bottom:140px; width:104px; height:104px; background:rgba(0,200,120,.5); font-size:34px; }
  #t-brake { right:18px; bottom:24px; width:104px; height:104px; background:rgba(230,60,60,.5); flex-direction:column; font-size:30px; }
  #t-brake small { font-size:10px; }
  #t-hand { right:136px; bottom:24px; width:68px; height:68px; }
  #t-boost { right:136px; bottom:100px; width:60px; height:60px; }
  #t-cam { right:210px; bottom:24px; width:56px; height:56px; }
  #t-reset { right:210px; bottom:88px; width:56px; height:56px; }
  #t-lite { right:210px; bottom:152px; width:56px; height:56px; }
  #tgl { display:none; position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:9; padding:6px 12px; border-radius:999px; border:0; background:rgba(0,0,0,.55); color:#fff; font:700 12px system-ui,sans-serif; }
  body.touch #tgl { display:block; }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas><div id="tc" class="on">
<div class="tb" id="t-left" data-k="ArrowLeft" data-c="37">&#9664;</div><div class="tb" id="t-right" data-k="ArrowRight" data-c="39">&#9654;</div>
<div class="tb" id="t-gas" data-k="ArrowUp" data-c="38">&#9650;</div>
<div class="tb" id="t-brake" data-k="ArrowDown" data-c="40">&#9660;<small>BREMSE</small></div>
<div class="tb" id="t-hand" data-k=" " data-code="Space" data-c="32">HAND-<br>BREMSE</div>
<div class="tb" id="t-boost" data-k="Shift" data-code="ShiftLeft" data-c="16">BOOST</div>
<div class="tb" id="t-cam" data-k="c" data-code="KeyC" data-c="67">KAMERA</div>
<div class="tb" id="t-reset" data-k="r" data-code="KeyR" data-c="82">RESET</div>
<div class="tb" id="t-lite" data-k="l" data-code="KeyL" data-c="76">LICHT</div></div>
<button id="tgl">Steuerung AUS</button>
<div id="ld"><div id="tx">Lade Spiel …</div><div id="pb"><div id="pf"></div></div></div></div>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (raw.githubusercontent.com, Commit fest verdrahtet). Kein Server, keine Werbung.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/820d15a1e945787f68d88803c45c07357b52ee2f/ultimate-car-driving/Build/";
const tx = document.getElementById("tx"), pf = document.getElementById("pf");
let done = 0; const TOTAL = 6;
function bump() { done++; pf.style.width = (done / TOTAL * 60) + "%"; }
async function merged(name, n) {
  const bufs = await Promise.all(Array.from({length: n}, (_, i) =>
    fetch(BASE + name + ".part" + (i + 1)).then(r => { if (!r.ok) throw new Error(name + " Teil " + (i + 1) + ": " + r.status); return r.arrayBuffer(); }).then(b => { bump(); return b; })));
  return URL.createObjectURL(new Blob(bufs));
}
(async () => {
  try {
    const [dataUrl, codeBuf, fw, loaderTxt] = await Promise.all([
      merged("game.data", 5),
      fetch(BASE + "game.wasm").then(r => r.arrayBuffer()).then(b => { bump(); return b; }),
      fetch(BASE + "game.framework.js").then(r => r.blob()),
      fetch(BASE + "game.loader.js").then(r => r.text())
    ]);
    const s = document.createElement("script"); s.textContent = loaderTxt; document.body.appendChild(s);
    tx.textContent = "Starte …";
    await createUnityInstance(document.getElementById("c"), {
      dataUrl, codeUrl: URL.createObjectURL(new Blob([codeBuf], {type: "application/wasm"})),
      frameworkUrl: URL.createObjectURL(fw),
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Gamebol", productName: "Ultimate Car Driving", productVersion: "1.0"
    }, p => { pf.style.width = (60 + p * 40) + "%"; });
    document.getElementById("ld").remove();
  } catch (e) { tx.textContent = "Fehler beim Laden: " + (e.message || e); }
})();

// ===== Touch-Steuerung: schickt Tastendrücke an das Spiel =====
(function () {
  const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (!isTouch) return;
  document.body.classList.add("touch");
  const canvas = document.getElementById("c"), tc = document.getElementById("tc"), tgl = document.getElementById("tgl");
  const down = {};
  function key(k, code, kc, isDown) {
    if (!!down[kc] === isDown) return; down[kc] = isDown;
    const e = new KeyboardEvent(isDown ? "keydown" : "keyup", { key: k, code: code, bubbles: true, cancelable: true });
    Object.defineProperty(e, "keyCode", { get: () => kc }); Object.defineProperty(e, "which", { get: () => kc });
    canvas.dispatchEvent(e);
  }
  tc.querySelectorAll(".tb").forEach(el => {
    const k = el.dataset.k, kc = +el.dataset.c, code = el.dataset.code || k;
    const ids = new Set();
    el.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); for (const t of e.changedTouches) ids.add(t.identifier); el.classList.add("act"); key(k, code, kc, true); }, { passive: false });
    const up = e => { e.preventDefault(); for (const t of e.changedTouches) ids.delete(t.identifier); if (!ids.size) { el.classList.remove("act"); key(k, code, kc, false); } };
    el.addEventListener("touchend", up, { passive: false }); el.addEventListener("touchcancel", up, { passive: false });
  });
  tc.addEventListener("contextmenu", e => e.preventDefault());
  tgl.onclick = () => { const on = tc.classList.toggle("on"); tgl.textContent = on ? "Steuerung AUS" : "Steuerung AN"; if (!on) tc.querySelectorAll(".tb").forEach(el => key(el.dataset.k, el.dataset.code || el.dataset.k, +el.dataset.c, false)); };
  // Zoomen/Doppeltipp verhindern
  ["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let le = 0; document.addEventListener("touchend", e => { const n = Date.now(); if (n - le < 350) e.preventDefault(); le = n; }, { passive: false });
})();

window.open = () => null;
</script>
</body>
</html>

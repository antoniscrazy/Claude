<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Johnny Trigger – Nachbau</title>
<style>
:root{--pur:#6a30c4;--purd:#4b1d8f;--or:#ff9a1a;--orl:#ffc15f}
html,body{margin:0;height:100%;background:#8fd0ff;overflow:hidden;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.card{position:absolute;left:50%;top:14px;transform:translateX(-50%);border:3px solid var(--purd);border-radius:16px;overflow:hidden;background:linear-gradient(var(--orl),var(--or));box-shadow:0 4px 0 var(--purd),0 8px 18px rgba(0,0,0,.3);min-width:230px}
.card .h{background:linear-gradient(#8a4fe0,var(--pur));color:#fff;text-align:center;font-weight:900;font-size:14px;letter-spacing:1px;padding:5px 10px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.card .b{display:flex;align-items:center;gap:10px;padding:8px 12px}
.card .ic{width:38px;height:38px;border-radius:10px;background:#34265a;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--purd)}
.card .t{flex:1;background:#fff3dc;border-radius:10px;padding:8px 10px;text-align:center;font-weight:900;font-size:13px;color:#5a3a00}
#crosshair{position:absolute;left:50%;top:50%;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;border:5px solid #ffd23f;box-shadow:0 0 0 2px rgba(75,29,143,.55),inset 0 0 0 2px rgba(75,29,143,.35);transition:opacity .15s}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#ffd23f;box-shadow:0 0 0 1px rgba(75,29,143,.55)}
#crosshair:before{left:50%;top:-14px;width:4px;height:114px;margin-left:-2px;clip-path:polygon(0 0,100% 0,100% 28%,0 28%,0 72%,100% 72%,100% 100%,0 100%)}
#crosshair:after{top:50%;left:-14px;height:4px;width:114px;margin-top:-2px;clip-path:polygon(0 0,28% 0,28% 100%,0 100%,72% 0,100% 0,100% 100%,72% 100%)}
#ammo{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:6px;background:rgba(40,20,80,.55);padding:8px 12px;border-radius:14px;border:2px solid rgba(255,255,255,.35)}
#ammo .b{width:10px;height:26px;border-radius:5px 5px 2px 2px;background:#555;border:2px solid #222}#ammo .b.on{background:linear-gradient(#ffe27a,#f0a800)}
#ammo span{color:#fff;font-weight:900;font-size:12px;margin-left:6px}
#zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
#zoom button{width:56px;height:56px;border:3px solid var(--purd);border-bottom-width:6px;border-radius:50%;background:linear-gradient(#c58cff,#8a4fe0);color:#fff;font:900 26px/1 inherit;text-shadow:0 2px 0 rgba(0,0,0,.35);cursor:pointer}
#zoom button:active{transform:translateY(2px);border-bottom-width:4px}
#zoomval{color:#fff;font-weight:900;font-size:13px;text-shadow:0 2px 0 var(--purd),0 0 4px var(--purd)}
#hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;font-weight:900;font-size:13px;text-shadow:0 2px 0 var(--purd),0 0 4px var(--purd);text-align:center;white-space:nowrap}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,50,.45);pointer-events:auto}.ov.on{display:flex}
.pop{width:min(86vw,340px);border:3px solid var(--purd);border-radius:22px;overflow:hidden;background:linear-gradient(var(--orl),var(--or));box-shadow:0 6px 0 var(--purd),0 18px 40px rgba(0,0,0,.45);text-align:center}
.pop .h{background:linear-gradient(#8a4fe0,var(--pur));color:#fff;font-weight:900;font-size:22px;letter-spacing:1px;padding:12px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pop.bad .h{background:linear-gradient(#ff8a7a,#e0301f)}
.pop .m{padding:16px 14px 6px;color:#5a3a00;font-weight:900;font-size:16px}
.pop .rw{margin:6px auto 4px;display:inline-block;background:#fff3dc;border:3px solid var(--purd);border-radius:14px;padding:8px 18px;font-size:26px;color:#2fa01a;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pop .hs{display:none;color:#c0300f;font-size:13px;margin:2px 0 4px}
.btn{display:block;margin:12px auto 16px;width:78%;padding:13px;border:3px solid rgba(0,0,0,.28);border-bottom-width:6px;border-radius:16px;background:linear-gradient(#7CFF4B,#2fbf1d);color:#fff;font:900 18px/1 inherit;text-shadow:0 2px 0 rgba(0,0,0,.3);cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:4px}.pop.bad .btn{background:linear-gradient(#ffe45c,#f0b400);color:#5a3a00;text-shadow:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="card"><div class="h">MISSION 1</div><div class="b"><div class="ic">🕶️</div><div class="t">SHOOT ALL THUGS</div></div></div>
  <div id="crosshair"></div>
  <div id="ammo"></div>
  <div id="zoom"><button id="zin" aria-label="Zoom +">+</button><div id="zoomval">1.6x</div><button id="zout" aria-label="Zoom −">−</button></div>
  <div id="hint">Ziehen = zielen · Loslassen = schießen</div>
</div>
<div id="win" class="ov"><div class="pop"><div class="h">LEVEL COMPLETED</div><div class="m">Alle Gangster erledigt!</div><div class="rw">💰 +<span id="rewardv">0</span></div><div class="hs" id="hs">★ HEADSHOT BONUS +30 ★</div><button class="btn" id="next">NÄCHSTES LEVEL</button></div></div>
<div id="lose" class="ov"><div class="pop bad"><div class="h">LEVEL FAILED</div><div class="m" id="failmsg">…</div><button class="btn" id="retry">NOCHMAL</button></div></div>
<script type="module" src="./game.bundle.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickman GTA City</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (über jsDelivr, mit Commit-Version fest verdrahtet).
// Kein lokaler Server nötig – die Datei funktioniert auch per Doppelklick.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/7f95212f518d6442ea6d14f6fca3a9ae531a02a9/stickman-gta/Build/";
const ADS_JS = "// Keine Werbung: Zwischenwerbung entf\u00e4llt, Belohnungen (Rewarded Ads) gelten sofort als angesehen.\nwindow.gameInstance = null;\nfunction InitApi(_appId) {}\nfunction InitExternEval(_appId) {}\nfunction ExternEval() {}\nfunction ExternEvalResumeGame() { try { window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"AdMessage\", \"onClose\"); } catch (e) {} }\nfunction PreloadRewarded() { setTimeout(function () { try { window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"RewardedReady\"); } catch (e) {} }, 100); }\nfunction ShowRewarded() {\n  try {\n    window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"AdMessage\", \"onOpen\");\n    window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"AdMessage\", \"RewardedOnRewarded\");\n    window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"AdMessage\", \"onClose\");\n  } catch (e) {}\n  setTimeout(function () { try { window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"RewardedReady\"); } catch (e) {} }, 300);\n}\nfunction RewardedReady() { try { window.gameInstance.SendMessage(\"FreezeNovaAPI\", \"RewardedReady\"); } catch (e) {} }\nfunction SubmitLeaderboardScore(s) {}\nfunction GetLeaderboardEntries() {}\n// Controller-Zugriff und Links nach au\u00dfen sperren\ntry { var _g = navigator.getGamepads ? navigator.getGamepads.bind(navigator) : null; navigator.getGamepads = function () { try { return _g ? _g() : []; } catch (e) { return []; } }; } catch (e) {}\nwindow.open = function () { return null; };\n";
const START_JS = "var canvas = document.querySelector(\"#unity-canvas\");\nvar config = { dataUrl: \"https://raw.githubusercontent.com/antoniscrazy/Claude/7f95212f518d6442ea6d14f6fca3a9ae531a02a9/stickman-gta/Build/game.data\", frameworkUrl: \"https://raw.githubusercontent.com/antoniscrazy/Claude/7f95212f518d6442ea6d14f6fca3a9ae531a02a9/stickman-gta/Build/game.framework.js\", codeUrl: \"https://raw.githubusercontent.com/antoniscrazy/Claude/7f95212f518d6442ea6d14f6fca3a9ae531a02a9/stickman-gta/Build/game.wasm\", streamingAssetsUrl: \"https://raw.githubusercontent.com/antoniscrazy/Claude/7f95212f518d6442ea6d14f6fca3a9ae531a02a9/stickman-gta/StreamingAssets\", companyName: \"Game\", productName: \"Stickman GTA City\", productVersion: \"0.1\" };\nfunction progressHandler(p) { var pc = p * 100 + \"%\"; canvas.style.background = \"linear-gradient(to right, white, white \" + pc + \", transparent \" + pc + \", transparent) no-repeat center\"; canvas.style.backgroundSize = \"100% 1rem\"; }\nfunction onResize() {\n  var c = canvas.parentElement, w = window.innerWidth, h, r = 540 / 960;\n  if (w * r > window.innerHeight) w = Math.min(w, Math.ceil(window.innerHeight / r));\n  h = Math.floor(w * r);\n  c.style.width = canvas.style.width = w + \"px\"; c.style.height = canvas.style.height = h + \"px\";\n  c.style.top = Math.floor((window.innerHeight - h) / 2) + \"px\"; c.style.left = Math.floor((window.innerWidth - w) / 2) + \"px\";\n}\ncreateUnityInstance(canvas, config, progressHandler).then(function (inst) { canvas = inst.Module.canvas; onResize(); window.gameInstance = inst; });\nwindow.addEventListener(\"resize\", onResize); onResize();\n";
fetch(BASE + "game.loader.js")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(loader => {
    const esc = s => s.replace(/<\/script>/gi, "<\\/script>");
    const html = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}#gameContainer{background:transparent !important;position:absolute}#gameContainer canvas{position:absolute}</style></head><body>' +
      '<div id="gameContainer"><canvas id="unity-canvas"></canvas></div>' +
      '<script>' + esc(ADS_JS) + '<\/script><script>' + esc(loader) + '<\/script><script>' + esc(START_JS) + '<\/script></body></html>';
    document.getElementById("game").srcdoc = html;
  })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moki – Spiele</title>
<style>
:root{--bg:#0b1033;--panel:#141a4a;--panel2:#1c2360;--text:#fff;--muted:#9aa3d6;--accent:#00e5a8;--accent2:#ffd23f;--r:18px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:rgba(11,16,51,.92);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff14}
.logo{font-weight:900;font-size:28px;letter-spacing:-1px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;padding:11px 18px;border-radius:999px;border:2px solid transparent;background:var(--panel);color:var(--text);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.badge{font-size:12px;color:var(--muted);border:1px solid #ffffff22;padding:4px 10px;border-radius:999px}
main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
h2{font-size:22px;margin:28px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:var(--panel);color:var(--muted);border:0;font-size:14px;cursor:pointer;font-weight:600}
.chip.on,.chip:hover{background:var(--accent);color:#04201a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px #0006}
.tile:hover{transform:scale(1.06);box-shadow:0 10px 28px #000a}
.tile .em{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;filter:drop-shadow(0 4px 6px #0006)}
.tile .name{position:relative;width:100%;padding:28px 12px 10px;font-weight:800;background:linear-gradient(transparent,#000b)}
.hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,300px));gap:16px}
.hero .tile{aspect-ratio:1}
.hero .tile .em{font-size:110px}
.hero .tile .name{font-size:24px}
.empty{color:var(--muted);padding:30px 0}
/* Spielseite */
.play{display:grid;grid-template-columns:1fr 300px;gap:20px}
.frame{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;position:relative;box-shadow:0 8px 30px #0008}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;align-items:center;gap:12px;margin-top:12px}
.bar h1{font-size:24px;flex:1}
.btn{background:var(--panel2);color:var(--text);border:0;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{background:var(--accent);color:#04201a}
.side{background:var(--panel);border-radius:var(--r);padding:18px}
.side p{color:var(--muted);line-height:1.5;margin-top:8px}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);font-weight:600}
.back:hover{color:var(--accent)}
@media(max-width:850px){.hero,.play{grid-template-columns:1fr}.badge{display:none}.frame{aspect-ratio:4/3}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .tile img{object-position:center}

</style>
</head>

let category = "Alle";

const tile = g => `<a class="tile" href="${g.url}" style="background:linear-gradient(135deg,${g.colors[0]},${g.colors[1]})">${g.image ? `<img src="${g.image}" alt="">` : `<span class="em">${g.emoji}</span>`}<span class="name">${g.title}</span></a>`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function home() {
  const q = search.value.trim().toLowerCase();
  const cats = ["Alle", ...new Set(games.map(g => g.category))];
  let list = games.filter(g => (category === "Alle" || g.category === category) && g.title.toLowerCase().includes(q));
  const feat = games.filter(g => g.featured);
  app.innerHTML = `
    ${!q && category === "Alle" && feat.length ? `<h2>⭐ Empfohlen</h2><div class="hero">${feat.map(g => tile(g, true)).join("")}</div>` : ""}
    <h2>Alle Spiele</h2>
    <div class="chips">${cats.map(c => `<button class="chip ${c === category ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div style="height:16px"></div>
    ${list.length ? `<div class="grid">${list.map(g => tile(g)).join("")}</div>` : `<p class="empty">Kein Spiel gefunden.</p>`}`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { category = b.dataset.c; home(); });
}

function route() {
  document.title = "Moki – Spiele";
  home();
}
search.addEventListener("input", () => { home(); });
addEventListener("hashchange", route);
route();

</script>
</body>
</html>

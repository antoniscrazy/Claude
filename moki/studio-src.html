<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moki Studio</title>
<!--ICON-->
<meta name="theme-color" content="#0a0d2b">
<style>
/*CSS*/
</style>
</head>
<body>
<header id="top">
  <a class="logo" id="logo-link" href="#" aria-label="Moki Studio"><!--LOGO--></a>
  <span class="chip">Studio</span>
  <span class="sp"></span>
  <button class="who" id="btn-who" type="button" title="Name ändern" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="who-name"></span></button>
  <button class="btn ghost sm" id="btn-key" type="button" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>Schlüssel</button>
  <a class="btn ghost sm" id="btn-moki" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Zu Moki</a>
</header>

<main id="view-dash" hidden></main>

<main id="view-edit" hidden>
  <div class="etop">
    <button class="btn ghost sm" id="e-back" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Meine Spiele</button>
    <input class="ti" id="e-title" type="text" maxlength="60" placeholder="Name deines Spiels" aria-label="Spielname">
    <span class="state" id="e-state"></span>
    <span class="sp"></span>
    <button class="btn ghost" id="e-dl" type="button" title="Als eigene HTML-Datei speichern"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>HTML-Datei</button>
    <button class="btn" id="e-run" type="button" title="Strg+Enter"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Neu starten</button>
    <button class="btn pri" id="e-save" type="button" title="Strg+S"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Speichern</button>
    <button class="btn warn" id="e-pub" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9M8 16l4-4 4 4"/></svg><span id="e-pub-t">Veröffentlichen</span></button>
  </div>
  <div class="emain">
    <section class="left">
      <div class="ltabs">
        <button class="tab on" data-tab="builder" type="button">Baukasten</button>
        <button class="tab" data-tab="code" type="button">Code</button>
      </div>
      <div class="pane" id="pane-builder"></div>
      <div class="pane" id="pane-code" hidden style="display:none;flex-direction:column"></div>
    </section>
    <section class="right">
      <div class="stage"><iframe id="prev" title="Vorschau" sandbox="allow-scripts"></iframe></div>
      <div class="cons"><div class="ch"><span>Konsole</span><button id="cons-clear" type="button">Leeren</button></div><div id="cons"></div></div>
    </section>
  </div>
</main>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/*CONFIG*/
</script>
<script>
/*JS*/
</script>
</body>
</html>

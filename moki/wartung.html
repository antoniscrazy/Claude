<style>
  :root{--bg:#0a0d2b;--panel:#141a4a;--text:#fff;--muted:#a3abe0;--accent:#00e5a8;--accent2:#ffd23f}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:grid;place-items:center;padding:24px;overflow:hidden;color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(900px 500px at 80% -10%,#23307a66,transparent 60%),radial-gradient(800px 500px at -10% 90%,#0a7a7a44,transparent 60%),var(--bg)}
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;animation:float 12s ease-in-out infinite}
  .b1{width:320px;height:320px;background:var(--accent);left:-80px;top:12%}
  .b2{width:280px;height:280px;background:var(--accent2);right:-60px;bottom:8%;animation-delay:-5s}
  @keyframes float{50%{transform:translate(30px,-40px)}}
  .card{position:relative;max-width:560px;width:100%;text-align:center;padding:48px 32px 40px;background:#141a4acc;border:1px solid #ffffff14;border-radius:28px;backdrop-filter:blur(8px);box-shadow:0 20px 60px #000a}
  .logo{width:240px;margin:0 auto}.logo svg{width:100%;height:auto;display:block}
  .tag{display:inline-block;margin:18px 0 16px;padding:6px 14px;border-radius:999px;border:1px solid #ffd23f66;background:#3a2e08;color:#ffe9a0;font-size:14px;font-weight:700}
  h1{font-size:30px;line-height:1.2;margin-bottom:14px}
  p{color:var(--muted);font-size:17px;line-height:1.6}
  .bar{margin:30px auto 0;height:10px;max-width:340px;border-radius:999px;background:#ffffff14;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:run 2.2s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  .small{margin-top:22px;font-size:14px;opacity:.8}
  @media (prefers-reduced-motion:reduce){.blob,.bar i{animation:none}.bar i{width:60%}}
  @media (max-width:480px){.logo{width:200px}h1{font-size:24px}.card{padding:36px 22px 30px}}
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <main class="card">
    <div class="logo" role="img" aria-label="Moki"><svg viewBox="-14 -20 392 170" ><defs><linearGradient id="wlg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="362" y2="0"><stop offset="0" stop-color="#00e5a8"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs><g fill="none" stroke="url(#wlg)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 120V70C12 52 22 44 38 44S64 52 64 70V120"/>
<path d="M64 70C64 52 74 44 90 44S116 52 116 70V120"/>
<circle cx="192" cy="82" r="38"/>
<path d="M268 12V120"/><path d="M268 90L304 48"/><path d="M286 74L310 120"/>
<path d="M350 44V120"/>
</g>
<circle cx="350" cy="6" r="14" fill="url(#wlg)"/>
<path d="M183 66L207 82L183 98Z" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></svg></div>
    <div class="tag">Update in Arbeit</div>
    <h1>Moki bekommt ein großes Update</h1>
    <p>Wir bauen gerade um und bringen neue Spiele und Verbesserungen mit.<br>Die Seite ist <b style="color:#fff">bald wieder erreichbar</b>.</p>
    <div class="bar" role="progressbar" aria-label="Update läuft"><i></i></div>
    <p class="small">Schau später noch einmal vorbei.</p>
  </main>
</body>

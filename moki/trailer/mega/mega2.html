<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1280" height="720"></canvas>
<script>
// Trailer zum Mega-Update v2 (90 s, 128 BPM). render(t) zeichnet Sekunde t. Schnitte sitzen auf dem Beat.
const W=1280,H=720,c=document.getElementById('c'),x=c.getContext('2d');
const BPM=128,B=60/BPM;
const NEW=['stick-defenders','ragdoll-chaos','master-chess','ping-pong-go','murder','blumgi-slime','stickman-battle','longcat','ovo-classic','beach-boxing-simulator','idle-mining-empire','car-circle','pilot-life','kiwi-clicker','plonky','country-balls-world-war','american-football-real','capitalist-bus-driver','idle-startup-tycoon','mad-stick','sausage-flip','perfect-landing','ragdoll-fall','2048-merge','sandboxels','idle-success','harvest-loop','blumgi-splash','stickman-climb-2','blumgi-bounce'];
const ACC='#00e5a8',ACC2='#ffd23f',PINK='#ff4d8d',BG='#070a22',TXT='#ffffff';
const IMG={},LOGO=new Image();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),4);
const back=t=>{t=clamp(t);const s=2.2;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function ft(sz,w=900){return `${w} ${sz}px "Segoe UI",Impact,system-ui,sans-serif`}
function txt(s,px,py,sz,col=TXT,al='center',w=900,a=1,sc=1){x.save();x.globalAlpha=a;x.translate(px,py);x.scale(sc,sc);x.font=ft(sz,w);x.textAlign=al;x.textBaseline='middle';x.lineWidth=sz*.12;x.strokeStyle='#000a';x.strokeText(s,0,0);x.fillStyle=col;x.fillText(s,0,0);x.restore()}
function slam(s,t0,px,py,sz,col=TXT,al='center'){ // Wort landet beim Einsatz und federt
  const k=clamp((t0.t-t0.at)/0.22);if(t0.t<t0.at)return;
  txt(s,px,py,sz,col,al,900,clamp(k*3),back(k));
}
function flash(t,at,a=.6){const k=t-at;if(k<0||k>.3)return;x.save();x.globalAlpha=a*(1-k/.3);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.restore()}
function shake(t,amp){const k=Math.exp(-((t%B))*6);return {dx:Math.sin(t*90)*amp*k,dy:Math.cos(t*77)*amp*k}}
function bgFx(t){
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  const beatPhase=(t%B)/B,pulse=Math.exp(-beatPhase*5);
  for(let i=0;i<14;i++){ // Partikel steigen
    const px=rnd(i*3+1)*W,py=H-((t*(60+rnd(i)*120)+rnd(i*7)*H)%(H+40));
    x.globalAlpha=.25+.5*pulse;x.fillStyle=i%3?ACC:ACC2;x.beginPath();x.arc(px,py,3+rnd(i+9)*5,0,7);x.fill();
  }
  x.globalAlpha=.25+.25*pulse;const g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,700);g.addColorStop(0,'#00e5a844');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=1;
}
function tileWall(t,speed,al){
  const cols=6,tw=180,th=180,gap=12,sx=(W-(cols*tw+(cols-1)*gap))/2;
  x.save();x.globalAlpha=al;
  for(let c2=0;c2<cols;c2++){
    const dir=c2%2?1:-1,off=(t*speed*dir)%(th+gap),base=c2*5;
    for(let r=-1;r<6;r++){
      const idx=(base+r+100*NEW.length)%NEW.length,im=IMG[NEW[idx]];
      const px=sx+c2*(tw+gap),py=r*(th+gap)+off-40;
      x.save();x.beginPath();x.roundRect(px,py,tw,th,16);x.clip();
      if(im&&im.width){const s=Math.max(tw/im.width,th/im.height);x.drawImage(im,px+(tw-im.width*s)/2,py+(th-im.height*s)/2,im.width*s,im.height*s)}
      else{x.fillStyle='#1d2566';x.fillRect(px,py,tw,th)}
      x.restore();
    }
  }
  x.restore();
}
function fullTile(t,idx,a){const im=IMG[NEW[idx%NEW.length]];x.save();x.globalAlpha=a;if(im&&im.width){const s=Math.max(W/im.width,H/im.height)*1.08;x.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s)}x.fillStyle='#0008';x.fillRect(0,0,W,H);x.restore()}
function render(t){
  const sh=shake(t,14);
  x.save();x.translate(sh.dx,sh.dy);
  bgFx(t);
  // 0–7.5: Logo-Einstieg + Titel-Slam
  if(t<7.5){
    const k=clamp(t/1.0);
    if(t>=0.2){x.save();x.globalAlpha=clamp((t-0.2)/.3);x.drawImage(LOGO,W/2-LOGO.width*0.22*1.0*1.2,H/2-200,LOGO.width*0.22*1.2,LOGO.height*0.22*1.2);x.restore()}
    const words=[['DAS',1.5],['MEGA',1.5+B],['UPDATE',1.5+2*B]];
    words.forEach(([w,at])=>{const tt={t,at};slam(w,tt,W/2,H/2+160+(w==='DAS'?-120:(w==='MEGA'?-40:40)),w==='DAS'?70:100,w==='MEGA'?ACC:TXT)});
    if(t>=1.5 && t<1.5+3*B) flash(t,1.5,.35);
    if(t>=7.0) flash(t,7.0,.9);
  }
  // 7.5–20: Spielewand, 30 neue Spiele
  if(t>=7.5&&t<20){
    const a=clamp((t-7.5)/.3)*clamp((20-t)/.3);
    tileWall(t,260,a);
    x.save();x.globalAlpha=.85;x.fillStyle='#070a22';x.fillRect(W/2-330,H/2-70,660,140);x.restore();
    const at=7.5+B*.5;const tt={t,at};slam('NEUE SPIELE',tt,W/2,H/2,110,ACC2);
    if(t>=20-.3)flash(t,19.7,.8);
  }
  // 20–30: Vorteile, Schnitt auf jeden Takt
  if(t>=20&&t<30){
    const items=[['PROBLEME','BEHOBEN',ACC],['SPIELE','WIEDER DA',ACC2],['OHNE','WERBUNG',PINK]];
    const i=Math.floor((t-20)/(B*2))%items.length,lt=(t-20)%(B*2),k=lt;
    fullTile(t,Math.floor((t-20)/4)*3,.35+.1*Math.sin(t*3));
    const tt={t:20+Math.floor((t-20)/(B*2))*(B*2)+lt,at:20+Math.floor((t-20)/(B*2))*(B*2)};
    slam(items[i][0],tt,W/2,H/2-70,120,TXT);
    slam(items[i][1],tt,W/2,H/2+70,120,items[i][2]);
    if(lt<.05)flash(t,20+Math.floor((t-20)/(B*2))*(B*2),.5);
  }
  // 30–42: Wochenchallenge (Fortschritt läuft voll)
  if(t>=30&&t<42){
    fullTile(t,(t*0.5|0)%NEW.length,.25);
    txt('WOCHENCHALLENGE',W/2,160,64,ACC2);
    const pr=clamp((t-31)/9),pct=Math.floor(pr*100);
    x.save();x.beginPath();x.roundRect(W/2-420,H/2-30,840,60,30);x.fillStyle='#ffffff22';x.fill();
    x.beginPath();x.roundRect(W/2-420,H/2-30,840*pr,60,30);const gr=x.createLinearGradient(W/2-420,0,W/2+420,0);gr.addColorStop(0,ACC);gr.addColorStop(1,ACC2);x.fillStyle=gr;x.fill();x.restore();
    txt(pct+' %',W/2,H/2+90,72,TXT);
    txt('Spielzeit sammeln. Fortschritt sehen.',W/2,H/2-80,36,TXT,'center',600);
    if(pct>=100&&t<41.8)txt('GESCHAFFT!',W/2,H/2+200,80,ACC);
  }
  // 42–54: Freunde einladen
  if(t>=42&&t<54){
    tileWall(t,-180,.5);
    x.save();x.fillStyle='#070a22cc';x.fillRect(0,0,W,H);x.restore();
    const tt={t,at:42+B};slam('FREUNDE',tt,W/2,H/2-60,140,PINK);slam('EINLADEN',{t,at:42+2*B},W/2,H/2+80,110,TXT);
    if(t<42+B*3)flash(t,42,.4);
  }
  // 54–66: Termin, groß
  if(t>=54&&t<66){
    fullTile(t,7,.2);
    slam('FREITAG',{t,at:54},W/2,H/2-140,110,ACC);
    slam('20. NOV.',{t,at:54+B},W/2,H/2-10,150,TXT);
    slam('11:30 UHR',{t,at:54+2*B},W/2,H/2+140,110,ACC2);
    if(t>=54&&t<54+.3)flash(t,54,.9);
  }
  // 66–80: Montage, Schnitt jeden halben Takt
  if(t>=66&&t<80){
    const cut=Math.floor((t-66)/(B/2));
    fullTile(t,cut*5+1,1);
    const lt=(t-66)%(B/2);
    x.save();x.globalAlpha=.6;x.fillStyle='#0006';x.fillRect(0,0,W,H);x.restore();
    txt('BALD',W/2,H/2,260*(1+0.1*Math.exp(-lt*12)),TXT,'center',900,1);
    if(lt<.05)flash(t,66+cut*B/2,.45);
  }
  // 80–90: Abspann
  if(t>=80){
    const a=clamp((t-80)/.5)*clamp((90-t)/.8);
    x.save();x.globalAlpha=a;
    const pulse=1+0.04*Math.exp(-((t-80)%B)/B*6);
    x.translate(W/2,H/2-80);x.scale(pulse,pulse);
    x.drawImage(LOGO,-LOGO.width*0.25,-LOGO.height*0.25,LOGO.width*0.5,LOGO.height*0.5);
    x.restore();
    txt('Freitag, 20.11. · 11:30 Uhr',W/2,H/2+120,50,ACC2,'center',900,a);
    txt('Das Mega-Update',W/2,H/2+190,30,TXT,'center',600,a);
    if(t<80+.3)flash(t,80,.8);
  }
  x.restore();
}
async function load(){
  await Promise.all(NEW.map(n=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src='../../'+n+'.jpg';IMG[n]=i})));
  await new Promise(r=>{LOGO.onload=r;LOGO.onerror=r;LOGO.src='../../logo/moki-logo.png'});
  window.READY=true;
}
load();
</script>

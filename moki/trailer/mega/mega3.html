<!doctype html>
<meta charset="utf-8">
<title>Moki Mega-Update Trailer v3</title>
<body style="margin:0;background:#000">
<canvas id="c" width="1280" height="720"></canvas>
<script>
/*
 * MOKI MEGA-UPDATE TRAILER v3 (90 Sekunden, 128 BPM)
 * ---------------------------------------------------
 * render(t) zeichnet exakt Sekunde t. Der Renderer (render.js) ruft das pro Frame auf,
 * damit das Video deterministisch und ruckelfrei entsteht.
 *
 * Aufbau der Datei:
 *   1. Konstanten und Farben
 *   2. Mathe- und Zufallshelfer (deterministisch, damit jedes Frame gleich aussieht)
 *   3. Zeichen-Helfer (Text, Glow, Godrays, Scanlines, Vignette, Glitch)
 *   4. Partikelsystem und Logo-Punktwolke
 *   5. 3D-Tunnel (perspektivische Kachelflut)
 *   6. Szenen (jede Szene ist eine eigene Funktion mit lokalem Zeitwert)
 *   7. Kamera, Post-Effekte und der Haupt-Dispatcher render(t)
 *   8. Laden der Bilder und Logo
 */

// ---------------------------------------------------------------- 1. Konstanten
const W = 1280, H = 720;
const CX = W / 2, CY = H / 2;
const BPM = 128, B = 60 / BPM;            // ein Takt-Schlag = 0.46875 s
const DUR = 90;
const COL = {
  bg: '#060819',
  ink: '#ffffff',
  mint: '#00e5a8',
  gold: '#ffd23f',
  pink: '#ff4d8d',
  blue: '#3da5ff',
  violet: '#8b5cf6',
  muted: '#a3abe0',
};
// Die 30 Spiele aus der Liste der neuen Spiele (Mega-Update). Paper.io 2 hat kein Bild und fehlt.
const NEW = [
  'stick-defenders', 'ragdoll-chaos', 'master-chess', 'ping-pong-go', 'murder',
  'blumgi-slime', 'stickman-battle', 'longcat', 'ovo-classic', 'beach-boxing-simulator',
  'idle-mining-empire', 'car-circle', 'pilot-life', 'kiwi-clicker', 'plonky',
  'country-balls-world-war', 'american-football-real', 'capitalist-bus-driver',
  'idle-startup-tycoon', 'mad-stick', 'sausage-flip', 'perfect-landing', 'ragdoll-fall',
  '2048-merge', 'sandboxels', 'idle-success', 'harvest-loop', 'blumgi-splash',
  'stickman-climb-2', 'blumgi-bounce',
];
const IMG = {};
const LOGO = new Image();
let LOGO_PTS = [];                        // Punkte der Logo-Form fuer die Partikel
let READY = false;

// ---------------------------------------------------------------- 2. Helfer
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eoutCube = t => 1 - Math.pow(1 - clamp(t), 3);
const eoutQuart = t => 1 - Math.pow(1 - clamp(t), 4);
const einCube = t => Math.pow(clamp(t), 3);
const overshoot = t => { t = clamp(t); const s = 2.4; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
// Deterministischer Zufall: gleiche Eingabe, gleiche Ausgabe. Wichtig fuer saubere Frames.
function rnd(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function rndr(n, a, b) { return a + (b - a) * rnd(n); }
// Beat-Phase: 0 direkt nach dem Schlag, steigt bis 1 bis zum naechsten
function beatPhase(t) { return (t % B) / B; }
function beatIndex(t) { return Math.floor(t / B); }
// Schneller Abfall nach jedem Schlag, ideal fuer Pulse und Wackler
function kick(t) { const p = beatPhase(t); return Math.exp(-p * 6); }
// Tween innerhalb eines Zeitfensters 0..1
function tween(t, a, b, fn = eoutCube) { return fn((t - a) / (b - a)); }

function font(sz, w = 900) { return `${w} ${sz}px "Segoe UI", Impact, system-ui, sans-serif`; }

// ---------------------------------------------------------------- 3. Zeichen-Helfer
const ctx = document.getElementById('c').getContext('2d');
const x = ctx;

function setAlpha(a) { x.globalAlpha = clamp(a); }

// Text mit Umriss, Schatten und Skalierung. al = Ausrichtung
function text(s, px, py, sz, col = COL.ink, a = 1, sc = 1, w = 900, al = 'center') {
  if (a <= 0.001) return;
  x.save();
  x.globalAlpha = clamp(a);
  x.translate(px, py);
  x.scale(sc, sc);
  x.font = font(sz, w);
  x.textAlign = al;
  x.textBaseline = 'middle';
  x.lineJoin = 'round';
  x.lineWidth = Math.max(4, sz * 0.14);
  x.strokeStyle = 'rgba(0,0,0,0.75)';
  x.strokeText(s, 0, 0);
  x.shadowColor = col;
  x.shadowBlur = sz * 0.35;
  x.fillStyle = col;
  x.fillText(s, 0, 0);
  x.restore();
}

// Wort wird Buchstabe fuer Buchstabe eingeblendet, jeder Buchstabe mit Versatz
function typeIn(s, px, py, sz, t0, dt, col = COL.ink, a = 1, w = 900) {
  x.save();
  x.font = font(sz, w);
  const total = x.measureText(s).width;
  let cursor = px - total / 2;
  x.restore();
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    x.save();
    x.font = font(sz, w);
    const cw = x.measureText(ch).width;
    x.restore();
    const k = tween(t0 + ch.length * 0 + i * dt, t0 + i * dt, t0 + i * dt + 0.25, overshoot);
    const drop = lerp(-40, 0, k);
    text(ch, cursor + cw / 2, py + drop, sz, col, clamp(k * 2) * a, 1, w);
    cursor += cw;
  }
}

// Glitch: Zeile wird kurz zerhackt und verschoben, dann stabil
function glitchText(s, px, py, sz, t, col = COL.ink, a = 1, seed = 1) {
  const bursts = rnd(seed + Math.floor(t * 10)) > 0.8;
  if (bursts) {
    const ox = rndr(seed + Math.floor(t * 30), -10, 10);
    text(s, px + ox, py, sz, COL.pink, a * 0.6, 1);
    text(s, px - ox, py, sz, COL.mint, a * 0.6, 1);
  }
  text(s, px, py, sz, col, a);
}

// Strahlen (Godrays) aus einem Mittelpunkt
function godrays(cx, cy, n, t, col, a, len = 1200) {
  if (a <= 0.001) return;
  x.save();
  x.globalAlpha = clamp(a);
  x.translate(cx, cy);
  x.rotate(t * 0.15);
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const w = 0.05 + rnd(i) * 0.06;
    const g = x.createLinearGradient(0, 0, Math.cos(ang) * len, Math.sin(ang) * len);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, 0);
    x.lineTo(Math.cos(ang - w) * len, Math.sin(ang - w) * len);
    x.lineTo(Math.cos(ang + w) * len, Math.sin(ang + w) * len);
    x.closePath();
    x.fill();
  }
  x.restore();
}

// Vignette: dunkle Ecken, fuehrt den Blick zur Mitte
function vignette(strength = 0.7) {
  const g = x.createRadialGradient(CX, CY, H * 0.35, CX, CY, W * 0.7);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
}

// Scanlines: feine Linien wie ein Bildschirm, gibt Retro-Gefuehl
function scanlines(a = 0.12) {
  x.save();
  x.globalAlpha = a;
  x.fillStyle = '#000';
  for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 1);
  x.restore();
}

// Weisser Blitz, faellt in 0.3 s ab
function flash(t, at, a = 0.7, dur = 0.3) {
  const k = (t - at) / dur;
  if (k < 0 || k > 1) return;
  x.save();
  x.globalAlpha = a * (1 - k);
  x.fillStyle = '#fff';
  x.fillRect(0, 0, W, H);
  x.restore();
}

// Farbiger Blitz (z.B. mint)
function colorFlash(t, at, col, a = 0.45, dur = 0.4) {
  const k = (t - at) / dur;
  if (k < 0 || k > 1) return;
  x.save();
  x.globalAlpha = a * (1 - k);
  x.fillStyle = col;
  x.fillRect(0, 0, W, H);
  x.restore();
}

// Hintergrund: dunkler Verlauf plus leise Pulsation
function background(t) {
  const pulse = kick(t);
  const g = x.createRadialGradient(CX, CY, 20, CX, CY, 900);
  g.addColorStop(0, `rgba(0,229,168,${0.10 + 0.10 * pulse})`);
  g.addColorStop(0.5, 'rgba(61,165,255,0.05)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = COL.bg;
  x.fillRect(0, 0, W, H);
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
}

// Bild in den Rahmen, Cover-Verhalten
function drawCover(img, px, py, w, h, zoom = 1, a = 1) {
  if (!img || !img.width) return;
  x.save();
  x.globalAlpha = clamp(a);
  x.beginPath();
  x.rect(px, py, w, h);
  x.clip();
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * s, ih = img.height * s;
  x.drawImage(img, px + (w - iw) / 2, py + (h - ih) / 2, iw, ih);
  x.restore();
}

// Abgerundete Kachel mit Bild
function tile(name, px, py, w, h, a = 1, rot = 0, zoom = 1) {
  const im = IMG[name];
  x.save();
  x.translate(px + w / 2, py + h / 2);
  x.rotate(rot);
  x.translate(-w / 2, -h / 2);
  x.globalAlpha = clamp(a);
  x.shadowColor = 'rgba(0,0,0,0.6)';
  x.shadowBlur = 18;
  x.beginPath();
  x.roundRect(0, 0, w, h, 18);
  x.clip();
  if (im && im.width) {
    const s = Math.max(w / im.width, h / im.height) * zoom;
    x.drawImage(im, (w - im.width * s) / 2, (h - im.height * s) / 2, im.width * s, im.height * s);
  } else {
    x.fillStyle = '#1d2566';
    x.fillRect(0, 0, w, h);
  }
  x.restore();
  // Rahmen
  x.save();
  x.globalAlpha = clamp(a) * 0.5;
  x.strokeStyle = COL.mint;
  x.lineWidth = 2;
  x.beginPath();
  x.roundRect(px, py, w, h, 18);
  x.stroke();
  x.restore();
}

// Kreis-Fortschritt (Ring)
function ring(cx, cy, r, pct, col, a = 1, w = 26) {
  x.save();
  x.globalAlpha = clamp(a);
  x.lineCap = 'round';
  x.lineWidth = w;
  x.strokeStyle = 'rgba(255,255,255,0.12)';
  x.beginPath();
  x.arc(cx, cy, r, 0, Math.PI * 2);
  x.stroke();
  const g = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0, col);
  g.addColorStop(1, COL.gold);
  x.strokeStyle = g;
  x.shadowColor = col;
  x.shadowBlur = 30;
  x.beginPath();
  x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(pct));
  x.stroke();
  x.restore();
}

// ---------------------------------------------------------------- 4. Partikel
// 420 Partikel: Funken im Hintergrund, und die Logo-Punkte fuer die Montage.
const SPARKS = [];
for (let i = 0; i < 160; i++) {
  SPARKS.push({
    x0: rnd(i * 3) * W,
    y0: rnd(i * 5 + 1) * H,
    v: rndr(i * 7, 20, 110),
    r: rndr(i * 11, 1, 4),
    c: [COL.mint, COL.gold, COL.pink, COL.blue, '#ffffff'][i % 5],
  });
}
// Partikel aus den Logo-Punkten, zieht sich bei der Montage zusammen
let LOGO_PARTICLES = [];
function buildLogoParticles() {
  LOGO_PARTICLES = [];
  const step = Math.max(1, Math.floor(LOGO_PTS.length / 380));
  for (let i = 0; i < LOGO_PTS.length; i += step) {
    const p = LOGO_PTS[i];
    LOGO_PARTICLES.push({
      tx: p[0], ty: p[1],
      sx: rndr(i * 13, -200, W + 200),
      sy: rndr(i * 17, -200, H + 200),
      r: rndr(i * 19, 1.5, 3.5),
      c: [COL.mint, COL.gold, COL.blue, '#ffffff'][i % 4],
    });
  }
}
// Zeichnet die Funken: langsam nach oben, glitzern beim Schlag
function drawSparks(t, speedMul = 1, a = 1) {
  x.save();
  for (let i = 0; i < SPARKS.length; i++) {
    const s = SPARKS[i];
    const y = (s.y0 - t * s.v * speedMul) % (H + 40);
    const py = y < -20 ? y + H + 40 : y;
    const twinkle = 0.5 + 0.5 * Math.sin(t * 6 + i);
    x.globalAlpha = clamp(a) * (0.35 + 0.5 * twinkle);
    x.fillStyle = s.c;
    x.beginPath();
    x.arc(s.x0, py, s.r * (1 + kick(t) * 0.5), 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
}

// Logo-Punkte: fliegen von den Startpositionen in die Logo-Form
function drawLogoAssembly(t, t0, t1, a = 1, scale = 1, offX = 0, offY = 0) {
  if (!LOGO_PARTICLES.length) return;
  const k = eoutQuart((t - t0) / (t1 - t0));
  x.save();
  x.globalAlpha = clamp(a);
  for (const p of LOGO_PARTICLES) {
    const px = lerp(p.sx, p.tx, k);
    const py = lerp(p.sy, p.ty, k);
    x.fillStyle = p.c;
    x.beginPath();
    x.arc(CX + (px - CX) * scale + offX, CY + (py - CY) * scale + offY, p.r * (0.6 + 0.4 * k), 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
}

// ---------------------------------------------------------------- 5. 3D-Tunnel
// Kacheln fliegen perspektivisch auf die Kamera zu. z laeuft von 1 (fern) bis 0 (nah).
const TUNNEL = [];
for (let i = 0; i < 48; i++) {
  TUNNEL.push({
    name: NEW[i % NEW.length],
    ang: (i / 48) * Math.PI * 2 + rnd(i) * 0.3,
    lane: 0.5 + rnd(i * 9) * 0.6,
    offset: rnd(i * 4) * 1,
  });
}
function drawTunnel(t, speed, a = 1) {
  x.save();
  x.globalAlpha = clamp(a);
  // Die Kacheln werden von fern nach nah gezeichnet, damit die naechsten vorne liegen
  const items = TUNNEL.map(o => {
    const z = (o.offset + t * speed) % 1;          // 0 nah, 1 fern (wir zaehlen rueckwaerts)
    const depth = 1 - z;                            // 1 nah
    return { o, z, depth };
  }).sort((p, q) => p.z - q.z).reverse();
  for (const it of items) {
    const { o, z } = it;
    const scale = 0.04 + Math.pow(1 - z, 3) * 1.1;
    const r = 260 * o.lane;
    const px = CX + Math.cos(o.ang) * r * (1 - z) * 1.6;
    const py = CY + Math.sin(o.ang) * r * (1 - z) * 0.9;
    const size = 220 * scale;
    tile(o.name, px - size / 2, py - size / 2, size, size, clamp((1 - z) * 1.2), o.ang * 0.2, 1);
  }
  x.restore();
}

// ---------------------------------------------------------------- 6. Szenen
// Jede Szene bekommt die globale Zeit t und zeichnet nur ihren Abschnitt.

// Szene 0 (0–5 s): dunkler Start, Funken, Logo baut sich aus Partikeln auf
function sceneIntro(t) {
  drawSparks(t, 0.5, tween(t, 0, 0.6, eoutCube));
  drawLogoAssembly(t, 0.3, 4.6, tween(t, 0.2, 0.8, eoutCube), 0.9, 0, -30);
  if (t > 1.8) {
    text('moki', CX, CY - 30, 1, COL.mint, 0);
  }
  if (t > 3.6) {
    const a = tween(t, 3.6, 4.4, eoutCube);
    text('bereitet sich vor', CX, CY + 170, 34, COL.muted, a, 1, 600);
  }
}

// Szene 1 (5–12 s): Titelbild "DAS MEGA-UPDATE", Logo explodiert, Blitz
function sceneTitle(t) {
  const local = t - 5;
  // Explosion aus dem Logo: Strahlen
  godrays(CX, CY, 18, t, 'rgba(0,229,168,0.5)', tween(local, 0, 0.5, eoutCube) * (1 - tween(local, 1.5, 2.5)), 900);
  drawLogoAssembly(t, 4.8, 5.1, 1 - tween(local, 0.1, 0.8, eoutCube), 0.9 + tween(local, 0, 0.8, eoutCube) * 0.8, 0, -30);
  // Woerter kommen einzeln mit Ueberschwingen
  if (local > 0.9) glitchText('DAS', CX, CY - 150, 92, t, COL.ink, tween(local, 0.9, 1.3, eoutCube), 1);
  if (local > 1.4) glitchText('MEGA', CX, CY - 10, 176, t, COL.mint, tween(local, 1.4, 1.9, overshoot), 2);
  if (local > 2.0) glitchText('UPDATE', CX, CY + 150, 118, t, COL.gold, tween(local, 2.0, 2.5, overshoot), 3);
  if (local > 3.2) text('Das größte Update, das Moki je hatte', CX, CY + 250, 30, COL.muted, tween(local, 3.2, 3.8), 1, 600);
  if (Math.abs(local - 0) < 0.04) flash(t, 5.0, 0.9);
  colorFlash(t, 5.0, COL.mint, 0.25, 0.8);
}

// Szene 2 (12–24 s): 3D-Tunnel voller neuer Spiele, "NEUE SPIELE" glitcht ins Bild
function sceneTunnel(t) {
  const local = t - 12;
  const speed = 0.12 + 0.05 * kick(t);
  drawTunnel(t, speed, tween(local, 0, 0.6));
  // Dunkler Schleier fuer die Schrift
  x.save();
  x.globalAlpha = 0.45;
  x.fillStyle = '#000';
  x.fillRect(CX - 480, CY - 110, 960, 220);
  x.restore();
  if (local > 1.0) glitchText('NEUE SPIELE', CX, CY, 118, t, COL.gold, tween(local, 1.0, 1.5, overshoot), 9);
  if (local > 4.0) text('Die Liste ist lang. Und sie ist neu.', CX, CY + 130, 30, COL.muted, tween(local, 4.0, 4.6), 1, 600);
  // Beat-Blitz bei jeder zweiten Viertelnote
  if (beatIndex(t) % 4 === 0 && beatPhase(t) < 0.06) colorFlash(t, t - beatPhase(t) * B, COL.blue, 0.15, 0.15);
  if (local > 11.5) flash(t, 23.6, 0.9);
}

// Szene 3 (24–34 s): Drei Vorteile, jedes Wort landet auf dem Schlag, mit Scanline-Wisch
function sceneBenefits(t) {
  const local = t - 24;
  const items = [
    ['PROBLEME', 'BEHOBEN', COL.mint],
    ['SPIELE', 'WIEDER DA', COL.gold],
    ['OHNE', 'WERBUNG', COL.pink],
  ];
  const slot = B * 3.4;   // etwa drei Viertel pro Vorteil
  const i = Math.min(items.length - 1, Math.floor(local / slot));
  const lt = local - i * slot;
  const [a, b, col] = items[i];
  background(t);
  drawSparks(t, 1.2, 0.5);
  // Wisch von links, pro Vorteil neu
  x.save();
  x.globalAlpha = 0.9;
  const wipe = tween(lt, 0, 0.35, eoutCube);
  x.fillStyle = col;
  x.fillRect(0, CY - 140, W * wipe, 280);
  x.restore();
  text(a, CX, CY - 40, 124, COL.bg, tween(lt, 0.2, 0.5, overshoot), 1, 1);
  text(b, CX, CY + 80, 90, COL.ink, tween(lt, 0.3, 0.6, overshoot), 1, 1);
  if (lt < 0.03) flash(t, t - lt, 0.6, 0.25);
  // Wenn letzter Vorteil endet, Blitz zum Termin
  if (local > 9.5) flash(t, 33.6, 0.6, 0.3);
}

// Szene 4 (34–46 s): Wochenchallenge mit Ring-Fortschritt
function sceneChallenge(t) {
  const local = t - 34;
  background(t);
  godrays(CX, CY + 40, 14, t * 0.5, 'rgba(255,210,63,0.12)', 0.7, 1000);
  text('WOCHENCHALLENGE', CX, 90, 58, COL.gold, tween(local, 0, 0.5));
  text('Spielzeit sammeln. Fortschritt sehen.', CX, 150, 28, COL.muted, tween(local, 0.3, 0.8), 1, 600);
  const pr = smooth(clamp((local - 1.0) / 8.0));
  const pct = Math.floor(pr * 100);
  ring(CX, CY + 40, 170, pr, COL.mint, tween(local, 0.5, 1.0), 34);
  text(pct + ' %', CX, CY + 40, 84, COL.ink, 1);
  if (pct >= 100 && local < 11.5) {
    glitchText('GESCHAFFT!', CX, CY + 290, 86, t, COL.gold, tween(local, 9.0, 9.6, overshoot), 33);
  }
  drawSparks(t, 0.8, 0.45);
  if (local > 11.6) flash(t, 45.6, 0.7);
}

// Szene 5 (46–56 s): Freunde einladen, Netzwerk aus Kreisen baut sich auf
function sceneFriends(t) {
  const local = t - 46;
  background(t);
  // Knoten: 9 Kreise um die Mitte, Linien zwischen Nachbarn
  const nodes = 9;
  const pts = [];
  for (let i = 0; i < nodes; i++) {
    const ang = (i / nodes) * Math.PI * 2 - Math.PI / 2;
    const r = 220;
    pts.push([CX + Math.cos(ang) * r, CY + 40 + Math.sin(ang) * r * 0.7]);
  }
  x.save();
  x.lineWidth = 3;
  for (let i = 0; i < nodes; i++) {
    const a = tween(local, i * 0.2, i * 0.2 + 0.5);
    const [px, py] = pts[i];
    const [qx, qy] = pts[(i + 1) % nodes];
    x.strokeStyle = `rgba(0,229,168,${0.6 * a})`;
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(lerp(px, qx, a), lerp(py, qy, a));
    x.stroke();
  }
  x.restore();
  for (let i = 0; i < nodes; i++) {
    const a = tween(local, i * 0.2, i * 0.2 + 0.5, overshoot);
    const [px, py] = pts[i];
    x.save();
    x.globalAlpha = clamp(a);
    x.fillStyle = i === 0 ? COL.gold : COL.mint;
    x.shadowColor = COL.mint;
    x.shadowBlur = 24;
    x.beginPath();
    x.arc(px, py, 26 * clamp(a), 0, Math.PI * 2);
    x.fill();
    x.restore();
  }
  if (local > 1.8) glitchText('FREUNDE', CX, CY - 40, 110, t, COL.pink, tween(local, 1.8, 2.3, overshoot), 40);
  if (local > 3.0) glitchText('EINLADEN', CX, CY + 80, 92, t, COL.ink, tween(local, 3.0, 3.6, overshoot), 41);
  if (local > 6.0) text('Teile Moki mit deinen Freunden', CX, CY + 220, 30, COL.muted, tween(local, 6.0, 6.6), 1, 600);
  if (local < 0.05) flash(t, 46, 0.6);
}

// Szene 6 (56–68 s): Termin in riesiger Schrift, Godrays drehen sich
function sceneDate(t) {
  const local = t - 56;
  background(t);
  godrays(CX, CY, 24, t, 'rgba(255,210,63,0.22)', tween(local, 0, 1.0), 1200);
  glitchText('FREITAG', CX, CY - 180, 84, t, COL.mint, tween(local, 0.0, 0.5, overshoot), 60);
  glitchText('20. NOVEMBER', CX, CY - 30, 128, t, COL.ink, tween(local, 0.5, 1.0, overshoot), 61);
  glitchText('11:30 UHR', CX, CY + 130, 118, t, COL.gold, tween(local, 1.0, 1.5, overshoot), 62);
  if (local > 3.5) text('Das Mega-Update', CX, CY + 250, 34, COL.muted, tween(local, 3.5, 4.2), 1, 600);
  if (local < 0.05) flash(t, 56, 0.9);
}

// Szene 7 (68–82 s): Montage, schnelle Schnitte auf halben Takten
function sceneMontage(t) {
  const local = t - 68;
  const cut = Math.floor(local / (B / 2));
  const lt = local - cut * (B / 2);
  const name = NEW[(cut * 7 + 3) % NEW.length];
  background(t);
  // Vollbild-Kachel mit Zoom-Stoss (zoom nimmt beim Schnitt ab)
  const zoom = 1.1 + 0.25 * (1 - eoutCube(lt / (B / 2)));
  tile(name, 0, 0, W, H, 0.9, 0, zoom);
  x.save();
  x.globalAlpha = 0.45;
  x.fillStyle = '#000';
  x.fillRect(0, 0, W, H);
  x.restore();
  // Grosses Wort, springt bei jedem Schnitt
  const word = ['BALD', 'FREITAG', 'DABEI', 'MOKI'][cut % 4];
  text(word, CX, CY, 180, COL.ink, 1, 1 + 0.12 * (1 - eoutCube(lt / (B / 2))));
  if (lt < 0.05) flash(t, t - lt, 0.35, 0.18);
  if (local > 11) flash(t, 80, 0.8, 0.3);
}

// Szene 8 (82–90 s): Logo baut sich neu aus Partikeln, Abspann mit Datum
function sceneOutro(t) {
  const local = t - 82;
  background(t);
  drawSparks(t, 0.4, 0.55);
  drawLogoAssembly(t, 82.2, 84.8, tween(local, 0, 0.5), 1.05, 0, -90);
  godrays(CX, CY - 90, 12, t * 0.3, 'rgba(0,229,168,0.10)', tween(local, 0, 1.2), 900);
  const pulse = 1 + 0.03 * kick(t);
  text('Freitag, 20.11. · 11:30 Uhr', CX, CY + 170, 56, COL.gold, tween(local, 3.0, 3.6), pulse, 900);
  text('Das Mega-Update', CX, CY + 240, 32, COL.ink, tween(local, 3.6, 4.2), 1, 600);
  // Ausblenden zum Schluss
  const fadeOut = clamp((DUR - t) / 1.2);
  if (fadeOut < 1) {
    x.save();
    x.globalAlpha = 1 - fadeOut;
    x.fillStyle = '#000';
    x.fillRect(0, 0, W, H);
    x.restore();
  }
}

// ---------------------------------------------------------------- 7. Kamera und Dispatcher
// Kamera: leichtes Wackeln beim Schlag, langsames Zoomen je Szene
function cameraShake(t, amp) {
  const k = kick(t) * amp;
  return { dx: Math.sin(t * 91) * k, dy: Math.cos(t * 77) * k };
}

// Post-Effekte, immer ueber der Szene
function postFx(t) {
  vignette(0.75);
  scanlines(0.10);
}

function render(t) {
  x.save();
  // Kamera: Wackeln nur in den Action-Szenen
  let cam = { dx: 0, dy: 0 };
  if (t >= 5 && t < 12) cam = cameraShake(t, 16);
  if (t >= 12 && t < 24) cam = cameraShake(t, 6);
  if (t >= 66 && t < 82) cam = cameraShake(t, 10);
  x.translate(cam.dx, cam.dy);

  if (t < 5) { background(t); sceneIntro(t); }
  else if (t < 12) { background(t); sceneTitle(t); }
  else if (t < 24) { background(t); sceneTunnel(t); }
  else if (t < 34) { sceneBenefits(t); }
  else if (t < 46) { sceneChallenge(t); }
  else if (t < 56) { sceneFriends(t); }
  else if (t < 68) { sceneDate(t); }
  else if (t < 82) { sceneMontage(t); }
  else { sceneOutro(t); }

  postFx(t);
  x.restore();
}

// ---------------------------------------------------------------- 8. Laden
async function loadImages() {
  await Promise.all(NEW.map(n => new Promise(r => {
    const im = new Image();
    im.onload = r; im.onerror = r;
    im.src = '../../' + n + '.jpg';
    IMG[n] = im;
  })));
}

<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas><script src="gd.js"></script>
<script>
// Trailer-Szenen als Canvas (Logo-Intro, Werbe-Szene, Spielewand, Finale). Gezeichnet in 1280x720, ausgegeben in 1920x1080.
const W=1280,H=720,c=document.getElementById('c'),x=c.getContext('2d');
const ACC='#00e5a8',ACC2='#ffd23f',BG='#0a0d2b',MUTED='#a3abe0',BEAT=.5;
let GAMES=[],IMG={},ICON=new Image();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;

const rnd=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
async function load(){GAMES=window.GD;
 await Promise.all(GAMES.map(g=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src='../'+g.i;IMG[g.i]=i})));
 await new Promise(r=>{ICON.onload=r;ICON.src='../logo/moki-icon-512.png'});window.READY=true}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}

function txt(s,px,py,size,col='#fff',al='center',wt=900,stroke){x.font=`${wt} ${size}px Inter,"Segoe UI","DejaVu Sans",sans-serif`;x.textAlign=al;x.textBaseline='middle';if(stroke){x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.lineJoin='round';x.strokeText(s,px,py)}x.fillStyle=col;x.fillText(s,px,py)}
function flash(a){if(a>0){x.fillStyle=`rgba(255,255,255,${clamp(a)})`;x.fillRect(-10,-10,W+20,H+20)}}

// ---------- Spielewand (0 - 8 lokal)

 [9.3,'7 KATEGORIEN','Fahren, Kampf, Sport und mehr'],[13.4,'FAVORITEN','Deine Lieblingsspiele an einem Ort'],[17.4,'ZUFALLSSPIEL','Unentschlossen? Moki wählt für dich'],
 [19.5,'KREATIONEN','Selbstgemachte Spiele aus dem Moki Studio'],[22.4,'WEITERE SEITEN','Dazu Poki und CrazyGames'],[29.4,'46 SPIELE','Alles direkt im Browser']];
function pills(t){
  for(const[a,s,sub]of PILLS){const u=t-a,dur=a===5.3||a===9.3?3.2:1.9;if(u<0||u>dur)continue;
    const k=u<.3?back(u/.3):(u>dur-.25?1-eo((u-(dur-.25))/.25):1);

    rr(-330,-56,660,112,28);x.fillStyle='rgba(10,13,43,.95)';x.fill();x.lineWidth=5;
    const gg=x.createLinearGradient(-330,0,330,0);gg.addColorStop(0,ACC);gg.addColorStop(1,ACC2);x.strokeStyle=gg;x.stroke();
    txt(s,0,-14,50,'#fff');txt(sub,0,30,22,MUTED,'center',500);x.restore()}
}
// ---- Szenen
function intro(t){
  x.fillStyle='#05060f';x.fillRect(0,0,W,H);
  const s=lerp(.55,1,eo(t/.9));
  const g=x.createRadialGradient(W/2,H/2,10,W/2,H/2,520);g.addColorStop(0,`rgba(0,229,168,${.35*eo(t/.6)})`);g.addColorStop(1,'rgba(0,229,168,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.translate(W/2,H/2-20);x.scale(s,s);x.globalAlpha=eo(t/.4);x.shadowColor=ACC;x.shadowBlur=60;x.drawImage(ICON,-140,-140,280,280);x.restore();
  x.globalAlpha=eo((t-.4)/.4);txt('MOKI',W/2,H/2+190,84,'#fff');x.globalAlpha=1;
  flash(t>.95?(1-t)*20:0);
}
function site(t){
  const st=stateAt(t),ent=clamp((t-T0)/.7);
  let[z,fx,fy]=camAt(t);z*=1+pulse(t)*.008;
  const hw=W/2/(S*z),hh=H/2/(S*z);fx=clamp(fx,hw,LW-hw);fy=clamp(fy,hh,LH-hh);
  x.save();x.translate(W/2,H/2);x.scale(S*z,S*z);x.translate(-fx,-fy);
  bg();
  // Hover aus Cursor
  const[cx,cy]=cursorAt(t);let hover=-1;
  const hasHero=st.mode==='home';
  if(st.mode==='home'){
    const ax=cx-MX,ay=cy+st.scroll-HOME.grid;
    if(ax>=0&&ay>=0&&ax<1180){const col=Math.floor(ax/PITCH),row=Math.floor(ay/PITCH);if(ax-col*PITCH<=TW&&ay-row*PITCH<=TW&&col<6){const i=row*6+col;if(i<46)hover=i}}
    const sy=cy+st.scroll-(SITE0+120);if(sy>=0&&sy<=TW&&ax>=0){const si=ax<2*TW+18?0:(ax>2*TW+36&&ax<4*TW+54?1:-1);if(si>=0)hover=100+si}
  }else if(st.mode==='list'){
    const ax=cx-MX,ay=cy-LIST.grid;if(ax>=0&&ay>=0){const col=Math.floor(ax/PITCH),row=Math.floor(ay/PITCH);if(ax-col*PITCH<=TW&&ay-row*PITCH<=TW&&col<6){const i=row*6+col;if(i<st.list.length)hover=i}}
  }
  // Zufall
  let hl=-1;if(st.mode==='home'&&t>=17.3&&t<19.0){hl=t<18.5?Math.floor((t-17.3)*16)%18:10}
  x.save();x.globalAlpha=eo(ent*1.5);mainContent(t,st,hover,hl);x.restore();
  sidebar(t,st,ent);header(t,st,ent);
  cursor(t);
  x.restore();
  vignette();pills(t);
  flash(t<T0+.12?(T0+.12-t)*6:0);
  // Cuts auf Sektions-Anfaenge
  for(const s of[5.0,9.2,13.0,17.0,19.4,22.0,29.0])if(t>=s&&t<s+.1)flash((s+.1-t)*3);
}
function vignette(){const g=x.createRadialGradient(W/2,H/2,H*.55,W/2,H/2,H*.98);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=g;x.fillRect(0,0,W,H)}
// ---- Keine Werbung (25 - 29)
function rnd(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
function adScene(t){
  const u=t-25.0,R=u<2.0?0:eo((u-2.0)/.6)*1400;
  // Moki-Seite (darunter)
  x.setTransform(1,0,0,1,0,0);x.save();x.scale(S,S);bg();x.restore();

    x.save();x.beginPath();x.rect(0,0,W,H);x.arc(W/2,H/2,R,0,7);x.clip('evenodd');
    const sh=Math.min(1,u/2)*6;x.translate((rnd(Math.floor(t*30))-.5)*sh,(rnd(Math.floor(t*30)+9)-.5)*sh);
    x.fillStyle='#eceef2';x.fillRect(-20,-20,W+40,H+40);
    x.fillStyle='#fff';x.fillRect(0,0,W,70);x.fillStyle='#c9ccd6';x.fillRect(30,24,140,22);for(let i=0;i<4;i++)x.fillRect(600+i*120,28,90,14);
    for(let i=0;i<14;i++){x.fillStyle='#d3d6df';x.fillRect(60,110+i*38,300+rnd(i)*500,14)}

      x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=14;x.fillStyle=COL[i%7];x.fillRect(0,0,bw,bh);x.shadowBlur=0;
      rr(6,6,64,18,4);x.fillStyle='rgba(0,0,0,.45)';x.fill();txt('ANZEIGE',38,15,10,'#fff','center',700);
      txt(TX[i%7],bw/2,bh/2-(bh>100?10:0),bh>100?Math.min(30,bw/9):Math.min(30,bh/2.6),'#fff','center',900);
      if(bh>100){rr(bw/2-70,bh-52,140,34,17);x.fillStyle='#ffeb3b';x.fill();txt('Jetzt!',bw/2,bh-35,16,'#222')}
      txt('×',bw-14,14,20,'#fff','center',700);x.restore()}
    if(u>1.1){const k=back((u-1.1)/.25);x.save();x.translate(W/2,H/2);x.scale(k,k);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=30;x.fillStyle='#111';x.fillRect(-290,-170,580,330);x.shadowBlur=0;
      txt('Video-Anzeige',0,-20,34,'#fff');rr(150,120,130,30,6);x.fillStyle='rgba(255,255,255,.2)';x.fill();txt('Überspringen in '+Math.max(1,5-Math.floor((u-1.1)*5)),215,135,13,'#fff');
      x.fillStyle='#fbc02d';x.fillRect(-290,152,580*clamp((u-1.1)/.9),6);x.restore()}
    x.restore();
  }
  if(R>0&&R<1400){x.beginPath();x.arc(W/2,H/2,R,0,7);x.lineWidth=10;x.strokeStyle=ACC;x.shadowColor=ACC;x.shadowBlur=40;x.stroke();x.shadowBlur=0}
  if(u>2.1){
    const v=u-2.1;
    // Verbotszeichen ueber "AD"
    const k=back(v/.4);x.save();x.translate(W/2,190);x.scale(k,k);
    x.beginPath();x.arc(0,0,86,0,7);x.lineWidth=16;x.strokeStyle='#ff3b6b';x.stroke();
    txt('AD',0,2,66,'#fff','center',900);
    x.beginPath();x.moveTo(-61,-61);x.lineTo(61,61);x.lineWidth=16;x.lineCap='round';x.strokeStyle='#ff3b6b';x.stroke();x.restore();
    x.save();x.translate(W/2,372);const k2=back((v-.15)/.4);x.scale(k2,k2);txt('KEINE WERBUNG',0,0,112,'#fff');
    const ug=x.createLinearGradient(-440,0,440,0);ug.addColorStop(0,ACC);ug.addColorStop(1,ACC2);x.fillStyle=ug;rr(-440*k2,62,880*k2,8,4);x.fill();x.restore();
    ['Keine Banner','Keine Pop-ups','Keine Video-Vorspänne'].forEach((s2,i)=>{const a=back((v-.6-i*.25)/.3);if(a<=0)return;
      x.save();x.translate(W/2-230+i*0,470+i*50);x.scale(a,a);x.beginPath();x.arc(-30,0,17,0,7);x.fillStyle=ACC;x.fill();
      x.beginPath();x.moveTo(-39,0);x.lineTo(-32,8);x.lineTo(-20,-7);x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#04201a';x.stroke();
      txt(s2,0,1,34,'#fff','left',700);x.restore()});
  }
  x.save();x.setTransform(1,0,0,1,0,0);vignette();x.restore();
  flash(u<.1?(.1-u)*4:0);flash(u>=2.0&&u<2.15?(2.15-u)*3:0);
}
function finale(t){
  const u=t-TFIN;
  const g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,800);g.addColorStop(0,'#142a6a');g.addColorStop(1,'#05071a');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.translate(W/2,H/2);

function render(t){
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.filter='none';x.clearRect(0,0,W,H);
  if(t<T0)intro(t);else if(t>=25.0&&t<29.0)adScene(t);else if(t<TFIN)site(t);else finale(t);
  if(t>TEND-.35){x.fillStyle=`rgba(0,0,0,${(t-(TEND-.35))/.35})`;x.fillRect(0,0,W,H)}
}

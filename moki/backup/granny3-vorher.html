<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Granny 3</title>
<!-- Nur eigener Ursprung, raw.githubusercontent (fester Commit), blob/data. Fremde Skripte (GameMonetize-Werbung) werden blockiert. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data: https://raw.githubusercontent.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://raw.githubusercontent.com; connect-src 'self' blob: data: https://raw.githubusercontent.com; worker-src blob: 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; touch-action: none; }
  #ld { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: 70%; max-width: 360px; }
  #pb { height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 8px; }
  #pf { height: 100%; width: 0; background: #00e5a8; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
<style>
#pad{display:none;position:fixed;left:0;right:0;bottom:12px;justify-content:space-between;padding:0 12px;z-index:9;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
#pad.show{display:flex}
#pad .grp{display:grid;gap:8px;pointer-events:auto}
#pad .l{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px)}
#pad .r{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px)}
#pad button{font:800 18px system-ui,sans-serif;border:0;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none}
#pad button:active,#pad button.on{background:rgba(0,229,168,.6)}
#pad .e{visibility:hidden}
#look{display:none;position:fixed;top:46px;right:0;width:45%;bottom:120px;z-index:8;touch-action:none}
#look.show{display:block}
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas><div id="ld"><div id="tx">Lade Spiel …</div><div id="pb"><div id="pf"></div></div></div></div>
<script>
// Laedt das Spiel aus dem GitHub-Repo (raw.githubusercontent.com, fester Commit). Keine Werbung, keine Tracker.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/78fffee4cb57038e6e5e3dde84d8ccb01949270f/granny3/";
const ORIGIN = new URL(BASE).origin;

// --- Netz-Sperre: nur Repo-Ursprung, blob: und data: erlaubt.
(function () {
  function ok(u) { try { var x = new URL(String(u), location.href); return x.protocol === "blob:" || x.protocol === "data:" || x.origin === ORIGIN || x.protocol === "about:"; } catch (e) { return true; } }
  var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) { this._blocked = !ok(u); return open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function () {
    if (!this._blocked) return send.apply(this, arguments);
    var x = this; setTimeout(function () { x.dispatchEvent(new ProgressEvent("error")); x.dispatchEvent(new ProgressEvent("loadend")); }, 0);
  };
  var f = window.fetch;
  window.fetch = function (r) { return ok(r && r.url || r) ? f.apply(this, arguments) : Promise.reject(new TypeError("Failed to fetch")); };
  if (navigator.sendBeacon) navigator.sendBeacon = function () { return false; };
  window.open = function () { return null; };
})();

const tx = document.getElementById("tx"), pf = document.getElementById("pf");
(async () => {
  try {
    const get = (f, kind) => fetch(BASE + f).then(r => { if (!r.ok) throw new Error(f + ": " + r.status); return r[kind](); });
    let done = 0; const bump = () => { done++; pf.style.width = (done / 4 * 70) + "%"; };
    const [loaderTxt, fw, dataBlob, wasmBlob] = await Promise.all([
      get("Build/Build.loader.js", "text").then(x => { bump(); return x; }),
      get("Build/Build.framework.js", "blob").then(x => { bump(); return x; }),
      get("Build/Build.data", "blob").then(x => { bump(); return x; }),
      get("Build/Build.wasm", "blob").then(x => { bump(); return x; })
    ]);
    const s = document.createElement("script"); s.textContent = loaderTxt; document.body.appendChild(s);
    tx.textContent = "Starte …";
    const inst = await createUnityInstance(document.getElementById("c"), {
      dataUrl: URL.createObjectURL(new Blob([dataBlob], { type: "application/octet-stream" })),
      codeUrl: URL.createObjectURL(new Blob([wasmBlob], { type: "application/wasm" })),
      frameworkUrl: URL.createObjectURL(new Blob([fw], { type: "text/javascript" })),
      streamingAssetsUrl: BASE + "StreamingAssets",
      companyName: "Kiz10", productName: "Granny 3 Return the School", productVersion: "1.0.0"
    }, p => { pf.style.width = (70 + p * 30) + "%"; });
    window.unityGame = inst;
    document.getElementById("ld").remove();
  } catch (e) { tx.textContent = "Fehler beim Laden: " + (e.message || e); }
})();
</script>
<div id="look"></div>
<div id="pad"><div class="grp l"><span class="e"></span><button data-k="w">W</button><span class="e"></span><button data-k="a">A</button><button data-k="s">S</button><button data-k="d">D</button></div><div class="grp r"><button data-k="e">E</button><button data-k="sp">Space</button><button data-k="c">C</button><button data-k="r">R</button><button data-k="f">F</button></div></div>
<script>
(function(){
  const KEYS={w:{key:"w",code:"KeyW",keyCode:87},a:{key:"a",code:"KeyA",keyCode:65},s:{key:"s",code:"KeyS",keyCode:83},d:{key:"d",code:"KeyD",keyCode:68},
    e:{key:"e",code:"KeyE",keyCode:69},sp:{key:" ",code:"Space",keyCode:32},c:{key:"c",code:"KeyC",keyCode:67},r:{key:"r",code:"KeyR",keyCode:82},f:{key:"f",code:"KeyF",keyCode:70}};
  const pad=document.getElementById("pad"), look=document.getElementById("look");
  function fire(type,k){
    const target=document.getElementById("c")||document.body;
    target.dispatchEvent(new KeyboardEvent(type,{key:k.key,code:k.code,keyCode:k.keyCode,which:k.keyCode,bubbles:true,cancelable:true}));
  }
  const held=new Set();
  function down(b){ const k=KEYS[b.dataset.k]; if(!k||held.has(k.key)) return; held.add(k.key); b.classList.add("on"); const c=document.getElementById("c"); if(c&&c.focus) c.focus(); fire("keydown",k); }
  function up(b){ const k=KEYS[b.dataset.k]; if(!k||!held.has(k.key)) return; held.delete(k.key); b.classList.remove("on"); fire("keyup",k); }
  const btns=[...document.querySelectorAll("#pad button")];
  btns.forEach(b=>{
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); down(b); });
    b.addEventListener("pointerup",e=>{ e.preventDefault(); e.stopPropagation(); up(b); });
    b.addEventListener("pointercancel",()=>up(b));
    b.addEventListener("pointerleave",()=>up(b));
  });
  // Umsehen: Ziehen im rechten Bereich schickt Mausbewegung an das Spiel.
  let lx=null, ly=null, lid=null;
  look.addEventListener("pointerdown",e=>{ lid=e.pointerId; lx=e.clientX; ly=e.clientY; look.setPointerCapture(e.pointerId); });
  look.addEventListener("pointermove",e=>{
    if(e.pointerId!==lid) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    const c=document.getElementById("c"); if(!c) return;
    c.dispatchEvent(new MouseEvent("mousemove",{clientX:e.clientX,clientY:e.clientY,movementX:dx*2,movementY:dy*2,bubbles:true}));
  });
  const endLook=e=>{ if(e.pointerId===lid) lid=null; };
  look.addEventListener("pointerup",endLook); look.addEventListener("pointercancel",endLook);
  function hide(){ pad.classList.remove("show"); look.classList.remove("show"); btns.forEach(up); }
  window.addEventListener("blur",hide);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") hide(); });
  // Erscheint nur in der Runde: nach Tippen auf PLAY (rechts unten im Story-Bildschirm).
  document.addEventListener("pointerdown",e=>{
    if(e.target.closest && e.target.closest("#pad, #look")) return;
    const inStartZone = e.clientY > innerHeight*0.76 && e.clientY < innerHeight*0.86 && Math.abs(e.clientX-innerWidth*0.695) < innerWidth*0.08;
    if(inStartZone){ pad.classList.add("show"); look.classList.add("show"); }
  },true);
})();
</script>
</body>
</html>

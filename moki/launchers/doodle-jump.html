<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Jump</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="#" onclick="parent.postMessage('moki-close','*');return false;">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *; clipboard-write *" allowfullscreen></iframe>
<script>
// Laedt das Spiel aus dem GitHub-Repo (jsDelivr, fester Commit). Kein lokaler Server noetig.
const BASE = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@a1ce44c1ba2fd860001358366a59d9409ed31127/doodle-jump/";
// Netz-Sperre: Anfragen nur an eigene Herkunft / blob / data.
const BLOCK = '<script>(' + (function (BASE) {
  var ok = function (u) { u = String(u || ""); return /^(blob:|data:|about:)/.test(u) || u.indexOf(BASE) === 0 || !/^(https?:)?[/][/]/.test(u); };
  var xo = XMLHttpRequest.prototype.open, xs = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) { this.__bl = !ok(u); return xo.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function () {
    if (!this.__bl) return xs.apply(this, arguments);
    var x = this; setTimeout(function () { x.dispatchEvent(new ProgressEvent("error")); x.dispatchEvent(new ProgressEvent("loadend")); }, 0);
  };
  var f = window.fetch;
  window.fetch = function (u) { return ok(u && u.url || u) ? f.apply(this, arguments) : Promise.reject(new TypeError("blocked")); };
  navigator.sendBeacon = function () { return false };
  window.open = function () { return null };
}).toString() + ')(' + JSON.stringify(BASE) + ')<\/script>';
fetch(BASE + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html.replace("<head>", () => '<head><base href="' + BASE + '">' + BLOCK);
    document.getElementById("game").srcdoc = html;
  })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

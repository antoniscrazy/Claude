<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karate Bros</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; background:#000; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
  #msg { position:fixed; left:0; right:0; top:60px; text-align:center; color:#aaa; pointer-events:none; }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *; clipboard-write *; accelerometer *; gyroscope *" allowfullscreen></iframe>
<div id="msg">Lade …</div>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (jsDelivr, fester Commit). Kein lokaler Server nötig.
const CFG = {"base": "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@867c09d88fe73405d60650859440a7c09656aa41/karate-bros/", "entry": "index.html", "strip": [], "repl": []};
const BASE = CFG.base;
// Netz-Sperre + Zusatzcode, läuft im Spiel-Frame vor allem anderen.
const GUARD = '<script>(function(){var A=["cdn.jsdelivr.net","raw.githubusercontent.com"];' +
 'function ok(u){try{var x=new URL(u,document.baseURI);return x.protocol==="blob:"||x.protocol==="data:"||x.protocol==="about:"||A.indexOf(x.hostname)>-1}catch(e){return true}}' +
 'var f=window.fetch;window.fetch=function(u){var s=(u&&u.url)||u;if(ok(s))return f.apply(this,arguments);console.warn("BLOCKED "+s);return Promise.reject(new TypeError("blocked"))};' +
 'var o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(!ok(u)){this.__b=1;arguments[1]="data:text/plain,"}return o.apply(this,arguments)};' +
 'navigator.sendBeacon=function(){return true};' +
 'var W=window.WebSocket;window.WebSocket=function(u){if(!ok(u))throw new Error("blocked");return new W(u)};' +
 'var d=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,"src");if(d&&d.set)Object.defineProperty(HTMLIFrameElement.prototype,"src",{get:d.get,set:function(v){d.set.call(this,ok(v)?v:"about:blank")},configurable:true});' +
 'var sa=Element.prototype.setAttribute;Element.prototype.setAttribute=function(n,v){if(this.tagName==="IFRAME"&&String(n).toLowerCase()==="src"&&!ok(v))v="about:blank";return sa.call(this,n,v)};' +
 'window.open=function(){return null};' +
 'var OW=window.Worker;window.Worker=function(u,o){var s=String(u);try{var x=new URL(s,document.baseURI);if(x.origin!==location.origin&&x.protocol==="https:"){if(A.indexOf(x.hostname)<0)throw new Error("blocked");var b=new Blob(["importScripts("+JSON.stringify(x.href)+");"],{type:"text/javascript"});s=URL.createObjectURL(b);if(o&&o.type==="module")o=Object.assign({},o,{type:"classic"})}}catch(e){if(/blocked/.test(e.message))throw e}return new OW(s,o)};window.Worker.prototype=OW.prototype;' +
 '})();<\/script>';
const SHIM = '<script>window.__GAME_BASE="' + BASE + '";<\/script><script>Object.defineProperty(Document.prototype,"URL",{get(){return "' + BASE + CFG.entry + '"},configurable:true})<\/script>';
const INJECT = ``;
fetch(BASE + CFG.entry)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html.replace(/<script[^>]*\ssrc=["'](?:https?:)?\/\/(?!cdn\.jsdelivr\.net|raw\.githubusercontent\.com)[^"']*["'][^>]*>\s*<\/script>/gi, "");
    CFG.strip.forEach(re => { html = html.replace(new RegExp(re, "gi"), ""); });
    CFG.repl.forEach(p => { html = html.split(p[0]).join(p[1]); });
    const head = '<base href="' + BASE + '">' + GUARD + SHIM + INJECT;
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + head) : head + html;
    document.getElementById("game").srcdoc = html;
    document.getElementById("msg").remove();
  })
  .catch(e => { document.getElementById("msg").textContent = "Fehler beim Laden: " + e.message; });
</script>
</body>
</html>

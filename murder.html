<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; width: 100%; }
  #stage ruffle-player { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<div id="stage"></div>
<script src="https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@b31fef611e7d8a5c9e0d2b4e5d01861f0b883b05/murder/lib/ruffle/ruffle.js"></script>
<script>
// Flash-Spiel (SWF) über Ruffle direkt auf der Seite – ohne srcdoc-Iframe (dort blockiert die Sandbox das SWF).
const BASE = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@b31fef611e7d8a5c9e0d2b4e5d01861f0b883b05/murder/";
const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();
document.getElementById("stage").appendChild(player);
player.load({ url: BASE + "murder.swf", autoplay: "on", unmuteOverlay: "hidden" });
</script>
</body>
</html>

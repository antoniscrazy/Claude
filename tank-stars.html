<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tank Stars</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *; clipboard-write *" allowfullscreen></iframe>
<script>
// Lädt das Spiel direkt aus deinem GitHub-Repo (raw.githubusercontent.com, Commit fest verdrahtet). Kein Server, keine Werbung.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/624aabc1f1bdee0d93c6f5ee87c00a80dd68f418/tank-stars/";
const esc = t => t.replace(/<\/script/gi, "<\\/script");
const SHIM = `
// raw.githubusercontent liefert Skripte als text/plain -> das Lade-Skript des Spiels direkt ausführen.
(function () {
  var d = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, "src");
  Object.defineProperty(HTMLScriptElement.prototype, "src", { get: d.get, configurable: true, set: function (v) {
    var s = this;
    if (/game\\.loader\\.js(\\?|$)/.test(String(v))) {
      fetch(v).then(function (r) { return r.text(); }).then(function (t) { (0, eval)(t); if (s.onload) s.onload(new Event("load")); }).catch(function (e) { console.error(e); if (s.onerror) s.onerror(e); });
      return;
    }
    d.set.call(s, v);
  }});
  window.open = function () { return null; };
  try { var g = navigator.getGamepads ? navigator.getGamepads.bind(navigator) : null; navigator.getGamepads = function () { try { return g ? g() : []; } catch (e) { return []; } }; } catch (e) {}
})();
`;
Promise.all([
  fetch(BASE + "index.html").then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }),
  fetch(BASE + "tank-stars.js").then(r => r.text()),
  fetch(BASE + "unity-2020.js").then(r => r.text())
]).then(([html, pokiJs, uniJs]) => {
  // Netzwerk-Sperre des Originals entfernen (würde die Repo-Adresse blockieren)
  html = html.replace(/<script>\s*\/\* unity-net-guard[\s\S]*?<\/script>/, "");
  // Belohnungs-Werbung: sofort
  pokiJs = pokiJs.replace("setTimeout(() => e(true), 800)", "setTimeout(() => e(true), 50)").replace("setTimeout(() => resolveFn && resolveFn(), 300)", "setTimeout(() => resolveFn && resolveFn(), 20)");
  html = html.replace('<script src="tank-stars.js"><\/script>', () => "<script>" + esc(pokiJs) + "<\/script>");
  html = html.replace('<script src="unity-2020.js"><\/script>', () => "<script>" + esc(uniJs) + "<\/script>");
  html = html.replace("<head>", () => '<head><base href="' + BASE + '"><script>' + SHIM + "<\/script>");
  document.getElementById("game").srcdoc = html;
}).catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

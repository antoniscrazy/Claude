<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tetris</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="styles.css" rel="stylesheet" type="text/css" />
<style>
html,body{margin:0;background:#001d00;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0}
#tc{position:fixed;left:0;right:0;bottom:0;height:0;z-index:50}
#tc .b{position:fixed;bottom:18px;width:76px;height:76px;border-radius:50%;background:rgba(0,255,100,.15);border:2px solid rgba(0,255,100,.6);color:#9fffbf;font:700 24px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none}
#tc .b.on{background:rgba(0,255,100,.45)}
</style>
<script src="cookie.js"></script>
<script src="gameControls.js"></script>
<script src="jawsjs.js"></script>
<script src="Block.js"></script>
<script src="Shapes.js"></script>
<script src="WallKicks.js"></script>
<script src="ControlGroup.js"></script>
<script src="Background.js"></script>
<script src="RandomBag.js"></script>
<script src="PreviewGroup.js"></script>
<script src="ScoreTracker.js"></script>
<script src="TtyBlock.js"></script>
<script src="Game.js"></script>
<script src="Game_Logic.js"></script>
<script src="Button.js"></script>
<script src="tetris.js"></script>
<script>
function onClickEvent(event){if(Tetris.currentInstance){Tetris.currentInstance.mouseClicked(event.layerX,event.layerY)}}
</script>
</head>
<body>
<div id="wrap"><table border="0" class="mainTable"><tr><td class="contentCell">
<div class="gamePanel"><div class="gameElements">
<div class="ttyOutput scoreOutput" id="scoreDiv"></div>
<div class="ttyOutput linesOutput" id="linesDiv"></div>
<div class="ttyOutput levelOutput" id="levelDiv"></div>
<div class="ttyOutput tickerOutput" id="tickerDiv"></div>
<div class="gameEndOutputHidden" id="gameEndContainer"><div style="padding:5px" id="gameEndDiv"></div></div>
<canvas class="gameCanvas" id="gameCanvas" width="600" height="500" onclick="onClickEvent(event)"></canvas>
</div></div></td></tr></table></div>
<div id="tc"></div>
<script>
(function(){
function fit(){var w=document.getElementById('wrap');w.style.transform='none';var r=w.getBoundingClientRect();var s=Math.min(innerWidth/r.width,(innerHeight-100)/r.height);w.style.transform='scale('+s+')';w.style.left=Math.max(0,(innerWidth-r.width*s)/2)+'px'}
addEventListener('load',fit);addEventListener('resize',fit);setTimeout(fit,500);setTimeout(fit,2000);
if(!('ontouchstart' in window)&&!navigator.maxTouchPoints)return;
var tc=document.getElementById('tc');
function send(t,k){var e=new KeyboardEvent(t,{bubbles:true});Object.defineProperty(e,'keyCode',{get:function(){return k}});window.dispatchEvent(e);if(window.onkey&&0){}}
// jaws nutzt window.onkeydown/onkeyup
function fire(t,k){var e={keyCode:k,type:t,preventDefault:function(){},stopPropagation:function(){}};var h=t=='keydown'?window.onkeydown:window.onkeyup;if(h)h(e)}
var defs=[['◀',37,'left:14px'],['▼',40,'left:102px'],['▶',39,'left:190px'],['⟲',90,'right:190px'],['⟳',88,'right:102px'],['⤓',32,'right:14px'],['C',67,'right:14px;bottom:104px;width:56px;height:56px;font-size:18px']];
defs.forEach(function(d){var b=document.createElement('div');b.className='b';b.textContent=d[0];b.style.cssText=d[2];var dn=0;
function on(e){e.preventDefault();if(dn)return;dn=1;b.classList.add('on');fire('keydown',d[1])}
function off(e){e.preventDefault();if(!dn)return;dn=0;b.classList.remove('on');fire('keyup',d[1])}
b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});tc.appendChild(b)});
})();
</script>
</body></html>

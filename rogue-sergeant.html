<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rogue Sergeant</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #ld { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: 70%; max-width: 360px; }
  #pb { height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 8px; }
  #pf { height: 100%; width: 0; background: #00e5a8; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }

  /* Touch-Steuerung */
  #tc { display:none; position:absolute; inset:0; pointer-events:none; z-index:5; touch-action:none; user-select:none; -webkit-user-select:none; }
  #tc.on { display:block; }
  #tc .zone { position:absolute; pointer-events:auto; touch-action:none; }
  #lookz { right:0; top:0; width:55%; height:100%; }
  #joyz { left:0; bottom:0; width:42%; height:62%; }
  #joy { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35); display:none; }
  #knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(255,255,255,.45); }
  .tb { position:absolute; pointer-events:auto; touch-action:none; width:62px; height:62px; border-radius:50%; background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.55); color:#fff; font:700 13px system-ui,sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; }
  .tb.act { background:rgba(0,229,168,.55); }
  #b-fire { right:22px; bottom:70px; width:88px; height:88px; background:rgba(220,40,40,.5); font-size:15px; }
  #b-aim { right:122px; bottom:50px; }
  #b-jump { right:22px; bottom:170px; }
  #b-reload { right:96px; bottom:170px; }
  #b-crouch { right:170px; bottom:50px; display:none; }
  #b-weap { right:96px; bottom:240px; }
  #b-use { right:22px; bottom:240px; }
  #b-run { left:24px; bottom:calc(62% + 8px); }
  #b-lq { left:96px; bottom:calc(62% + 8px); width:48px; height:48px; }
  #b-le { left:152px; bottom:calc(62% + 8px); width:48px; height:48px; }
  #b-crouch2 { right:196px; bottom:50px; }
  #tgl { position:absolute; left:10px; top:10px; z-index:9; padding:8px 12px; border-radius:999px; border:0; background:rgba(0,0,0,.55); color:#fff; font:700 13px system-ui,sans-serif; display:none; }
  #b-pause { right:12px; top:10px; width:44px; height:44px; font-size:12px; }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas><div id="tc">
<div class="zone" id="lookz"></div><div class="zone" id="joyz"><div id="joy"><div id="knob"></div></div></div>
<div class="tb" id="b-fire">FEUER</div><div class="tb" id="b-aim">ZIELEN</div><div class="tb" id="b-jump">SPRUNG</div>
<div class="tb" id="b-reload">LADEN</div><div class="tb" id="b-crouch2">DUCKEN</div><div class="tb" id="b-weap">WAFFE</div>
<div class="tb" id="b-use">NEHMEN</div><div class="tb" id="b-run">RENNEN</div><div class="tb" id="b-lq">Q</div><div class="tb" id="b-le">E</div>
<div class="tb" id="b-pause">PAUSE</div></div>
<button id="tgl">Steuerung: AUS</button>
<div id="ld"><div id="tx">Lade Spiel …</div><div id="pb"><div id="pf"></div></div></div></div>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (raw.githubusercontent.com, Commit fest verdrahtet). Kein Server, keine Werbung.
// iPad: Shader laufen sonst mit halber Genauigkeit (mediump) -> Laub/Wind rechnet falsch (weiße, flackernde Bäume). Auf highp umstellen.
(function () {
  for (const C of [window.WebGLRenderingContext, window.WebGL2RenderingContext]) {
    if (!C) continue;
    const o = C.prototype.shaderSource;
    C.prototype.shaderSource = function (sh, src) { return o.call(this, sh, String(src).replace(/\bmediump\b/g, "highp")); };
  }
})();
// iPad (ProMotion 120 Hz): Spiel animiert pro Bild -> alles lief zu schnell. Auf max. 60 Bilder/s begrenzen.
(function () {
  const raf = window.requestAnimationFrame.bind(window); let last = -1e9;
  window.requestAnimationFrame = cb => raf(function f(t) {
    if (t === last || t - last >= 15) { last = t; cb(t); } else raf(f);
  });
})();
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/526aceb6195c443da45a62070d1e5e8fcd73e110/rogue-sergeant/Build/";
const FILES = { data: ["New folder.data", 8], wasm: ["New folder.wasm", 2] };
const tx = document.getElementById("tx"), pf = document.getElementById("pf");
let doneParts = 0, totalParts = 10;
function bump() { doneParts++; pf.style.width = (doneParts / totalParts * 60) + "%"; }
async function merged(name, n) {
  const bufs = await Promise.all(Array.from({length: n}, (_, i) =>
    fetch(BASE + encodeURIComponent(name + ".part" + (i + 1))).then(r => { if (!r.ok) throw new Error(name + " Teil " + (i + 1) + ": " + r.status); return r.arrayBuffer(); }).then(b => { bump(); return b; })));
  return URL.createObjectURL(new Blob(bufs));
}
(async () => {
  try {
    const [dataUrl, codeUrl, loaderTxt, fwTxt] = await Promise.all([
      merged(...FILES.data), merged(...FILES.wasm),
      fetch(BASE + encodeURIComponent("New folder.loader.js")).then(r => r.text()),
      fetch(BASE + encodeURIComponent("New folder.framework.js")).then(r => r.blob())
    ]);
    const s = document.createElement("script"); s.textContent = loaderTxt; document.body.appendChild(s);
    tx.textContent = "Starte …";
    const inst = await createUnityInstance(document.getElementById("c"), {
      dataUrl, codeUrl, frameworkUrl: URL.createObjectURL(fwTxt),
      streamingAssetsUrl: BASE + "../StreamingAssets",
      companyName: "Hammergames", productName: "Rogue Sergeant The Final Operation", productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    }, p => { pf.style.width = (60 + p * 40) + "%"; });
    window.unityGame = inst;
    document.getElementById("ld").remove();
  } catch (e) { tx.textContent = "Fehler beim Laden: " + (e.message || e); }
})();

// ===== Touch-Steuerung (iPad): Tastatur-/Maus-Ereignisse für das Spiel nachbilden =====
(function () {
  const canvas = document.getElementById("c"), tc = document.getElementById("tc"), tgl = document.getElementById("tgl");
  const touchy = (navigator.maxTouchPoints > 0 && matchMedia("(pointer:coarse)").matches) || location.hash === "#touch";
  if (!touchy) return;
  let fake = false, on = false;
  Object.defineProperty(document, "pointerLockElement", { get: () => (fake ? canvas : null), configurable: true });
  Element.prototype.requestPointerLock = function () { fake = true; setOn(true); document.dispatchEvent(new Event("pointerlockchange")); };
  document.exitPointerLock = function () { fake = false; setOn(false); document.dispatchEvent(new Event("pointerlockchange")); };
  const KC = { KeyW:87, KeyA:65, KeyS:83, KeyD:68, KeyR:82, KeyC:67, KeyF:70, KeyQ:81, KeyE:69, Space:32, ShiftLeft:16, Escape:27, Digit1:49, Digit2:50, Digit3:51 };
  const down = {};
  function key(code, isDown) {
    if (!!down[code] === isDown) return; down[code] = isDown;
    const k = code === "Space" ? " " : code.startsWith("Key") ? code[3].toLowerCase() : code === "ShiftLeft" ? "Shift" : code === "Escape" ? "Escape" : code.slice(-1);
    const e = new KeyboardEvent(isDown ? "keydown" : "keyup", { code, key: k, bubbles: true, cancelable: true });
    Object.defineProperty(e, "keyCode", { get: () => KC[code] }); Object.defineProperty(e, "which", { get: () => KC[code] });
    canvas.dispatchEvent(e);
  }
  function mouse(type, btn) {
    const r = canvas.getBoundingClientRect();
    canvas.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: btn, buttons: type === "mouseup" ? 0 : (btn === 2 ? 2 : 1), clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }));
  }
  function look(dx, dy) {
    const e = new MouseEvent("mousemove", { bubbles: true, cancelable: true, clientX: 0, clientY: 0 });
    Object.defineProperty(e, "movementX", { value: dx }); Object.defineProperty(e, "movementY", { value: dy });
    canvas.dispatchEvent(e);
  }
  function setOn(v) { on = v; tc.classList.toggle("on", on); if (!on) Object.keys(down).forEach(c => key(c, false)); }
  // Touches in Menüs gehen bei "AUS" direkt ans Spiel.
  const SENS = 1.6;
  // Blick
  const lz = document.getElementById("lookz"); let lid = null, lx = 0, ly = 0;
  lz.addEventListener("touchstart", e => { e.preventDefault(); const t = e.changedTouches[0]; lid = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: false });
  lz.addEventListener("touchmove", e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === lid) { look((t.clientX - lx) * SENS, (t.clientY - ly) * SENS); lx = t.clientX; ly = t.clientY; } }, { passive: false });
  const lend = e => { for (const t of e.changedTouches) if (t.identifier === lid) lid = null; };
  lz.addEventListener("touchend", lend); lz.addEventListener("touchcancel", lend);
  // Joystick
  const jz = document.getElementById("joyz"), joy = document.getElementById("joy"), knob = document.getElementById("knob"); let jid = null, jx = 0, jy = 0;
  function joyMove(t) {
    let dx = t.clientX - jx, dy = t.clientY - jy; const d = Math.hypot(dx, dy), m = 55; if (d > m) { dx *= m / d; dy *= m / d; }
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
    const th = 18; key("KeyW", dy < -th); key("KeyS", dy > th); key("KeyA", dx < -th); key("KeyD", dx > th);
    key("ShiftLeft", dy < -50);
  }
  jz.addEventListener("touchstart", e => { e.preventDefault(); const t = e.changedTouches[0]; jid = t.identifier; const r = jz.getBoundingClientRect(); jx = t.clientX; jy = t.clientY; joy.style.display = "block"; joy.style.left = (jx - r.left) + "px"; joy.style.top = (jy - r.top) + "px"; knob.style.transform = ""; }, { passive: false });
  jz.addEventListener("touchmove", e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === jid) joyMove(t); }, { passive: false });
  const jend = e => { for (const t of e.changedTouches) if (t.identifier === jid) { jid = null; joy.style.display = "none"; ["KeyW","KeyA","KeyS","KeyD"].forEach(c => key(c, false)); if (!rundown) key("ShiftLeft", false); } };
  jz.addEventListener("touchend", jend); jz.addEventListener("touchcancel", jend);
  // Buttons
  let rundown = false;
  function btn(id, onDown, onUp) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); el.classList.add("act"); onDown(el); }, { passive: false });
    const up = e => { e.preventDefault(); el.classList.remove("act"); if (onUp) onUp(el); };
    el.addEventListener("touchend", up, { passive: false }); el.addEventListener("touchcancel", up, { passive: false });
  }
  const hold = (id, code) => btn(id, () => key(code, true), () => key(code, false));
  btn("b-fire", () => mouse("mousedown", 0), () => mouse("mouseup", 0));
  btn("b-aim", () => mouse("mousedown", 2), () => mouse("mouseup", 2));
  hold("b-jump", "Space"); hold("b-reload", "KeyR"); hold("b-crouch2", "KeyC"); hold("b-use", "KeyF"); hold("b-lq", "KeyQ"); hold("b-le", "KeyE"); hold("b-pause", "Escape");
  btn("b-run", el => { rundown = !rundown; key("ShiftLeft", rundown); el.style.outline = rundown ? "3px solid #00e5a8" : ""; });
  btn("b-weap", () => canvas.dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: 100, deltaMode: 0 })));
  tc.addEventListener("contextmenu", e => e.preventDefault());
  window.__touch = { setOn };
})();

window.open = () => null;
</script>
</body>
</html>

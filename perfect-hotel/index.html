<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Perfect Hotel</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <script src="js/prevent-keys.js"></script></head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" ></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Perfect Hotel</div>
      </div>
    </div>
          <script>
      window.fileMergerConfig = {
        files: [
          { name: 'My_Perfect_Hotel_output_v17.data.br', parts: 1 },
          { name: 'My_Perfect_Hotel_output_v17.wasm.br', parts: 2 },
        ],
        basePath: 'Build/',
        debug: false
      };  
  </script>
  <script src="merge.js"></script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/My_Perfect_Hotel_output_v17.loader.js";
      var config = {
        dataUrl: buildUrl + "/My_Perfect_Hotel_output_v17.data.br",
        frameworkUrl: buildUrl + "/My_Perfect_Hotel_output_v17.framework.js",
        codeUrl: buildUrl + "/My_Perfect_Hotel_output_v17.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "perfect",
        productName: "Perfect Hotel",
        productVersion: "1",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var mobileWarning = document.querySelector("#unity-mobile-warning");
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      loadingBar.style.display = "block";
      var myGameInstance = null;
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          myGameInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
      
     <script type="text/javascript" src="js/gameBreakBeta.js"></script>
  <!-- Moki: Back-Button -->
<a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a>

  #moki-back {
    position: fixed; top: 12px; right: 12px; z-index: 2147483647;
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</body>
</html>

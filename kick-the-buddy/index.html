<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kick the Buddy</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; touch-action: none; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; outline: none; }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40vw; max-width: 360px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
  #loading div { height: 100%; width: 0; background: #fff; transition: width .2s; }
</style>
<script>
      /* unity-net-guard: request ra origin khác = mất mạng */
      (function () {
        function ext(u) {
          try { var x = new URL(String(u), location.href); return /^https?:$/.test(x.protocol) && x.origin !== location.origin && !/^(cdn\.jsdelivr\.net|raw\.githubusercontent\.com)$/.test(x.hostname); } catch (e) { return false; }
        }
        var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function (m, u) { this._blocked = ext(u); return open.apply(this, arguments); };
        XMLHttpRequest.prototype.send = function () {
          if (!this._blocked) return send.apply(this, arguments);
          var x = this;
          setTimeout(function () { x.dispatchEvent(new ProgressEvent("error")); x.dispatchEvent(new ProgressEvent("loadend")); }, 0);
        };
        var f = window.fetch;
        window.fetch = function (r) {
          if (ext(r && r.url || r)) return Promise.reject(new TypeError("Failed to fetch"));
          return f.apply(this, arguments);
        };
        if (navigator.sendBeacon) navigator.sendBeacon = function (u) { return ext(u) ? false : true; };
        var d = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, "src");
        Object.defineProperty(HTMLScriptElement.prototype, "src", {
          get: d.get, configurable: true,
          set: function (v) {
            if (!ext(v)) return d.set.call(this, v);
            var s = this;
            setTimeout(function () { s.dispatchEvent(new Event("error")); }, 0);
          },
        });
        var wo = window.open;
        window.open = function (u) { return ext(u) ? null : wo.apply(this, arguments); };
      })();
    </script>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div></div></div>
<script src="Build/game.loader.js"></script>
<script>
  var bar = document.querySelector("#loading div");
  createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "https://raw.githubusercontent.com/monkeymonkeyohio/kickthebuddy/4bb001e77426825ca2c7e4de18a3ad0753393b1a/Build/game.data",
    frameworkUrl: "Build/game.framework.js",
    codeUrl: "https://raw.githubusercontent.com/monkeymonkeyohio/kickthebuddy/4bb001e77426825ca2c7e4de18a3ad0753393b1a/Build/game.wasm",
    streamingAssetsUrl: "https://raw.githubusercontent.com/monkeymonkeyohio/kickthebuddy/4bb001e77426825ca2c7e4de18a3ad0753393b1a/StreamingAssets",
    companyName: "",
    productName: "Kick the Buddy",
    productVersion: "1.0",
  }, function (p) { bar.style.width = 100 * p + "%"; }).then(function (inst) {
    window.unityGame = inst;
    document.getElementById("loading").remove();
  }).catch(function (e) { console.error(e); });
</script>
</body>
</html>

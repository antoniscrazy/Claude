<!--
  WebOffice Tabellenkalkulation – eigenständige Tabellenkalkulation (eine Datei, offline, ohne externe Abhängigkeiten).
  Formelparser, Auswertung, ZIP/XLSX-Lesen und -Schreiben sind eigener Code ohne Fremdlizenzen. Kein eval, kein new Function.
-->
<style>
:root{--ac:#1f7a45;--ac2:#2e9b57;--acl:#e3f3e9;--bg:#f3f4f5;--bd:#d6d9dd;--tx:#1d2330;--mut:#667085;--hov:#eaedf0;--act:#cfead9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px "Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
.ic{display:block;flex:none}
#titlebar{display:flex;align-items:center;gap:6px;height:40px;background:var(--ac);color:#fff;padding:0 10px}
#titlebar .logo{width:26px;height:26px;border-radius:6px;background:#fff;color:var(--ac);display:grid;place-items:center;font-weight:700;margin-right:4px}
#titlebar .qa{background:transparent;border:0;color:#fff;width:30px;height:30px;border-radius:5px;display:grid;place-items:center;cursor:pointer}
#titlebar .qa:hover:not(:disabled){background:rgba(255,255,255,.2)}#titlebar .qa:disabled{opacity:.4;cursor:default}
#titlebar .qa:focus-visible,.rb-btn:focus-visible,.tab:focus-visible,.stab:focus-visible{outline:2px solid #1b6ef3;outline-offset:1px}
#docname{background:rgba(255,255,255,.15);border:1px solid transparent;color:#fff;border-radius:5px;padding:4px 8px;width:240px;margin-left:8px}
#docname:focus{background:#fff;color:#222;outline:none}
#savestat{margin-left:auto;font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;flex:none}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{background:var(--hov)}.tab.on{border-bottom-color:var(--ac);color:var(--ac);font-weight:600}
#ribbon{display:flex;background:#fff;border-bottom:1px solid var(--bd);padding:6px 8px;min-height:92px;overflow-x:auto;overflow-y:hidden;flex:none}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--bd);padding:0 8px}
.grp .items{display:flex;gap:3px;align-items:flex-start;flex:1;flex-wrap:wrap;align-content:flex-start;max-width:440px}
.grp .gn{font-size:11px;color:var(--mut);text-align:center;padding-top:3px;white-space:nowrap}
.rb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:54px;height:62px;padding:3px 5px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;font-size:11.5px;text-align:center;line-height:1.15}
.rb-btn.sm{flex-direction:row;height:28px;min-width:28px;gap:5px;padding:2px 6px;font-size:12px}.rb-btn.ic-only{min-width:30px}
.rb-btn:hover:not(:disabled){background:var(--hov)}.rb-btn.on{background:var(--act);border-color:#9ed1b1}.rb-btn:disabled{opacity:.38;cursor:default}
.rb-field{display:flex;align-items:center;gap:5px;height:28px;font-size:12px;white-space:nowrap}
.rb-field input,.rb-field select{height:26px;border:1px solid var(--bd);border-radius:4px;padding:0 5px;background:#fff}
.rb-field input[type=color]{width:30px;padding:1px}
.rb-col{display:flex;flex-direction:column;gap:2px}
/* Formelleiste */
#fbar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#fff;border-bottom:1px solid var(--bd);flex:none}
#namebox{width:96px;height:26px;border:1px solid var(--bd);border-radius:4px;padding:0 6px;text-align:center}
#fbar .fxl{color:var(--ac);display:flex}
#fx{flex:1;height:26px;border:1px solid var(--bd);border-radius:4px;padding:0 8px;font-family:Consolas,"Segoe UI",monospace}
#namebox:focus,#fx:focus{outline:2px solid var(--ac2);outline-offset:-1px}
/* Raster */
#gridwrap{flex:1;position:relative;min-height:0;background:#fff;--hw:48px;--hh:24px}
#corner{position:absolute;left:0;top:0;width:var(--hw);height:var(--hh);background:#eef0f2;border-right:1px solid #c5c9ce;border-bottom:1px solid #c5c9ce;cursor:pointer;z-index:3}
#colhead{position:absolute;left:var(--hw);top:0;right:0;height:var(--hh);overflow:hidden;background:#eef0f2;border-bottom:1px solid #c5c9ce;z-index:2}
#rowhead{position:absolute;left:0;top:var(--hh);bottom:0;width:var(--hw);overflow:hidden;background:#eef0f2;border-right:1px solid #c5c9ce;z-index:2}
#colhin{position:relative;height:var(--hh)}#rowhin{position:relative;width:var(--hw)}
.ch,.rh{position:absolute;display:flex;align-items:center;justify-content:center;font-size:12px;color:#444;border-right:1px solid #cfd3d8;border-bottom:1px solid #cfd3d8;user-select:none;overflow:hidden}
.ch{top:0;height:100%}.rh{left:0;width:100%}
.ch.sel,.rh.sel{background:#d3e9dc;color:#0f4d2a;font-weight:600}
#viewport{touch-action:none;position:absolute;left:var(--hw);top:var(--hh);right:0;bottom:0;overflow:auto;outline:none;touch-action:none}
#viewport.extend{touch-action:none}
#content{position:relative}
#cells,#sellayer,#chartlayer{position:absolute;left:0;top:0}
.cell{position:absolute;overflow:hidden;white-space:nowrap;padding:2px 5px;border-right:1px solid #e1e4e8;border-bottom:1px solid #e1e4e8;font-size:11pt;line-height:18px;user-select:none}
.nogrid .cell{border-right-color:transparent;border-bottom-color:transparent}
.cell.wrap{white-space:pre-wrap;word-break:break-word}
.cell.err{color:#b42318}
.cell.fhead{padding-right:20px;font-weight:600}
.fbtn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:1px solid #aab;background:#fff;border-radius:3px;font-size:10px;line-height:14px;text-align:center;cursor:pointer;color:#444}
.fbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#sellayer{pointer-events:none}
.selrect{position:absolute;border:1.5px solid var(--ac);background:transparent}.selrect.multi{background:rgba(31,122,69,.12)}
.actcell{position:absolute;border:2px solid var(--ac);background:transparent}
.fillh{position:absolute;width:9px;height:9px;background:var(--ac);border:1.5px solid #fff;cursor:crosshair;pointer-events:auto;z-index:4}
.fillprev{position:absolute;border:1.5px dashed #444}
#ed{position:absolute;display:none;z-index:6;border:2px solid var(--ac);padding:2px 5px;font-size:11pt;line-height:18px;resize:none;overflow:hidden;background:#fff;outline:none;font-family:inherit}
#chartlayer{pointer-events:none}
.xchart{position:absolute;background:#fff;border:1px solid #b9c0c8;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:auto;z-index:5;border-radius:4px;overflow:hidden}
.xchart.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac2)}
.xch-bar{height:24px;background:#eef6f1;border-bottom:1px solid #d3dfd8;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;cursor:move;user-select:none}
.xch-x{border:0;background:none;font-size:16px;cursor:pointer;line-height:1;color:#555}.xch-x:hover{color:#b42318}
.xch-body{position:absolute;left:0;top:24px;right:0;bottom:0}.xch-body svg{width:100%;height:100%;font-family:inherit}
.xch-rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#8a949e 50%)}
/* Unten */
#sheetbar{display:flex;align-items:center;gap:4px;height:32px;background:#f0f2f4;border-top:1px solid var(--bd);padding:0 6px;flex:none}
#sheettabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.stab{border:1px solid transparent;border-bottom:3px solid transparent;background:none;padding:4px 14px;cursor:pointer;white-space:nowrap;border-radius:4px 4px 0 0}
.stab:hover{background:var(--hov)}.stab.on{background:#fff;border-bottom-color:var(--ac);color:var(--ac);font-weight:600}
.stab.add{font-size:18px;padding:0 10px;line-height:24px}
#status{display:flex;align-items:center;gap:18px;height:26px;background:#f7f7f9;border-top:1px solid var(--bd);padding:0 10px;font-size:12px;color:#444;flex:none}
#status .sp{flex:1}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden;padding:2px 5px;font-size:11pt;line-height:18px;word-break:break-word;white-space:pre-wrap}
#clipbox{position:fixed;left:-9999px;top:0;width:10px;height:10px;opacity:0}
.menu{position:fixed;z-index:8000;background:#fff;border:1px solid var(--bd);border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:4px;min-width:180px;max-height:70vh;overflow:auto}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 10px;text-align:left;border-radius:4px;cursor:pointer}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--hov);outline:none}.menu button:disabled{opacity:.4}
.menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
.fmenu{display:flex;flex-direction:column;gap:4px;padding:4px;min-width:220px}.fmenu .btn{text-align:left}
.fmenu .fl{max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:4px;padding:4px}.fmenu .fl label,.fmenu .all{display:flex;gap:6px;align-items:center;padding:2px 2px}
.fmenu .ft2{display:flex;justify-content:flex-end;gap:6px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:5px 12px;cursor:pointer}.btn:hover{background:var(--hov)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.dlg-back{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,22,30,.45);z-index:7000;display:grid;place-items:center;padding:12px}
.dlg{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(520px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column}.dlg.wide{width:min(760px,100%)}
.dlg h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--bd);font-size:16px}.dlg .bd{padding:14px 18px;overflow:auto;flex:1}.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--bd)}
.form label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.form select,.form input[type=text]{min-width:210px;height:28px;border:1px solid var(--bd);border-radius:4px}
.hint{font-size:12px;color:var(--mut);line-height:1.45}
.csvpv{white-space:pre;font:12px Consolas,monospace;background:#f6f8f7;border:1px solid var(--bd);border-radius:5px;padding:8px;overflow:auto;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#272b36;color:#fff;padding:9px 16px;border-radius:8px;z-index:9500;display:none;max-width:80vw;box-shadow:0 4px 16px #0006}#toast.err{background:#a61b1b}
@media (max-width:700px){.grp .items{max-width:300px}#docname{width:130px}}
@media print{#titlebar,#tabs,#ribbon,#fbar,#sheetbar,#status{display:none!important}#gridwrap{position:static}}
/* Gemeinsames Office-Erscheinungsbild (Titelleiste, Reiter, Menüband, Statusleiste).
   Wird nach dem App-CSS eingebunden und überschreibt dessen Grundwerte. Farbe kommt aus --ac. */
:root{--rb:#f3f3f3;--rbd:#d2d2d2;--hv2:#e1e1e1;--ring:#0f6cbd}
#titlebar{height:42px;gap:2px;padding:0 8px 0 10px;background:var(--ac);position:relative}
#titlebar .logo{width:28px;height:28px;margin:0 8px 0 0;background:none;border-radius:0;display:block;flex:none}
#titlebar .qa{width:32px;height:32px;border-radius:4px}
#titlebar .qa:hover:not(:disabled){background:rgba(255,255,255,.22)}
#docname{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;width:auto;min-width:120px;max-width:300px;margin:0 0 0 6px;font-size:13px;font-weight:600;text-overflow:ellipsis}
#docname:hover{background:rgba(255,255,255,.16)}
#docname:focus{background:#fff;color:#222}
#savestat{margin-left:12px;opacity:.85;font-size:12px}
#tsearch{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:min(34vw,420px);height:28px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 8px;color:#fff;transition:background .12s}
#tsearch:hover,#tsearch:focus-within{background:#fff;color:#222;border-color:#fff}
#tsearch input{flex:1;min-width:0;border:0;background:transparent;color:inherit;outline:none;height:26px;font-size:13px}
#tsearch input::placeholder{color:inherit;opacity:.85}
#tsearch .ic{width:16px;height:16px}
#tsres{display:none;position:absolute;left:-1px;right:-1px;top:30px;background:#fff;color:#222;border:1px solid var(--rbd);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:60vh;overflow:auto;z-index:300;padding:4px 0}
#tsres.open{display:block}
#tsres button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 10px;cursor:pointer;font-size:13px}
#tsres button:hover,#tsres button.sel{background:var(--acl,#e8f0fe)}
#tsres small{color:#777;margin-left:auto;font-size:11px}
#tsres .none{padding:8px 12px;color:#777}
.rb-flash{animation:rbflash 1.4s ease-out 2}
@keyframes rbflash{0%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:0 0 0 3px transparent}}
/* Reiterzeile liegt auf der Akzentfarbe, aktiver Reiter verschmilzt mit dem Menüband */
#tabs{background:var(--ac);border-bottom:0;padding:0 8px 0 6px;gap:1px;align-items:flex-end;height:32px}
.tab{height:30px;padding:0 13px;color:#fff;border:0;border-radius:4px 4px 0 0;font-size:13px;position:relative}
.tab:hover{background:rgba(255,255,255,.18)}
.tab.on{background:var(--rb);color:var(--ac);font-weight:600;border-bottom:0}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--ac);border-radius:2px}
.tab:first-child{font-weight:600}
.tab:first-child:hover:not(.on){background:rgba(0,0,0,.2)}
.tab.ctx{background:rgba(255,255,255,.28);color:#fff}.tab.ctx.on{background:var(--rb);color:var(--ac)}
#ribbon{background:var(--rb);border-bottom:1px solid var(--rbd);padding:5px 6px 3px;min-height:96px;gap:0;align-items:stretch}
.grp{padding:0 6px;border-right:1px solid var(--rbd);position:relative}
.grp:last-child{border-right:0}
.grp .items{align-content:flex-start;gap:2px}
.grp .gn{font-size:11px;color:#555;padding-top:2px;letter-spacing:.1px}
.rb-btn{border-radius:3px;min-width:50px;height:64px;gap:1px}
.rb-btn:hover:not(:disabled){background:var(--hv2);border-color:#c8c8c8}
.rb-btn:active:not(:disabled){background:#d0d0d0}
.rb-btn.on{background:#cfcfcf;border-color:#a8a8a8}
.rb-btn.sm{height:26px;border-radius:3px}
.rb-field input,.rb-field select{border:1px solid #b8b8b8;border-radius:3px;background:#fff}
.rb-field input:hover,.rb-field select:hover{border-color:#777}
.rb-field input:focus,.rb-field select:focus{outline:1px solid var(--ring);border-color:var(--ring)}
/* Statusleiste mit Ansichtsschaltern und Zoomregler */
#status{display:flex;align-items:center;gap:14px;height:26px;padding:0 10px;background:var(--rb);border-top:1px solid var(--rbd);font-size:12px;color:#444;flex:none}
#status .sp{flex:1}
#status label{display:flex;align-items:center;gap:6px}
.zm{display:flex;align-items:center;gap:6px}
.zm button{width:20px;height:20px;border:0;background:none;border-radius:3px;cursor:pointer;font-size:16px;line-height:1;color:#333;padding:0}
.zm button:hover{background:var(--hv2)}
.zm input[type=range]{width:110px;accent-color:var(--ac);margin:0}
.zm output{min-width:42px;text-align:right}
.vsw{display:flex;gap:1px}
.vsw button{width:26px;height:22px;border:0;background:none;border-radius:3px;display:grid;place-items:center;cursor:pointer;color:#333}
.vsw button:hover{background:var(--hv2)}.vsw button.on{background:#d4d4d4;color:var(--ac)}
@media (max-width:900px){#tsearch{display:none}#docname{max-width:160px}}
.fitbtn{border:0;background:none;border-radius:3px;padding:2px 8px;cursor:pointer;font-size:12px;color:#333}.fitbtn:hover{background:var(--hv2)}
.grp{flex:none}
#savestat{margin-left:auto;margin-right:4px;max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tsearch{width:min(32vw,400px)}
@media (max-width:1100px){#savestat{display:none}}
/* Gruppen füllen die ganze Leiste: freier Platz wird gleichmäßig verteilt */
.grp{flex:1 1 auto}
.grp .items{justify-content:center}
#app.rbmin #ribbon{display:none}
.grp .items{flex-wrap:nowrap;max-width:none}
.grp{flex:1 0 auto}
.rb-split{display:inline-flex}.rb-split .cmain{min-width:30px;padding:2px 4px;position:relative;border-radius:3px 0 0 3px}.rb-split .carr{min-width:14px;padding:0 3px;font-size:9px;border-radius:0 3px 3px 0}.cbar{position:absolute;left:5px;right:5px;bottom:1px;height:3px;border-radius:1px}.palette{padding:6px;width:236px}.palette .pl{font-size:11px;color:#555;margin:4px 0 3px}.palette .pg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-bottom:2px}.palette .sw{height:20px;border:1px solid rgba(0,0,0,.2);border-radius:2px;cursor:pointer;padding:0}.palette .sw:hover{outline:2px solid #1b6ef3;z-index:1}.palette .pa{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 4px;cursor:pointer;margin-top:3px;border-radius:3px}.palette .pa:hover{background:var(--hov)}
#qSet{margin-left:0}
@media (max-width:1100px){#qSet{margin-left:auto}}
/* =====================================================================
   Gemeinsames Design: explizit helle Eingabefelder, Dunkelmodus, Touch-Modus, Kontrast, Bewegung, Fixierung gegen Verrutschen
   ===================================================================== */
/* ---- Seite bleibt stehen (kein Verrutschen/Überscrollen), Touch-freundlich ---- */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-size:var(--ui-font,13px)}
#app{position:absolute;inset:0;height:auto;overflow:hidden}
#titlebar,#tabs,#ribbon,#status,#sheetbar,#fbar,.rb-btn,.tab,.stab,.th,.menu,.dlg h3{-webkit-user-select:none;user-select:none}
button,.rb-btn,.tab,.stab,select,summary,label{touch-action:manipulation}
#tabs,#ribbon{touch-action:pan-x;overscroll-behavior:contain}
#viewport,#scroller,#thumbs,#right,#nav,#navlist,#rbody,.dlg .bd,.menu,#sorter,#notes textarea{overscroll-behavior:contain}
#scaler,#ovl{touch-action:none}
input,select,textarea{-webkit-appearance:none;appearance:none}

.setrow label{flex:1;cursor:pointer}
.setrow small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.setrow select{min-width:150px;height:30px;border:1px solid #b8b8b8;border-radius:4px;padding:0 8px}

.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:12px;background:#9aa0aa;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--ac)}

/* ===== ZIP-Hilfe (eigene Implementierung, speichern ohne Kompression; lesen mit DecompressionStream) ===== */
const ZipLib = (() => {
  let T = null;

  function crc32(u8) {
    if (!T) { T = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; } }
    let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = T[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  /** files: [{name, data: string|Uint8Array}] -> Uint8Array (ZIP, Methode "stored") */
  function build(files) {
    const parts = [], central = []; let off = 0;
    for (const f of files) {
      const nameB = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(12, 0x21, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nameB.length, true);
      parts.push(new Uint8Array(lh.buffer), nameB, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(14, 0x21, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nameB.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nameB);
      off += 30 + nameB.length + data.length;
    }
    let cs = 0; for (const c of central) cs += c.length;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cs, true); end.setUint32(16, off, true);
    const all = [...parts, ...central, new Uint8Array(end.buffer)];
    let total = 0; for (const p of all) total += p.length;
    const out = new Uint8Array(total); let o = 0; for (const p of all) { out.set(p, o); o += p.length; }

  }
  /** liest ZIP -> {name: {method,data}} ; Inhalte mit inflate() holen */
  function read(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let e = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('Keine gültige ZIP-/Office-Datei.');
    const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = {};
    for (let i = 0; i < n; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP-Verzeichnis beschädigt.');
      const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nl)); p += 46 + nl + el + cl;
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);

    if (entry.method === 0) return entry.data;

/* Gemeinsame Befehlssuche in der Titelleiste („Was möchten Sie tun?“): sammelt Befehle aller Reiter,
   springt zum Reiter und hebt die Schaltfläche hervor. api = { tabs(), build(id), go(id) } */
function initTellMe(api) {
  const box = document.getElementById('tsearch'), inp = document.getElementById('tsin'), res = document.getElementById('tsres');
  if (!box || !inp) return;
  document.getElementById('tsic').innerHTML = '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>';
  let index = null, shown = [], sel = 0;
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function harvest() {
    if (index) return index; index = [];
    for (const [id, tl] of api.tabs()) {
      let nodes = []; try { nodes = api.build(id); } catch (e) { continue; }
      const holder = document.createElement('div'); holder.append(...nodes);
      holder.querySelectorAll('.grp').forEach(g => {
        const gn = (g.querySelector('.gn') || {}).textContent || '';
        g.querySelectorAll('.rb-btn, .rb-field').forEach(b => {
          const t = (b.textContent || '').trim() || b.title || b.getAttribute('aria-label') || '';
          if (t && !index.some(x => x.tab === id && x.label === t)) index.push({ tab: id, tabLabel: tl, label: t, group: gn, key: norm(t + ' ' + gn + ' ' + tl) });
        });
      });
    }
    return index;
  }
  function show(q) {
    const words = norm(q).split(/\s+/).filter(Boolean);
    shown = words.length ? harvest().filter(x => words.every(w => x.key.includes(w))).slice(0, 14) : [];
    sel = 0; res.replaceChildren();
    if (!words.length) { res.classList.remove('open'); return; }
    if (!shown.length) { const n = document.createElement('div'); n.className = 'none'; n.textContent = 'Kein Befehl gefunden.'; res.append(n); }
    shown.forEach((x, i) => { const b = document.createElement('button'); b.className = i === 0 ? 'sel' : ''; b.type = 'button'; b.append(x.label); const s = document.createElement('small'); s.textContent = x.tabLabel + ' › ' + x.group; b.append(s); b.onmousedown = e => { e.preventDefault(); pick(x); }; res.append(b); });
    res.classList.add('open');
  }
  function pick(x) {
    api.go(x.tab); inp.value = ''; res.classList.remove('open'); inp.blur();
    setTimeout(() => {
      const b = [...document.querySelectorAll('#ribbon .rb-btn, #ribbon .rb-field')].find(e => ((e.textContent || '').trim() || e.title || e.getAttribute('aria-label')) === x.label);
      if (b) { b.scrollIntoView({ block: 'nearest', inline: 'center' }); b.classList.add('rb-flash'); setTimeout(() => b.classList.remove('rb-flash'), 3000); }
    }, 60);
  }

  inp.addEventListener('focus', () => { if (inp.value) show(inp.value); });
  inp.addEventListener('blur', () => setTimeout(() => res.classList.remove('open'), 120));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!shown.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : shown.length - 1)) % shown.length; [...res.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('sel', i === sel)); }
    else if (e.key === 'Enter' && shown[sel]) { e.preventDefault(); pick(shown[sel]); }
    else if (e.key === 'Escape') { inp.value = ''; res.classList.remove('open'); inp.blur(); }
  });
  document.addEventListener('keydown', e => { if (e.altKey && (e.key === 'q' || e.key === 'Q')) { e.preventDefault(); inp.focus(); inp.select(); } });
}

    html = html.replace(/<head[^>]*>/i, m => m + '<base href="' + BASEDIR + '">' + BLOCK + tags);
    document.getElementById("game").srcdoc = html;
    document.getElementById("ld").remove();
  })
  .catch(e => { document.getElementById("ld").textContent = "Fehler beim Laden: " + e.message; });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hills of Steel</title>
<style>html,body{margin:0;height:100%;background:#222;color:#fff;font-family:sans-serif}</style>
</head>
<body>
<p id="msg" style="padding:20px">Lade Hills of Steel aus dem GitHub-Repo …</p>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (über jsDelivr, mit Commit-Version fest verdrahtet).
// Kein lokaler Server nötig – die Datei funktioniert auch per Doppelklick.
const BASE = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@f1ad30272fd9912b2eac68856b2dfeeec261dc55/hills-of-steel/";
// Unity löst StreamingAssets relativ zu document.URL auf – das soll das Repo sein, nicht die lokale Datei.
Object.defineProperty(Document.prototype, "URL", { get() { return BASE + "index.html"; }, configurable: true });
fetch(BASE + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html.replace("<head>", '<head><base href="' + BASE + '">');
    document.open(); document.write(html); document.close();
  })
  .catch(e => { document.getElementById("msg").textContent = "Fehler beim Laden: " + e.message; });
</script>
</body>
</html>

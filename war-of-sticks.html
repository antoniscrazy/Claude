<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War of Sticks</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (über jsDelivr, mit Commit-Version fest verdrahtet).
// Kein lokaler Server nötig – die Datei funktioniert auch per Doppelklick.
const BASE = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@512868c2d38248049b7f1b91255dc85f983cf32b/war-of-sticks/";
const SHIM = '<script>window.open=function(){return null};<\/script><script>(function(){var d=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,"src");Object.defineProperty(HTMLImageElement.prototype,"src",Object.assign({},d,{set:function(v){if(this.crossOrigin===null&&!/^(data|blob):/.test(v))this.crossOrigin="anonymous";d.set.call(this,v)}}));var NW=window.Worker;window.Worker=function(u,o){var s=new URL(u,document.baseURI);if(s.origin===location.origin||!/^https?:$/.test(s.protocol))return new NW(u,o);var c=(o&&o.type==="module")?"import "+JSON.stringify(s.href)+";":"importScripts("+JSON.stringify(s.href)+");";return new NW(URL.createObjectURL(new Blob([c],{type:"text/javascript"})),o)};window.Worker.prototype=NW.prototype;if(window.AudioWorklet){var am=AudioWorklet.prototype.addModule;AudioWorklet.prototype.addModule=async function(u,o){var s=new URL(u,document.baseURI);if(s.origin===location.origin||!/^https?:$/.test(s.protocol))return am.call(this,u,o);var b=await(await fetch(s)).blob();return am.call(this,URL.createObjectURL(new Blob([b],{type:"text/javascript"})),o)}}})();<\/script>';
fetch(BASE + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html.replace("<head>", '<head><base href="' + BASE + '">' + SHIM);
    document.getElementById("game").srcdoc = html;
  })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

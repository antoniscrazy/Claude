<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Browser</title>
<style>
  :root { --bg:#202124; --bar:#35363a; --field:#202124; --text:#e8eaed; --accent:#8ab4f8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  #tabs { display:flex; gap:2px; padding:6px 6px 0; background:var(--bg); overflow-x:auto; }
  .tab { display:flex; align-items:center; gap:6px; padding:7px 10px; background:#2b2c2f; border-radius:8px 8px 0 0;
         cursor:pointer; max-width:180px; min-width:90px; font-size:13px; white-space:nowrap; }
  .tab.active { background:var(--bar); }
  .tab span { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .tab button { background:none; border:0; color:inherit; cursor:pointer; padding:0 2px; border-radius:50%; }
  .tab button:hover { background:#555; }
  #newtab { background:none; border:0; color:var(--text); font-size:20px; cursor:pointer; padding:0 10px; }
  #bar { display:flex; gap:6px; padding:6px; background:var(--bar); align-items:center; }
  #bar button { background:none; border:0; color:var(--text); font-size:18px; cursor:pointer; width:34px; height:34px; border-radius:50%; }
  #bar button:hover { background:#4a4b4f; }
  #bar button:disabled { opacity:.3; cursor:default; }
  #url { flex:1; background:var(--field); color:var(--text); border:1px solid transparent; border-radius:18px; padding:8px 14px; font-size:14px; outline:none; }
  #url:focus { border-color:var(--accent); }
  #proxywrap { display:flex; align-items:center; gap:4px; font-size:12px; white-space:nowrap; }
  #proxysel { background:var(--field); color:var(--text); border:1px solid #555; border-radius:6px; padding:4px; }
  #viewport { flex:1; position:relative; background:#fff; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  iframe.active { display:block; }
  #hint { padding:6px 12px; background:#3c3226; font-size:12.5px; display:none; }
  #hint a { color:var(--accent); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button id="back" title="Zurück">←</button>
  <button id="fwd" title="Vor">→</button>
  <button id="reload" title="Neu laden">⟳</button>
  <button id="home" title="Startseite">⌂</button>
  <input id="url" placeholder="URL oder Suchbegriff eingeben (Wikipedia-Suche)" autocomplete="off" spellcheck="false">
  <div id="proxywrap">
    <label for="proxysel">Modus:</label>
    <select id="proxysel">
      <option value="direct">Direkt (iframe)</option>
      <option value="proxy1">Proxy: allorigins</option>
      <option value="proxy2">Proxy: codetabs</option>
    </select>
  </div>
  <button id="ext" title="In echtem neuen Tab öffnen">↗</button>
</div>
<div id="hint">
  Bleibt die Seite leer? Dann verbietet sie das Einbetten. Versuche den Modus „Proxy“ oder
  <a id="hintopen">öffne sie in einem echten Tab</a>.
</div>
<div id="viewport"></div>

<script>
const HOME = "https://de.wikipedia.org/wiki/Spezial:Suche?search=&go=Go";
const HOME_URL = "https://de.m.wikipedia.org/wiki/Wikipedia:Hauptseite";
const proxies = {
  direct: u => u,
  proxy1: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  proxy2: u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u)
};

let tabs = [], activeId = null, nextId = 1;
const $ = id => document.getElementById(id);

function normalize(input) {
  input = input.trim();
  if (!input) return HOME_URL;
  if (/^https?:\/\//i.test(input)) return input;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(input) && !/\s/.test(input)) return "https://" + input;
  return "https://de.wikipedia.org/w/index.php?search=" + encodeURIComponent(input);
}

function newTab(url) {
  const iframe = document.createElement("iframe");
  iframe.referrerPolicy = "no-referrer";
  iframe.allow = "fullscreen";
  $("viewport").appendChild(iframe);
  const t = { id: nextId++, iframe, history: [], index: -1, title: "Neuer Tab" };
  iframe.addEventListener("load", () => {
    const hint = $("hint");
    if (t.id === activeId && t.history.length) hint.style.display = "block";
  });
  tabs.push(t);
  switchTab(t.id);
  navigate(normalize(url || ""), true);
}

function cur() { return tabs.find(t => t.id === activeId); }

function switchTab(id) {
  activeId = id;
  tabs.forEach(t => t.iframe.classList.toggle("active", t.id === id));
  renderTabs(); syncUI();
}

function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id);
  tabs[i].iframe.remove();
  tabs.splice(i, 1);
  if (!tabs.length) return newTab();
  if (activeId === id) switchTab(tabs[Math.max(0, i - 1)].id);
  else renderTabs();
}

function renderTabs() {
  const el = $("tabs"); el.innerHTML = "";
  tabs.forEach(t => {
    const d = document.createElement("div");
    d.className = "tab" + (t.id === activeId ? " active" : "");
    const s = document.createElement("span"); s.textContent = t.title;
    const b = document.createElement("button"); b.textContent = "✕";
    b.onclick = e => { e.stopPropagation(); closeTab(t.id); };
    d.onclick = () => switchTab(t.id);
    d.append(s, b); el.appendChild(d);
  });
  const n = document.createElement("button"); n.id = "newtab"; n.textContent = "+";
  n.onclick = () => newTab(); el.appendChild(n);
}

function load(t) {
  const url = t.history[t.index];
  t.title = (() => { try { return new URL(url).hostname; } catch { return url; } })();
  t.iframe.src = proxies[$("proxysel").value](url);
  renderTabs(); syncUI();
}

function navigate(url, replaceNew) {
  const t = cur();
  t.history = t.history.slice(0, t.index + 1);
  t.history.push(url); t.index++;
  load(t);
}

function syncUI() {
  const t = cur(); if (!t) return;
  $("url").value = t.history[t.index] || "";
  $("back").disabled = t.index <= 0;
  $("fwd").disabled = t.index >= t.history.length - 1;
  $("hint").style.display = "none";
}

$("url").addEventListener("keydown", e => { if (e.key === "Enter") { navigate(normalize(e.target.value)); e.target.blur(); } });
$("back").onclick = () => { const t = cur(); if (t.index > 0) { t.index--; load(t); } };
$("fwd").onclick = () => { const t = cur(); if (t.index < t.history.length - 1) { t.index++; load(t); } };
$("reload").onclick = () => load(cur());
$("home").onclick = () => navigate(HOME_URL);
$("proxysel").onchange = () => load(cur());
const openExt = () => window.open(cur().history[cur().index], "_blank", "noopener");
$("ext").onclick = openExt;
$("hintopen").onclick = openExt;

newTab(HOME_URL);
</script>
</body>
</html>

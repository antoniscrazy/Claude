<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VoxelCraft Dev-Konsole</title>
<!--
  Dev-Konsole für VoxelCraft: eigene Seite, nur mit PIN. Zeigt alle Server, wer gerade online ist, alle Konten und Spielerdaten
  und erlaubt Löschen/Bearbeiten. Braucht die Migration "voxelcraft_dev_console" (supabase/schema.sql, ganz unten).
  Die Namenstabelle (Block-/Item-IDs) wird mit tools/build_dev.py aus tools/dev_names.json eingesetzt.
-->
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#000;--hi:#4c9a34;--txt:#f2f2f2;--dim:#9aa3ad;--red:#d9534f;--yel:#e8c34a;--blue:#6ea8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:"Courier New",Consolas,monospace;font-weight:bold}
body{padding:16px}
.hidden{display:none !important}
h1{font-size:24px;letter-spacing:2px;color:#fff;text-shadow:3px 3px 0 #2b5a1c}
h2{font-size:18px;margin:18px 0 8px}
.dim{color:var(--dim);font-weight:normal}
.btn{font:inherit;color:#fff;background:#5d6168;border:2px solid #000;padding:7px 12px;cursor:pointer;box-shadow:inset -2px -2px 0 #3c3f45,inset 2px 2px 0 #8a8f97}
.btn:hover{background:#6b7fbd}
.btn.red{background:#9c3a37}.btn.red:hover{background:#c0443f}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.on{background:var(--hi)}
input,select{font:inherit;color:#fff;background:#0e1013;border:2px solid #000;padding:7px 10px;box-shadow:inset 2px 2px 0 #333}
.panel{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px #444;padding:14px 16px;margin:10px 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.top .sp{flex:1}
#login{max-width:340px;margin:12vh auto;text-align:center}
#login input{width:100%;text-align:center;font-size:22px;letter-spacing:8px;margin:14px 0}
#msg{margin-top:10px;min-height:20px;color:var(--yel)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#0e1013;border:2px solid #000;padding:10px}
.stat b{font-size:26px;display:block;color:var(--hi)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#0e1013;border:2px solid #000;padding:12px;cursor:pointer}
.card:hover{border-color:var(--hi)}
.card h3{font-size:17px;margin-bottom:4px;word-break:break-all}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border:1px solid #444;margin:2px 4px 2px 0;color:var(--dim)}
.tag.on{border-color:var(--hi);color:var(--hi)}
.tag.red{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #2a2e35;vertical-align:middle}
th{color:var(--dim);font-weight:bold}
.face{width:28px;height:28px;image-rendering:pixelated;border:1px solid #000;vertical-align:middle;margin-right:8px;background:#333}
.ini{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border:1px solid #000;margin-right:8px;font-size:14px;vertical-align:middle}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-right:6px}
.dot.on{background:#4cd137;box-shadow:0 0 6px #4cd137}
.inv{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0}
.slot{background:#0e1013;border:1px solid #333;min-height:44px;padding:3px;font-size:11px;line-height:1.15;position:relative;word-break:break-word}
.slot i{position:absolute;right:3px;bottom:1px;font-style:normal;color:var(--yel)}
.slot button{position:absolute;right:0;top:0;border:0;background:#9c3a37;color:#fff;font:inherit;font-size:11px;cursor:pointer;padding:0 4px;display:none}
.slot:hover button{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row label{color:var(--dim);font-weight:normal}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;border:2px solid var(--hi);padding:8px 14px;z-index:50}
.scroll{overflow-x:auto}
@media (max-width:640px){.inv{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>

<div id="login" class="panel">
  <h1>DEV</h1>
  <div class="dim">VoxelCraft Konsole</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="12">
  <button class="btn" id="btnLogin" type="button" style="width:100%">Einloggen</button>
  <div id="msg"></div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <h1>DEV-KONSOLE</h1><span class="dim" id="clock"></span><span class="sp"></span>
    <button class="btn sm" id="btnRefresh" type="button">↻ Aktualisieren</button>
    <button class="btn sm" id="btnLogout" type="button">Ausloggen</button>
  </div>
  <div class="tabs">
    <button class="btn on" data-tab="over" type="button">Übersicht</button>
    <button class="btn" data-tab="rooms" type="button">Server</button>
    <button class="btn" data-tab="players" type="button">Konten</button>
    <button class="btn" data-tab="settings" type="button">Einstellungen</button>
  </div>
  <div id="tab-over"></div>
  <div id="tab-rooms" class="hidden"></div>
  <div id="tab-players" class="hidden"></div>
  <div id="tab-settings" class="hidden"></div>
  <div id="tab-room" class="hidden"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = 'https://wzagswxluqpfzksoqsca.supabase.co';
const SUPABASE_KEY = '__ANON_KEY__';
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
const NAMES = /*NAMES*/{}/*END*/;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const itemName = (id) => NAMES[id] || ('#' + id);

let sb = null, PIN = '', ov = null, curRoom = null, curTab = 'over';
const channels = new Map();                  // room -> { ch, players: Map(key -> meta) }
const faces = new Map();                     // name(lower) -> {skin}

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 2600); }
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.supabase) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('supabase-js konnte nicht geladen werden (Internet?)'));
    document.head.appendChild(s);
  });
}
async function client() {
  if (sb) return sb;
  await loadScript(SUPABASE_JS);
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }, realtime: { params: { eventsPerSecond: 10 } } });
  return sb;
}
async function rpc(fn, args) {
  const c = await client();
  const { data, error } = await c.rpc(fn, Object.assign({ p_pin: PIN }, args || {}));
  if (error) throw new Error(/Could not find the function|does not exist|schema cache/i.test(error.message) ? 'Die Datenbank-Funktionen fehlen noch (Migration „voxelcraft_dev_console“ ausführen).' : error.message);
  if (data && data.ok === false) {
    const e = new Error(data.error === 'bad_pin' ? 'Falscher PIN (' + data.left + ' Versuche übrig).' : data.error === 'locked' ? 'Gesperrt – bitte in ' + Math.ceil(data.retry_s / 60) + ' Min. erneut versuchen.' : data.error === 'not_configured' ? 'Es wurde noch kein PIN in der Datenbank gesetzt.' : data.error || 'Fehler');
    e.code = data.error; throw e;
  }
  return data;
}

// ---------- Login ----------
async function login(pin) {
  $('msg').textContent = 'Prüfe …'; PIN = pin;
  try { await rpc('vc_dev_login', {}); }
  catch (e) { PIN = ''; $('msg').textContent = e.message; return; }
  try { sessionStorage.setItem('vcdev', pin); } catch (e) { /* egal */ }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('msg').textContent = '';
  await refresh(); startLive();
}
$('btnLogin').onclick = () => { const v = $('pin').value.trim(); if (v) login(v); };
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnLogout').onclick = () => { try { sessionStorage.removeItem('vcdev'); } catch (e) { /* egal */ } location.reload(); };
$('btnRefresh').onclick = () => refresh(true);
document.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });

function showTab(t) {
  curTab = t; curRoom = null;
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  for (const k of ['over', 'rooms', 'players', 'settings', 'room']) $('tab-' + k).classList.toggle('hidden', k !== t);
  render();
}

// ---------- Live: wer ist gerade online? (Realtime-Presence der Server-Kanäle, nur lesend) ----------
function startLive() {
  if (startLive.t) return; startLive.t = setInterval(() => { refresh(); }, 20000);
  setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('de-DE'); }, 1000);
}
async function syncChannels() {
  const c = await client(), ids = new Set((ov ? ov.rooms : []).map((r) => r.id));
  for (const id of ids) {
    if (channels.has(id)) continue;
    const entry = { players: new Map(), key: 'dev-' + Math.random().toString(36).slice(2) }; channels.set(id, entry);
    const ch = c.channel('vc:' + id, { config: { broadcast: { self: false }, presence: { key: entry.key } } });
    const upd = () => { entry.players = new Map(); const st = ch.presenceState(); for (const k in st) if (st[k][0] && st[k][0].name) entry.players.set(st[k][0].name, st[k][0]); render(true); };
    ch.on('presence', { event: 'sync' }, upd).on('presence', { event: 'join' }, upd).on('presence', { event: 'leave' }, upd);
    ch.subscribe(); entry.ch = ch;
  }
  for (const [id, e] of channels) if (!ids.has(id)) { try { c.removeChannel(e.ch); } catch (x) { /* egal */ } channels.delete(id); }
}
const onlineIn = (room) => (channels.get(room) ? [...channels.get(room).players.keys()] : []);
const onlineNames = () => { const s = new Set(); for (const [, e] of channels) for (const n of e.players.keys()) s.add(n); return s; };

// ---------- Daten ----------
async function refresh(manual) {
  try {
    ov = await rpc('vc_dev_overview', {});
    const c = await client(); const { data } = await c.from('vc_players').select('name,skin,slim');
    (data || []).forEach((p) => faces.set(p.name.toLowerCase(), p));
    await syncChannels();
    if (curRoom) await loadRoom(curRoom, true);
    render();
    if (manual) toast('Aktualisiert');
  } catch (e) { toast(e.message); if (e.code === 'locked' || e.code === 'bad_pin') location.reload(); }
}
let roomData = null;
async function loadRoom(id, silent) {
  try { roomData = await rpc('vc_dev_room', { p_room: id }); curRoom = id; if (!silent) { curTab = 'room'; for (const k of ['over', 'rooms', 'players', 'room']) $('tab-' + k).classList.toggle('hidden', k !== 'room'); } render(); }
  catch (e) { toast(e.message); }
}

// ---------- Darstellung ----------
function faceHtml(name) {
  const p = faces.get(String(name).toLowerCase());
  if (p && p.skin && p.skin.startsWith('data:')) return '<canvas class="face" data-skin="' + esc(name) + '" width="8" height="8"></canvas>';
  let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return '<span class="ini" style="background:hsl(' + h + ',55%,38%)">' + esc(String(name)[0] || '?').toUpperCase() + '</span>';
}
function paintFaces(root) {
  root.querySelectorAll('canvas.face').forEach((cv) => {
    const p = faces.get(cv.dataset.skin.toLowerCase()); if (!p || !p.skin) return;
    const im = new Image(); im.onload = () => { const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(im, 8, 8, 8, 8, 0, 0, 8, 8); c.drawImage(im, 40, 8, 8, 8, 0, 0, 8, 8); }; im.src = p.skin;
  });
}
const ago = (iso) => { if (!iso) return '–'; const s = (Date.now() - new Date(iso).getTime()) / 1000; return s < 90 ? 'gerade eben' : s < 3600 ? Math.round(s / 60) + ' Min.' : s < 86400 ? Math.round(s / 3600) + ' Std.' : Math.round(s / 86400) + ' Tg.'; };
const dt = (iso) => iso ? new Date(iso).toLocaleString('de-DE') : '–';

function render() {
  if (!ov) return;
  if (curTab === 'over') renderOver(); else if (curTab === 'rooms') renderRooms(); else if (curTab === 'players') renderPlayers(); else if (curTab === 'settings') renderSettings(); else if (curTab === 'room') renderRoom();
  paintFaces(document.body);
}
function roomCard(r) {
  const on = onlineIn(r.id);
  return '<div class="card" data-room="' + esc(r.id) + '"><h3>' + esc(r.id) + '</h3>' +
    '<span class="tag ' + (on.length ? 'on' : '') + '">● ' + on.length + ' online</span><span class="tag">' + (r.mode === 'creative' ? 'Kreativ' : 'Überleben') + '</span>' + (r.public ? '' : '<span class="tag red">privat</span>') +
    '<div class="dim" style="margin-top:6px">👑 ' + esc(r.owner || '—') + ' · ⭐ ' + esc((r.ops || []).join(', ') || '—') + '</div>' +
    '<div class="dim">Blöcke geändert: ' + r.edits + ' · Container: ' + r.containers + ' · Spielerdaten: ' + r.states + '</div>' +
    '<div class="dim">Online: ' + (on.map(esc).join(', ') || '—') + '</div></div>';
}
function bindCards(root) { root.querySelectorAll('[data-room]').forEach((c) => { c.onclick = () => loadRoom(c.dataset.room); }); }

function renderOver() {
  const on = onlineNames(), el = $('tab-over');
  const active = ov.rooms.filter((r) => onlineIn(r.id).length).sort((a, b) => onlineIn(b.id).length - onlineIn(a.id).length);
  el.innerHTML = '<div class="stats">' +
    '<div class="stat"><b>' + on.size + '</b>Spieler online</div><div class="stat"><b>' + ov.rooms.length + '</b>Server</div><div class="stat"><b>' + active.length + '</b>Server belebt</div>' +
    '<div class="stat"><b>' + ov.players.length + '</b>Konten</div><div class="stat"><b>' + ov.rooms.reduce((a, r) => a + r.edits, 0) + '</b>geänderte Blöcke</div></div>' +
    '<h2>Gerade online</h2><div class="panel">' + (on.size ? [...on].map((n) => '<div>' + faceHtml(n) + '<span class="dot on"></span>' + esc(n) + ' <span class="dim">auf ' + ov.rooms.filter((r) => onlineIn(r.id).includes(n)).map((r) => esc(r.id)).join(', ') + '</span></div>').join('') : '<span class="dim">Niemand.</span>') + '</div>' +
    '<h2>Aktive Server</h2><div class="grid">' + (active.map(roomCard).join('') || '<span class="dim">Keine aktiven Server.</span>') + '</div>';
  bindCards(el);
}
function renderRooms() {
  const el = $('tab-rooms'); el.innerHTML = '<div class="grid">' + (ov.rooms.map(roomCard).join('') || '<span class="dim">Keine Server.</span>') + '</div>'; bindCards(el);
}
function renderPlayers() {
  const on = onlineNames(), el = $('tab-players');
  el.innerHTML = '<div class="panel scroll"><table><tr><th>Konto</th><th>Status</th><th>Zuletzt gesehen</th><th>Registriert</th><th>Server (Daten)</th><th>Sperre</th><th></th></tr>' +
    ov.players.map((p) => '<tr><td>' + faceHtml(p.name) + esc(p.name) + '</td><td><span class="dot ' + (on.has(p.name) ? 'on' : '') + '"></span>' + (on.has(p.name) ? 'online' : 'offline') + (p.banned ? ' <span class="tag red">gesperrt</span>' : '') + '</td><td>' + ago(p.last_seen) + '</td><td>' + dt(p.created_at) +
      '</td><td>' + (p.rooms || []).map((r) => '<a class="tag" href="#" data-room="' + esc(r) + '" style="color:var(--blue)">' + esc(r) + '</a>').join('') + '</td><td>' + (p.banned ? '<div class="dim" style="max-width:260px">„' + esc(p.ban_msg || 'Dein Konto wurde gesperrt.') + '“</div><button class="btn sm" data-unban="' + esc(p.name) + '" type="button">✔ Entsperren</button> <button class="btn sm" data-banmsg="' + esc(p.name) + '" type="button">✎ Nachricht</button>' : '<button class="btn red sm" data-ban="' + esc(p.name) + '" type="button">🚫 Sperren</button>') + '</td><td><button class="btn red sm" data-delp="' + esc(p.name) + '" type="button">Löschen</button></td></tr>').join('') + '</table></div>';
  el.querySelectorAll('a[data-room]').forEach((a) => { a.onclick = (e) => { e.preventDefault(); loadRoom(a.dataset.room); }; });
  el.querySelectorAll('[data-delp]').forEach((b) => { b.onclick = () => deletePlayer(b.dataset.delp); });
  el.querySelectorAll('[data-ban]').forEach((b) => { b.onclick = () => banAccount(b.dataset.ban, false); });
  el.querySelectorAll('[data-banmsg]').forEach((b) => { b.onclick = () => banAccount(b.dataset.banmsg, true); });
  el.querySelectorAll('[data-unban]').forEach((b) => { b.onclick = () => unbanAccount(b.dataset.unban); });
}
// ---------- Einstellungen: Server-Erstellung sperren (Ausnahmen per Spielername) ----------
async function renderSettings() {
  const el = $('tab-settings'); el.innerHTML = '<div id="stCreate"><div class="panel dim">Lade …</div></div><div id="stLimits"></div>'; renderLimits();
  const ce = $('stCreate');
  let st; try { st = await rpc('vc_dev_get_settings', {}); } catch (e) { ce.innerHTML = '<div class="panel">' + esc(/fehlen noch/.test(e.message) ? 'Dafür einmalig supabase/dev_console_part4.sql im Supabase-SQL-Editor ausführen.' : e.message) + '</div>'; return; }
  if (curTab !== 'settings') return;
  ce.innerHTML = '<h2>Server erstellen</h2><div class="panel">' +
    '<div class="dim">Ist die Sperre an, kann niemand außer den freigegebenen Spielern einen neuen Server erstellen. Bestehende Server laufen weiter, Beitreten bleibt möglich. Die Freigabe gilt für den Spielernamen (Konto).</div>' +
    '<div class="row"><label><input type="checkbox" id="stLocked"' + (st.locked ? ' checked' : '') + '> Server-Erstellung für alle gesperrt</label></div>' +
    '<div class="row"><label>Freigegeben (Komma getrennt)</label><input id="stAllowed" size="40" list="stNames" value="' + esc((st.allowed || []).join(', ')) + '" placeholder="dein Spielername, …"></div>' +
    '<datalist id="stNames">' + ov.players.map((p) => '<option value="' + esc(p.name) + '">').join('') + '</datalist>' +
    '<div class="row"><button class="btn sm" id="stSave" type="button">Speichern</button><span class="dim" id="stState">' + (st.locked ? '🔒 Gesperrt' : '🔓 Offen – jeder darf Server erstellen') + '</span></div></div>';
  $('stSave').onclick = async () => {
    const names = $('stAllowed').value.split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean), locked = $('stLocked').checked;
    if (locked && !names.length && !confirm('Niemand ist freigegeben – dann kann auch niemand (du auch nicht) Server erstellen. Trotzdem sperren?')) return;
    try { await rpc('vc_dev_set_settings', { p_locked: locked, p_allowed: names }); toast(locked ? 'Gesperrt – Ausnahmen: ' + (names.join(', ') || 'keine') : 'Server-Erstellung ist wieder für alle offen'); renderSettings(); }
    catch (e) { toast(e.code === 'bad_name' ? 'Ungültiger Name (3–16 Zeichen: Buchstaben, Ziffern, _)' : e.message); }
  };
}
async function renderLimits() {                                      // Befehls-Limits aufheben (unbegrenztes /fill & Co.)
  const box = $('stLimits'); box.innerHTML = '<div class="panel dim">Lade …</div>';
  let L; try { L = await rpc('vc_dev_get_limits', {}); } catch (e) { box.innerHTML = '<h2>Befehls-Limits</h2><div class="panel">' + esc(/fehlen noch/.test(e.message) ? 'Dafür einmalig supabase/dev_console_part6.sql im Supabase-SQL-Editor ausführen.' : e.message) + '</div>'; return; }
  if (curTab !== 'settings') return;
  box.innerHTML = '<h2>Befehls-Limits</h2><div class="panel">' +
    '<div class="dim">Normalerweise haben Befehle Höchstwerte (z. B. <code>/fill</code> bis 40 000 Blöcke, <code>/sphere</code> Radius 20, <code>/summon</code> 20 Mobs, <code>/give</code> 2304 Stück, <code>/explode</code> Stärke 12). Freigegebene Spieler dürfen diese Grenzen überschreiten – <code>/fill</code> und <code>/sphere</code> laufen dann ohne Obergrenze (zeitverteilt, mit Fortschritt, <code>/fillstop</code> bricht ab). Ab der Warnschwelle muss der Befehl im Spiel innerhalb von 30 Sekunden ein zweites Mal eingegeben werden. Wirkt für Spieler, die Cheat-Befehle nutzen dürfen (OPs bzw. Besitzer) – und im Einzelspieler für das Konto (Name), mit dem der Spieler zuletzt online gespielt hat. Ab 40 000 Blöcken und bei viel TNT schaltet sich im Spiel automatisch der Leistungsmodus ein.</div>' +
    '<div class="row"><label><input type="checkbox" id="lmAll"' + (L.all ? ' checked' : '') + '> Für alle Spieler ohne Limit</label></div>' +
    '<div class="row"><label>Ohne Limit (Komma getrennt)</label><input id="lmNames" size="40" list="lmNamesList" value="' + esc((L.allowed || []).join(', ')) + '" placeholder="dein Spielername, …"></div>' +
    '<datalist id="lmNamesList">' + ov.players.map((p) => '<option value="' + esc(p.name) + '">').join('') + '</datalist>' +
    '<div class="row"><label>Warnung ab</label><input id="lmWarn" type="number" min="1000" max="2000000000" step="1000" value="' + (L.warn || 100000) + '" style="width:130px"> Blöcken / Einheiten</div>' +
    '<div class="row"><button class="btn sm" id="lmSave" type="button">Speichern</button><span class="dim" id="lmState">' + (L.all ? '🔓 Limits für alle aufgehoben' : (L.allowed || []).length ? '🔓 Limits aufgehoben für: ' + esc(L.allowed.join(', ')) : '🔒 Limits gelten für alle') + '</span></div></div>';
  $('lmSave').onclick = async () => {

    const res = await e.ch.send({ type: 'broadcast', event: 'e', payload: { e: 'b', p: [['dev', { c: cmd, t }]], f: e.key } });
    toast(res === 'ok' ? (cmd === 'restart' ? 'Neustart gesendet – ' + onlineIn(curRoom).length + ' Spieler online' : 'Nachricht gesendet') : 'Senden fehlgeschlagen (' + res + ')');
  } catch (x) { toast(x.message); }
}

// ---------- Spielerdaten-Transfer ----------
// Format „VCP1:“ + Z|P (gzip / unkomprimiert) + Base64url(JSON) + „.“ + Prüfsumme – kompatibel mit Datei (.vcp) und Zwischenablage.
const PD_MAGIC = 'VCP1:', SV_MAGIC = 'VCS1:', PD_FIELDS = ['inv', 'armor', 'hp', 'hunger', 'xpL', 'xpP', 'sel', 'fuel'];
const pdHash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0'); };
const pdB64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const pdUnB64 = (t) => { const s = atob(t.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function pdStream(u8, Ctor) { const st = new Blob([u8]).stream().pipeThrough(new Ctor('gzip')); return new Uint8Array(await new Response(st).arrayBuffer()); }
async function pdPack(obj, magic) {
  const raw = new TextEncoder().encode(JSON.stringify(obj)); let flag = 'P', body = raw;
  if (typeof CompressionStream !== 'undefined') { try { body = await pdStream(raw, CompressionStream); flag = 'Z'; } catch (e) { body = raw; flag = 'P'; } }
  const b = pdB64(body); return (magic || PD_MAGIC) + flag + b + '.' + pdHash(b);
}
async function pdUnpack(code, want) {                                // want: 'player' (Standard) | 'server' | 'any'
  code = String(code || '').replace(/\s+/g, '');
  const magic = code.startsWith(PD_MAGIC) ? PD_MAGIC : code.startsWith(SV_MAGIC) ? SV_MAGIC : null;
  if (!magic) throw new Error('Das ist kein Spielerdatencode (VCP1:… / VCS1:…).');
  const dot = code.lastIndexOf('.'); if (dot < 0) throw new Error('Der Code ist unvollständig.');
  const flag = code[magic.length], b = code.slice(magic.length + 1, dot);
  if (pdHash(b) !== code.slice(dot + 1)) throw new Error('Der Code ist beschädigt (Prüfsumme) – vollständig kopiert?');
  let u8 = pdUnB64(b);
  if (flag === 'Z') { if (typeof DecompressionStream === 'undefined') throw new Error('Dieser Browser kann den komprimierten Code nicht lesen.'); u8 = await pdStream(u8, DecompressionStream); }
  else if (flag !== 'P') throw new Error('Unbekanntes Codeformat.');
  const o = JSON.parse(new TextDecoder().decode(u8));
  if (!o || (o.vc !== 'player' && o.vc !== 'server')) throw new Error('Das sind keine Spielerdaten.');
  if ((want || 'player') !== 'any' && o.vc !== (want || 'player')) throw new Error(o.vc === 'server' ? 'Das ist ein Code für einen ganzen Server (VCS1) – bitte unter „Alle Spielerdaten des Servers“ importieren.' : 'Das ist der Code eines einzelnen Spielers (VCP1) – bitte unter „Spielerdaten importieren“ einfügen.');
  return o;
}
function pdStacks(list, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = Array.isArray(list) ? list[i] : null;
    if (!Array.isArray(t) || !(t[0] > 0) || !NAMES[t[0]]) { out.push(0); continue; }
    const o = [t[0] | 0, Math.max(1, Math.min(64, t[1] | 0))];
    if (t[2] !== undefined || t[3]) o.push(Number.isFinite(+t[2]) ? Math.max(1, Math.min(100000, +t[2])) : 1);
    if (t[3] && typeof t[3] === 'object') { const e = {}; for (const k in t[3]) if (/^[a-z_]{1,32}$/.test(k)) e[k] = Math.max(1, Math.min(10, t[3][k] | 0)); if (Object.keys(e).length) o.push(e); }
    out.push(o);
  }
  return out;
}
function pdFromState(name, d) {
  const o = { vc: 'player', v: 1, name, from: curRoom, t: Date.now() };
  for (const k of PD_FIELDS) if (d[k] !== undefined) o[k] = d[k];
  o.pets = d.pets || []; o.veh = d.veh || []; return o;
}
function pdIntoState(existing, o) {                                  // Daten des Spielers auf dem Zielserver: Welt-Teile (Position, Spawn, Dimension) bleiben
  const t = existing ? JSON.parse(JSON.stringify(existing)) : { dim: 0 }, dim = t.dim || 0;
  t.inv = pdStacks(o.inv, 36); t.armor = pdStacks(o.armor, 4);
  if (o.hp != null) t.hp = Math.max(1, Math.min(20, +o.hp || 20)); if (o.hunger != null) t.hunger = Math.max(0, Math.min(20, +o.hunger)); if (o.xpL != null) t.xpL = Math.max(0, Math.min(1000, o.xpL | 0));
  if (o.xpP != null) t.xpP = Math.max(0, Math.min(0.999, +o.xpP || 0)); if (o.sel != null) t.sel = Math.max(0, Math.min(8, o.sel | 0)); if (o.fuel != null) t.fuel = Math.max(0, +o.fuel || 0);
  const FAR = 10000000;                                              // Haustiere/Fahrzeuge erscheinen neben dem Spieler (Ort der alten Welt ist hier sinnlos)
  t.pets = (o.pets || []).filter(Array.isArray).slice(0, 12).map((e) => { const c = e.slice(); c[0] = ''; c[2] = c[3] = c[4] = FAR; c[7] = dim; return c; });
  t.veh = (o.veh || []).filter(Array.isArray).slice(0, 12).map((e) => { const c = e.slice(); c[1] = c[3] = FAR; c[5] = dim; return c; });
  return t;
}
async function writeState(room, name, data) {                       // Upsert (Teil 3); Fallback: nur vorhandene Einträge aktualisieren
  try { await rpc('vc_dev_put_state', { p_room: room, p_name: name, p_data: data }); return; }
  catch (e) {
    if (!/fehlen noch/.test(e.message)) throw e;
    const r = await rpc('vc_dev_room', { p_room: room });
    if (!r.states.some((s) => s.name === name)) throw new Error('Für diesen Spieler gibt es auf „' + room + '“ noch keine Daten. Dafür einmalig supabase/dev_console_part3.sql im Supabase-SQL-Editor ausführen.');
    await rpc('vc_dev_set_state', { p_room: room, p_name: name, p_data: data });
  }
}
async function exportState(name, how) {
  const s = roomData.states.find((x) => x.name === name); if (!s) return;
  const code = await pdPack(pdFromState(name, s.data || {}));
  if (how === 'code') { try { await navigator.clipboard.writeText(code); toast('Code kopiert (' + code.length + ' Zeichen)'); } catch (e) { prompt('Code kopieren (Strg+C):', code); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
  a.download = 'voxelcraft-' + name.replace(/[^\w.-]+/g, '_') + '-' + curRoom.replace(/[^\w.-]+/g, '_') + '.vcp'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('Datei gespeichert');
}
async function transferState(name, target) {
  const s = roomData.states.find((x) => x.name === name); if (!s) return;
  const nn = (prompt('Spielername auf „' + target + '“ (gleicher Name = gleiche Person):', name) || '').trim(); if (!nn) return;
  if (onlineIn(target).includes(nn) && !confirm(nn + ' ist gerade auf „' + target + '“ online – sein Spiel würde die Daten beim nächsten Speichern wieder überschreiben. Trotzdem übertragen?')) return;
  try {
    const tr = await rpc('vc_dev_room', { p_room: target }), ex = tr.states.find((x) => x.name === nn);
    if (!confirm('Spielerdaten von „' + name + '“ (' + curRoom + ') auf „' + nn + '“ (' + target + ') übertragen?\n' + (ex ? 'Das vorhandene Inventar dort wird ersetzt.' : 'Dort gibt es noch keine Daten – ein neuer Eintrag wird angelegt.'))) return;
    await writeState(target, nn, pdIntoState(ex ? ex.data : null, pdFromState(name, s.data || {})));
    toast('Übertragen: ' + name + ' → ' + nn + ' auf „' + target + '“');
  } catch (e) { toast(e.message); }
}
// ---------- Ganzer Server: alle Spielerdaten exportieren / importieren / auf einen anderen Server übertragen ----------
function svFromRoom() {
  const o = { vc: 'server', v: 1, from: curRoom, t: Date.now(), players: {} };
  for (const s of roomData.states) o.players[s.name] = pdFromState(s.name, s.data || {});
  return o;
}
async function exportServer(how) {
  const n = roomData.states.length; if (!n) return toast('Auf diesem Server gibt es noch keine Spielerdaten.');
  const code = await pdPack(svFromRoom(), SV_MAGIC);
  if (how === 'code') { try { await navigator.clipboard.writeText(code); toast('Code für ' + n + ' Spieler kopiert (' + code.length + ' Zeichen)'); } catch (e) { prompt('Code kopieren (Strg+C):', code); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
  a.download = 'voxelcraft-server-' + curRoom.replace(/[^\w.-]+/g, '_') + '.vcs'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('Datei mit ' + n + ' Spielern gespeichert');
}
async function bulkApply(target, bundle, create) {                    // schreibt alle Spieler des Pakets nach „target“; gibt {ok, skipped, failed[]} zurück
  const names = Object.keys(bundle.players || {}), tr = await rpc('vc_dev_room', { p_room: target }), res = { ok: 0, skipped: [], failed: [] };
  const online = onlineIn(target).filter((n) => names.includes(n));
  if (online.length && !confirm('Auf „' + target + '“ sind gerade online: ' + online.join(', ') + '.\nIhr Spiel würde die übertragenen Daten beim nächsten Speichern wieder überschreiben. Trotzdem fortfahren?')) return null;
  let i = 0;
  for (const name of names) {
    i++; toast('Übertrage ' + i + '/' + names.length + ': ' + name + ' …');
    const ex = tr.states.find((x) => x.name === name);
    if (!ex && !create) { res.skipped.push(name); continue; }
    try { await writeState(target, name, pdIntoState(ex ? ex.data : null, bundle.players[name])); res.ok++; }
    catch (e) { res.failed.push(name + ': ' + e.message); if (/part3|fehlen noch|noch keine Daten/.test(e.message) && res.failed.length >= 3) break; }
  }
  return res;
}
function bulkReport(res, target) {
  if (!res) return;
  toast('„' + target + '“: ' + res.ok + ' Spieler übernommen' + (res.skipped.length ? ', ' + res.skipped.length + ' übersprungen (dort keine Daten)' : '') + (res.failed.length ? ', ' + res.failed.length + ' Fehler' : ''));
  if (res.failed.length) alert('Nicht übertragen:\n' + res.failed.slice(0, 12).join('\n'));
}
async function transferServer(target) {
  if (!roomData.states.length) return toast('Auf diesem Server gibt es noch keine Spielerdaten.');
  const create = $('svCreate').checked, n = roomData.states.length;
  if (!confirm('Die Spielerdaten aller ' + n + ' Spieler von „' + curRoom + '“ auf „' + target + '“ übertragen?\nInventar, Rüstung, Erfahrung, Leben/Hunger und Haustiere werden ersetzt; Position, Spawn und Dimension dort bleiben.' + (create ? '' : '\nNur Spieler, die dort schon Daten haben.'))) return;
  try { const res = await bulkApply(target, svFromRoom(), create); bulkReport(res, target); } catch (e) { toast(e.message); }
}
async function previewBulk() {
  const box = $('svPrev'), txt = $('svCode').value.trim(); if (!txt) { box.textContent = ''; return null; }
  try { const o = await pdUnpack(txt, 'server'), n = Object.keys(o.players || {}); box.innerHTML = '✔ Server „' + esc(o.from || '?') + '“ · ' + n.length + ' Spieler: ' + esc(n.slice(0, 20).join(', ')) + (n.length > 20 ? ' …' : ''); return o; }
  catch (e) { box.textContent = '✖ ' + e.message; return null; }
}
async function importServer() {
  const o = await previewBulk(); if (!o) return toast('Bitte einen gültigen Server-Code (VCS1:…) einfügen.');
  const n = Object.keys(o.players || {}).length, create = $('svCreate').checked;
  if (!confirm('Die Spielerdaten von ' + n + ' Spielern (Server „' + (o.from || '?') + '“) auf „' + curRoom + '“ importieren?\nVorhandenes Inventar dieser Spieler wird ersetzt.' + (create ? '' : '\nNur Spieler, die hier schon Daten haben.'))) return;
  try { const res = await bulkApply(curRoom, o, create); bulkReport(res, curRoom); if (res) await loadRoom(curRoom, true); } catch (e) { toast(e.message); }
}
async function importState() {
  const name = $('impName').value.trim(); if (!name) return toast('Bitte einen Spielernamen eintragen.');
  try {
    const o = await pdUnpack($('impCode').value), ex = roomData.states.find((x) => x.name === name);
    if (onlineIn(curRoom).includes(name) && !confirm(name + ' ist gerade online – sein Spiel würde die Daten beim nächsten Speichern überschreiben. Trotzdem importieren?')) return;
    if (!confirm('Spielerdaten (von „' + (o.name || '?') + '“' + (o.from ? ' / ' + o.from : '') + ') für „' + name + '“ auf „' + curRoom + '“ importieren?' + (ex ? '\nVorhandenes Inventar wird ersetzt.' : '\nNeuer Eintrag.'))) return;
    await writeState(curRoom, name, pdIntoState(ex ? ex.data : null, o)); toast('Importiert'); await loadRoom(curRoom, true);
  } catch (e) { toast(e.message); }
}

// Auto-Login in dieser Browser-Sitzung
try { const p = sessionStorage.getItem('vcdev'); if (p) login(p); } catch (e) { /* egal */ }
$('pin').focus();
</script>

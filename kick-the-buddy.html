<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick the Buddy</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *; clipboard-write *" allowfullscreen></iframe>
<script>
// Lädt das Spiel direkt aus dem GitHub-Repo (über jsDelivr, mit Commit-Version fest verdrahtet).
// Kein lokaler Server nötig – die Datei funktioniert auch per Doppelklick.
const BASE = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@c79dcad54ad6c02e389dbcbe400a8e519e4b0d59/kick-the-buddy/";
// (geheim) Taste K: Münzen & Gems auf Maximum und dort halten; nochmal K = aus.
function cheatShim() {
  var on = false, timer = null, pairs = [], MAX = 999999999;
  function sane(v) { return (v >= 0 && v <= 100000000) || v === MAX; }
  // Währungs-Objekt: [Typ-Zeiger, 0, Schlüssel(1=Münzen,2=Gems), Betrag, 0, ptr, 0, 0, ptr, 0, 73168600]
  function isCur(h, x, key) {
    return h[x - 1] === key && h[x - 2] === 0 && h[x + 1] === 0 && h[x + 3] === 0 && h[x + 7] === 73168600 && sane(h[x]);
  }
  function find(h) {
    var coins = {}, gems = {}, i, P;
    for (i = 3; i < h.length - 8; i++) {
      if (h[i + 7] !== 73168600 || h[i - 2] !== 0) continue;
      var k = h[i - 1];
      if (k !== 1 && k !== 2) continue;
      if (h[i + 1] !== 0 || h[i + 3] !== 0 || !sane(h[i])) continue;
      P = h[i - 3];
      (k === 1 ? coins : gems)[P] = ((k === 1 ? coins : gems)[P] || []).concat(i);
    }
    var out = [];
    for (P in coins) {
      if (gems[P] && coins[P].length === 1 && gems[P].length === 1) out.push([coins[P][0], gems[P][0]]);
    }
    return out.length >= 1 && out.length <= 3 ? out : [];
  }
  function valid(h) {
    for (var k = 0; k < pairs.length; k++) if (!isCur(h, pairs[k][0], 1) || !isCur(h, pairs[k][1], 2)) return false;
    return pairs.length > 0;
  }
  function apply() {
    try {
      var h = unityGame.Module.HEAP32;
      if (!valid(h)) pairs = find(h);
      for (var k = 0; k < pairs.length; k++) { h[pairs[k][0]] = MAX; h[pairs[k][1]] = MAX; }
    } catch (e) {}
  }
  function toggle() {
    on = !on;
    if (on) { apply(); timer = setInterval(apply, 500); } else { clearInterval(timer); }
  }
  window.__cheat = toggle;
  window.__cheatInfo = function () {
    var n = -1; try { n = unityGame.Module.HEAP32.length; } catch (e) {}
    return (on ? "an" : "aus") + " | " + (pairs.length ? "Stelle gefunden (" + pairs.length + ")" : "Stelle NICHT gefunden") + " | heap " + n;
  };
  addEventListener("keydown", function (e) {
    if (e.code === "KeyK" || e.key === "k" || e.key === "K") toggle();
  }, true);
}
const SHIM = '<script>Object.defineProperty(Document.prototype,"URL",{get(){return "' + BASE + 'index.html"},configurable:true})<\/script><script>(' + cheatShim.toString() + ')();<\/script>';

// (geheim) K auch außerhalb des Spiels; ohne Tastatur: 5x schnell auf die leere Leiste oben tippen.
function toggleCheat() { try { document.getElementById("game").contentWindow.__cheat(); } catch (e) {} }
addEventListener("keydown", function (e) {
  if (e.code === "KeyK" || e.key === "k" || e.key === "K") toggleCheat();
}, true);
(function () {
  var taps = [], bar = document.getElementById("bar");
  var st = document.createElement("div");
  st.style.cssText = "margin-right:auto;font:11px sans-serif;color:#666;align-self:center;pointer-events:none";
  bar.insertBefore(st, bar.firstChild);
  bar.style.touchAction = "manipulation";
  bar.style.webkitUserSelect = "none"; bar.style.userSelect = "none";
  function info() { try { return document.getElementById("game").contentWindow.__cheatInfo(); } catch (e) { return "Spiel nicht bereit"; } }
  function hit(e) {
    if (e.target !== bar && e.target !== st) return;
    var t = Date.now();
    taps = taps.filter(function (x) { return t - x < 4000; });
    taps.push(t);
    if (taps.length >= 5) {
      taps = []; toggleCheat();
      st.textContent = "…"; setTimeout(function () { st.textContent = info(); setTimeout(function () { st.textContent = ""; }, 4000); }, 1500);
    }
  }
  if (window.PointerEvent) bar.addEventListener("pointerdown", hit); else { bar.addEventListener("touchstart", hit); bar.addEventListener("mousedown", hit); }
})();
fetch(BASE + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html.replace("<head>", '<head><base href="' + BASE + '">' + SHIM);
    document.getElementById("game").srcdoc = html;
  })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

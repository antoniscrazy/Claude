<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie Clicker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *; gamepad *; clipboard-write *" allowfullscreen></iframe>
<script>
// Laedt das Spiel aus dem GitHub-Repo (jsDelivr, fester Commit). Kein lokaler Server noetig.
const BASE = "https://cdn.jsdelivr.net/gh/antoniscrazy/Claude@1f0cedf8e6e70a8cd2e7f643f1a8db9bfdeea1ba/cookie-clicker/";
// Netz-Sperre: Anfragen nur an eigene Herkunft / blob / data.
const BLOCK = '<script>(function(){var ok=function(u){u=String(u||"");return /^(blob:|data:|about:)/.test(u)||u.indexOf("'+BASE+'")===0||!/^(https?:)?[/][/]/.test(u)};var xo=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(!ok(u))throw new Error("blocked");return xo.apply(this,arguments)};var f=window.fetch;window.fetch=function(u){return ok(u&&u.url||u)?f.apply(this,arguments):Promise.reject(new Error("blocked"))};navigator.sendBeacon=function(){return false}})()<\/script>';
fetch(BASE + "index.html")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html.replace("<head>", () => '<head><base href="' + BASE + '">' + BLOCK);
    document.getElementById("game").srcdoc = html;
  })
  .catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Johnny Trigger – Nachbau</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Eigene Leiste über dem Spiel – der Button verdeckt dadurch nichts vom Spiel. */
  #bar { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 6px 12px; background: #111; }
  #game { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
  /* Moki: Back-Button */
  #moki-back {
    padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(90deg, #00e5a8, #ffd23f);
    color: #04201a; font: 800 14px "Segoe UI", system-ui, sans-serif;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0, 0, 0, .5); opacity: .92;
  }
  #moki-back:hover { opacity: 1; transform: scale(1.05); }
</style>
</head>
<body>
<div id="bar"><a id="moki-back" href="https://mokiorg.netlify.app">&larr; Back to Moki</a></div>
<iframe id="game" allow="autoplay *; fullscreen *" allowfullscreen></iframe>
<script>
// Lädt den Nachbau direkt aus deinem GitHub-Repo (raw.githubusercontent.com, Commit fest verdrahtet). Kein Server, keine Werbung.
const BASE = "https://raw.githubusercontent.com/antoniscrazy/Claude/fec2a0fa728aa686d1bcfbb4dc53247b95d639ad/johnny-remake/";
const esc = t => t.replace(/<\/script/gi, "<\\/script");
Promise.all([
  fetch(BASE + "index.html").then(r => { if (!r.ok) throw new Error("index.html: " + r.status); return r.text(); }),
  fetch(BASE + "game.bundle.js").then(r => { if (!r.ok) throw new Error("game.bundle.js: " + r.status); return r.text(); })
]).then(([html, js]) => {
  html = html.replace(/<script type="module" src="[^"]*"><\/script>/, () => '<script>window.__BASE="' + BASE + '"<\/script><script type="module">' + esc(js) + '<\/script>');
  html = html.replace("<head>", () => '<head><base href="' + BASE + '">');
  document.getElementById("game").srcdoc = html;
}).catch(e => { document.body.append("Fehler beim Laden: " + e.message); });
</script>
</body>
</html>

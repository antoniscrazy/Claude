<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Block Dash</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   BLOCK DASH – ein Ein-Datei-Rhythmus-Runner (ohne Sound)
   Steuerung: Leertaste / Pfeil hoch / W / Mausklick / Tippen = Springen
              (Halten = automatisch weiterspringen, im Schiff = steigen)
              Esc / P = Pause, R = Neustart
   ===================================================================== */

// ---------- Konstanten ----------
const W = 960, H = 540;          // logische Auflösung
const T = 40;                    // Kachelgröße in px
const GROUND = 450;              // Bildschirm-y des Bodens
const CAMX = 240;                // Spieler sitzt fest bei diesem Bildschirm-x
const DT = 1 / 240;              // fester Physikschritt
const SPD = 416;                 // 10.4 Kacheln/s
const GRAV = 1260, JUMP_V = 460, PAD_V = 620, ORB_V = 480, FALL_MAX = 900;
const SHIP_UP = 1500, SHIP_DN = 1500, SHIP_MAX = 340;
const CEIL = 400;                // Deckenhöhe im Schiff-Modus (px über Boden)
const SHIP_H = 28;

// ---------- Level-Aufbau ----------
// Koordinaten in Kacheln: x nach rechts, y nach oben (0 = direkt über dem Boden)
const objs = [];
let nid = 0;
const B = (x, y, w = 1, h = 1) => objs.push({ k: 'b', id: nid++, x0: x * T, x1: (x + w) * T, y0: y * T, y1: (y + h) * T, w, h });
const S = (x, y = 0, flip = false) => objs.push({
  k: 's', id: nid++, tx: x, ty: y, flip,
  hx0: x * T + 13, hx1: x * T + 27,
  hy0: flip ? y * T + T - 22 : y * T, hy1: flip ? (y + 1) * T : y * T + 22,
  x0: x * T, x1: (x + 1) * T
});
const SPIKES = (x, n, y = 0, flip = false) => { for (let i = 0; i < n; i++) S(x + i, y, flip); };
const PAD = x => objs.push({ k: 'p', id: nid++, x0: x * T + 4, x1: x * T + 36, y0: 0, y1: 12, tx: x });
const ORB = (x, y) => objs.push({ k: 'o', id: nid++, cx: x * T + 20, cy: y * T + 20, x0: x * T, x1: (x + 1) * T });
const PORTAL = (x, type, y = 0, h = 5) => objs.push({ k: 't', id: nid++, type, tx: x, ty: y, h, x0: x * T + 10, x1: x * T + 30, y0: y * T, y1: (y + h) * T });
// Säulenpaar im Schiff-Abschnitt: Lücke ab Reihe gapY mit Höhe gapH
const PILLAR = (x, gapY, gapH, w = 2) => {
  if (gapY > 0) B(x, 0, w, gapY);
  const top = gapY + gapH;
  if (top < 10) B(x, top, w, 10 - top);
};

/* ---- Abschnitt 1: Cube, Grundlagen ---- */
S(16);
SPIKES(23, 2);
SPIKES(31, 3);
B(40, 0, 3, 1); S(45);
SPIKES(52, 2); B(56, 0, 3, 1); SPIKES(61, 2);
// Treppe hoch und wieder runter
B(68, 0, 3, 1); B(72, 0, 3, 2); B(76, 0, 3, 3); B(80, 0, 3, 2); B(84, 0, 3, 1);
SPIKES(89, 2);

/* ---- Abschnitt 2: Pads & Orbs ---- */
PAD(96); SPIKES(100, 5);
SPIKES(112, 6); ORB(114, 2);
SPIKES(126, 2);
PAD(132); B(137, 2, 4, 1);
SPIKES(145, 3);

/* ---- Abschnitt 3: Schiff ---- */
PORTAL(155, 'ship');
const shipGaps = [[3, 5], [5, 4], [1, 5], [4, 4], [2, 5], [5, 4], [1, 4], [4, 5], [0, 5], [3, 4]];
shipGaps.forEach((g, i) => PILLAR(170 + i * 12, g[0], g[1]));
S(176, 0); S(188, 9, 0 + true); S(200, 0); S(212, 9, true); S(224, 0);
PORTAL(292, 'cube', 0, 10);

/* ---- Abschnitt 4: Cube, schneller ---- */
PORTAL(300, 'fast');
SPIKES(312, 2);
SPIKES(322, 3);
B(332, 0, 3, 1); SPIKES(337, 2);
B(346, 0, 4, 1); B(351, 0, 4, 2); SPIKES(357, 2);
PAD(366); SPIKES(370, 6);
SPIKES(388, 1); SPIKES(391, 1); SPIKES(394, 1);
SPIKES(404, 7); ORB(407, 2);
SPIKES(424, 2);
const END_X = 440;               // Ziel (Kachel)

// Spalten-Index für schnelle Kollisionsabfrage
const cols = [];
for (const o of objs) {
  const a = Math.floor(o.x0 / T), b = Math.floor((o.x1 - 0.001) / T);
  for (let c = a; c <= b; c++) (cols[c] || (cols[c] = [])).push(o);
}
const _near = [];
function getNear(x) {
  _near.length = 0;
  const c0 = Math.floor(x / T) - 1, c1 = c0 + 4;
  for (let c = Math.max(0, c0); c <= c1; c++) {
    const l = cols[c]; if (!l) continue;
    for (let i = 0; i < l.length; i++) _near.push(l[i]);
  }
  return _near;
}

// ---------- Simulation (ohne DOM, damit testbar) ----------
function newState() {
  return { x: 0, y: 0, vy: 0, mode: 'cube', speed: 1, onGround: true,
           dead: false, won: false, t: 0, pressT: -9, used: new Set() };
}
function cloneState(s) { const c = Object.assign({}, s); c.used = new Set(s.used); return c; }

function step(s, held, dt) {
  if (s.dead || s.won) return;
  s.t += dt;
  const ship = s.mode === 'ship';
  const w = T, h = ship ? SHIP_H : T;
  const near = getNear(s.x);
  const py0 = s.y;

  // --- vertikal ---
  if (ship) {
    s.vy += (held ? SHIP_UP : -SHIP_DN) * dt;
    if (s.vy > SHIP_MAX) s.vy = SHIP_MAX; else if (s.vy < -SHIP_MAX) s.vy = -SHIP_MAX;
  } else {
    if (s.onGround && held) { s.vy = JUMP_V; s.onGround = false; }
    s.vy -= GRAV * dt;
    if (s.vy < -FALL_MAX) s.vy = -FALL_MAX;
  }
  s.y += s.vy * dt;
  s.onGround = false;
  if (s.y <= 0) { s.y = 0; if (s.vy < 0) s.vy = 0; s.onGround = true; }
  if (ship && s.y + h >= CEIL) { s.y = CEIL - h; if (s.vy > 0) s.vy = 0; }
  for (let i = 0; i < near.length; i++) {
    const o = near[i]; if (o.k !== 'b') continue;
    if (s.x + w > o.x0 + 0.01 && s.x < o.x1 - 0.01 && s.y < o.y1 - 0.001 && s.y + h > o.y0 + 0.001) {
      if (s.vy <= 0 && py0 >= o.y1 - 4) { s.y = o.y1; if (s.vy < 0) s.vy = 0; s.onGround = true; }
      else if (s.vy > 0 && py0 + h <= o.y0 + 4) {
        if (ship) { s.y = o.y0 - h; s.vy = 0; } else { s.dead = true; return; }
      }
    }
  }

  // --- horizontal ---
  s.x += SPD * s.speed * dt;
  for (let i = 0; i < near.length; i++) {
    const o = near[i]; if (o.k !== 'b') continue;
    if (s.x + w > o.x0 + 0.01 && s.x < o.x1 - 0.01 && s.y < o.y1 - 0.001 && s.y + h > o.y0 + 0.001) {
      if (s.y >= o.y1 - 5) { s.y = o.y1; if (s.vy < 0) s.vy = 0; s.onGround = true; }
      else { s.dead = true; return; }
    }
  }

  // --- Gefahren, Pads, Orbs, Portale ---
  const bx0 = s.x + 6, bx1 = s.x + w - 6, by0 = s.y + 6, by1 = s.y + h - 6;
  const pcx = s.x + w / 2, pcy = s.y + h / 2;
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    switch (o.k) {
      case 's':
        if (bx1 > o.hx0 && bx0 < o.hx1 && by1 > o.hy0 && by0 < o.hy1) { s.dead = true; return; }
        break;
      case 'p': {
        const hit = s.x < o.x1 && s.x + w > o.x0 && s.y < o.y1 && s.y + h > o.y0;
        if (hit && !s.used.has(o.id)) { s.used.add(o.id); s.vy = PAD_V; s.onGround = false; }
        else if (!hit && s.used.has(o.id)) s.used.delete(o.id);
        break;
      }
      case 'o': {
        const dx = pcx - o.cx, dy = pcy - o.cy;
        const hit = dx * dx + dy * dy < 38 * 38;
        if (hit && !s.used.has(o.id) && s.t - s.pressT < 0.1 && !ship) {
          s.used.add(o.id); s.vy = ORB_V; s.onGround = false;
        } else if (!hit && s.used.has(o.id)) s.used.delete(o.id);
        break;
      }
      case 't':
        if (s.x < o.x1 && s.x + w > o.x0 && s.y < o.y1 && s.y + h > o.y0) {
          if (o.type === 'ship') s.mode = 'ship';
          else if (o.type === 'cube') { s.mode = 'cube'; s.onGround = false; }
          else if (o.type === 'fast') s.speed = 1.25;
          else if (o.type === 'slow') s.speed = 1;
        }
        break;
    }
  }
  if (s.x >= END_X * T) s.won = true;
}

// ---------- Spielzustand ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;
const game = { scene: 'menu', s: newState(), attempt: 1, best: 0, deadT: 0, shake: 0, flash: 0,
               parts: [], acc: 0, trailT: 0, rot: 0, ceilAmt: 0, frame: 0, time: 0, winT: 0 };
try { game.best = +localStorage.getItem('blockdash_best') || 0; } catch (e) {}

const keys = new Set(); let pointerDown = false;
const isHeld = () => keys.size > 0 || pointerDown;

function startRun() {
  game.s = newState(); game.rot = 0; game.parts.length = 0; game.acc = 0;
  game.ceilAmt = 0; game.scene = 'play';
}
function onPress() {
  switch (game.scene) {
    case 'menu': game.attempt = 1; startRun(); break;
    case 'win': game.scene = 'menu'; game.s = newState(); break;
    case 'pause': game.scene = 'play'; break;
    case 'play': game.s.pressT = game.s.t; break;
  }
}
function saveBest(p) {
  if (p > game.best) { game.best = p; try { localStorage.setItem('blockdash_best', String(p)); } catch (e) {} }
}
const progress = () => Math.min(100, Math.floor(game.s.x / (END_X * T) * 100));

addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
    e.preventDefault();
    if (!keys.has(c)) { keys.add(c); onPress(); }
  } else if (c === 'Escape' || c === 'KeyP') {
    if (game.scene === 'play') game.scene = 'pause'; else if (game.scene === 'pause') game.scene = 'play';
  } else if (c === 'KeyR' && (game.scene === 'play' || game.scene === 'pause' || game.scene === 'dead')) {
    game.attempt++; startRun();
  }
});
addEventListener('keyup', e => keys.delete(e.code));
cv.addEventListener('pointerdown', e => { e.preventDefault(); pointerDown = true; onPress(); });
addEventListener('pointerup', () => { pointerDown = false; });
addEventListener('pointercancel', () => { pointerDown = false; });
addEventListener('blur', () => { keys.clear(); pointerDown = false; if (game.scene === 'play') game.scene = 'pause'; });
addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const sc = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * sc + 'px'; cv.style.height = H * sc + 'px';
  cv.width = Math.round(W * sc * dpr); cv.height = Math.round(H * sc * dpr);
  scale = sc * dpr;
}
addEventListener('resize', resize); resize();

// ---------- Partikel ----------
function spawn(x, y, vx, vy, life, size, color) {
  game.parts.push({ x, y, vx, vy, life, max: life, size, color });
}
function explode() {
  const s = game.s, h = s.mode === 'ship' ? SHIP_H : T;
  for (let i = 0; i < 36; i++) {
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 420;
    spawn(s.x + T / 2, s.y + h / 2, Math.cos(a) * v, Math.sin(a) * v + 100,
          0.5 + Math.random() * 0.5, 4 + Math.random() * 9, i % 3 ? '#5be7ff' : '#ffffff');
  }
}

// ---------- Update ----------
function update(dt) {
  game.time += dt; game.frame++;
  const s = game.s;
  if (game.scene === 'play') {
    const held = isHeld();
    game.acc += dt;
    while (game.acc >= DT) {
      step(s, held, DT); game.acc -= DT;
      if (s.dead || s.won) break;
    }
    // Rotation (nur Optik)
    if (s.mode === 'cube') {
      if (s.onGround) {
        const target = Math.round(game.rot / (Math.PI / 2)) * (Math.PI / 2);
        game.rot += (target - game.rot) * Math.min(1, dt * 30);
      } else game.rot += 4.3 * dt * 1.0 * (Math.PI / 1) * 0.5 * 2;
    }
    game.ceilAmt += ((s.mode === 'ship' ? 1 : 0) - game.ceilAmt) * Math.min(1, dt * 6);
    // Spur
    game.trailT -= dt;
    if (game.trailT <= 0) {
      game.trailT = 0.025;
      if (s.mode === 'ship') spawn(s.x + 4, s.y + SHIP_H / 2 - 4, -140, (Math.random() - .5) * 60, 0.35, 8, '#ffb347');
      else if (s.onGround) spawn(s.x + 4, s.y + 2, -90 - Math.random() * 60, 40 + Math.random() * 70, 0.35, 6, '#5be7ff');
    }
    if (s.dead) {
      explode(); game.scene = 'dead'; game.deadT = 0.8; game.shake = 0.25; game.flash = 0.25;
      saveBest(progress());
    } else if (s.won) {
      game.scene = 'win'; game.winT = 0; saveBest(100);
      for (let i = 0; i < 90; i++) {
        spawn(s.x + 100 + Math.random() * 300, 100 + Math.random() * 300, (Math.random() - .5) * 200, (Math.random() - .5) * 200,
              1.5 + Math.random(), 5 + Math.random() * 8, ['#ffe14a', '#ff4fa3', '#5be7ff', '#4dff88'][i % 4]);
      }
    }
  } else if (game.scene === 'dead') {
    game.deadT -= dt;
    if (game.deadT <= 0) { game.attempt++; startRun(); }
  } else if (game.scene === 'win') game.winT += dt;
  else if (game.scene === 'menu') { game.s.x = 0; }

  if (game.scene !== 'pause') {
    for (let i = game.parts.length - 1; i >= 0; i--) {
      const p = game.parts[i]; p.life -= dt;
      if (p.life <= 0) { game.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (game.scene === 'dead' || game.scene === 'win') p.vy -= 900 * dt;
    }
  }
  game.shake = Math.max(0, game.shake - dt); game.flash = Math.max(0, game.flash - dt);
}

// ---------- Farben ----------
const PAL = [
  { x: 0,   a: '#1f3b9a', b: '#0a1233', acc: '#47d4ff' },
  { x: 90,  a: '#6a1fa8', b: '#1c0a38', acc: '#d27bff' },
  { x: 150, a: '#a01c52', b: '#2c0a1b', acc: '#ff5fa8' },
  { x: 290, a: '#1c8a5a', b: '#06241a', acc: '#4dff9a' },
  { x: 360, a: '#b85a14', b: '#2e1204', acc: '#ffb347' }
];
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')'; };
function palette(tx) {
  let i = 0; while (i < PAL.length - 1 && tx >= PAL[i + 1].x) i++;
  if (i >= PAL.length - 1) return PAL[PAL.length - 1];
  const a = PAL[i], b = PAL[i + 1], f = Math.max(0, Math.min(1, (tx - b.x + 12) / 12));
  return { a: mix(a.a, b.a, f), b: mix(a.b, b.b, f), acc: mix(a.acc, b.acc, f) };
}

// ---------- Rendering ----------
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const s = game.s;
  const pal = palette(s.x / T);
  let camX = s.x - CAMX;
  let ox = 0, oy = 0;
  if (game.shake > 0) { ox = (Math.random() - .5) * 14 * game.shake * 4; oy = (Math.random() - .5) * 14 * game.shake * 4; }
  ctx.save(); ctx.translate(ox, oy);

  // Hintergrund
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal.a); g.addColorStop(1, pal.b);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  // Parallax-Formen
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  for (let i = 0; i < 14; i++) {
    const sz = 90 + (i * 53) % 120;
    let x = ((i * 190 - camX * 0.25) % (W + 260) + (W + 260)) % (W + 260) - 130;
    ctx.fillRect(x, 40 + (i * 97) % 330, sz, sz);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = -((camX * 0.5) % 80); x < W; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); }
  ctx.stroke();

  // Objekte
  const c0 = Math.floor(camX / T) - 2, c1 = c0 + Math.ceil(W / T) + 4;
  const acc = pal.acc;
  for (let c = Math.max(0, c0); c <= c1; c++) {
    const l = cols[c]; if (!l) continue;
    for (const o of l) {
      if (o._f === game.frame) continue; o._f = game.frame;
      drawObj(o, camX, acc);
    }
  }

  // Boden
  const gg = ctx.createLinearGradient(0, GROUND, 0, H);
  gg.addColorStop(0, 'rgba(0,0,0,0.55)'); gg.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = gg; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = acc; ctx.fillRect(-20, GROUND - 2, W + 40, 4);
  ctx.globalAlpha = 0.25; ctx.fillStyle = acc;
  for (let x = -((camX) % 80); x < W; x += 80) ctx.fillRect(x, GROUND + 14, 40, 3);
  ctx.globalAlpha = 1;
  // Decke (Schiff)
  if (game.ceilAmt > 0.01) {
    const cy = GROUND - CEIL;
    ctx.globalAlpha = game.ceilAmt;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(-20, -20, W + 40, cy + 20);
    ctx.fillStyle = acc; ctx.fillRect(-20, cy - 2, W + 40, 4);
    ctx.globalAlpha = 1;
  }

  // Partikel
  for (const p of game.parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX - p.size / 2, GROUND - p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // "Attempt"-Text
  if (game.scene !== 'menu') {
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Versuch ' + game.attempt, 40 - camX + 60, GROUND - 190);
  }

  // Spieler
  if (game.scene !== 'dead' && !(game.scene === 'win' && game.winT > 0.3)) drawPlayer(s, camX, pal.acc);

  ctx.restore();

  if (game.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (game.flash * 2.2) + ')'; ctx.fillRect(0, 0, W, H); }

  drawHUD(pal.acc);
}

function drawObj(o, camX, acc) {
  switch (o.k) {
    case 'b':
      for (let i = 0; i < o.w; i++) for (let j = 0; j < o.h; j++) {
        const x = o.x0 + i * T - camX, y = GROUND - (o.y0 + (j + 1) * T);
        if (x < -T || x > W) continue;
        ctx.fillStyle = 'rgba(4,6,22,0.88)'; ctx.fillRect(x, y, T, T);
        ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, T - 2, T - 2);
        ctx.globalAlpha = 0.35; ctx.strokeRect(x + 10, y + 10, T - 20, T - 20); ctx.globalAlpha = 1;
      }
      break;
    case 's': {
      const x = o.x0 - camX, yb = GROUND - o.ty * T;
      ctx.beginPath();
      if (!o.flip) { ctx.moveTo(x + 3, yb); ctx.lineTo(x + 20, yb - T + 4); ctx.lineTo(x + 37, yb); }
      else { const yt = yb - T; ctx.moveTo(x + 3, yt); ctx.lineTo(x + 20, yt + T - 4); ctx.lineTo(x + 37, yt); }
      ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      break;
    }
    case 'p': {
      const x = o.x0 - camX, y = GROUND;
      ctx.fillStyle = '#ffe14a'; ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + 4, y - 11); ctx.lineTo(x + 28, y - 11); ctx.lineTo(x + 32, y); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.3; ctx.fillRect(x - 4, y - 16, 40, 16); ctx.globalAlpha = 1;
      break;
    }
    case 'o': {
      const x = o.cx - camX, y = GROUND - o.cy, p = 1 + Math.sin(game.time * 6) * 0.08;
      ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(x, y, 11 * p, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 3; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(x, y, 20 * p, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
      break;
    }
    case 't': {
      const col = o.type === 'ship' ? '#ff4fa3' : o.type === 'cube' ? '#4dff88' : '#ffb020';
      const x = (o.x0 + o.x1) / 2 - camX, cy = GROUND - (o.y0 + o.y1) / 2, ry = (o.y1 - o.y0) / 2;
      ctx.fillStyle = col; ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.ellipse(x, cy, 18, ry, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(x, cy, 12, ry, 0, 0, 7); ctx.stroke();
      if (o.type === 'fast') { // Doppelpfeil
        ctx.fillStyle = col; ctx.beginPath();
        ctx.moveTo(x - 8, cy - 14); ctx.lineTo(x + 2, cy); ctx.lineTo(x - 8, cy + 14);
        ctx.moveTo(x + 2, cy - 14); ctx.lineTo(x + 12, cy); ctx.lineTo(x + 2, cy + 14); ctx.fill();
      }
      break;
    }
  }
}

function drawPlayer(s, camX, acc) {
  const x = s.x - camX;
  if (s.mode === 'ship') {
    const cx = x + T / 2, cy = GROUND - s.y - SHIP_H / 2;
    const ang = Math.max(-0.6, Math.min(0.6, -s.vy / 400));
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    // kleiner Würfel als Pilot
    ctx.fillStyle = '#5be7ff'; ctx.fillRect(-9, -22, 20, 20);
    ctx.strokeStyle = '#06324a'; ctx.lineWidth = 2; ctx.strokeRect(-9, -22, 20, 20);
    // Schiffskörper
    ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-14, 14); ctx.lineTo(18, 14); ctx.lineTo(24, 0); ctx.lineTo(-12, -4); ctx.closePath();
    ctx.fillStyle = '#ff7ac0'; ctx.fill(); ctx.strokeStyle = '#4a0a2b'; ctx.stroke();
    ctx.fillStyle = '#4a0a2b'; ctx.fillRect(-10, 6, 18, 3);
    ctx.restore();
  } else {
    const cx = x + T / 2, cy = GROUND - s.y - T / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(game.rot);
    const gr = ctx.createLinearGradient(-20, -20, 20, 20);
    gr.addColorStop(0, '#8ff1ff'); gr.addColorStop(1, '#2aa7e0');
    ctx.fillStyle = gr; ctx.fillRect(-20, -20, T, T);
    ctx.strokeStyle = '#052a40'; ctx.lineWidth = 3; ctx.strokeRect(-19, -19, T - 2, T - 2);
    ctx.fillStyle = '#052a40'; ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = '#8ff1ff'; ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();
  }
}

function drawHUD(acc) {
  ctx.textBaseline = 'alphabetic';
  if (game.scene !== 'menu') {
    const p = progress(), bw = 440, bx = (W - bw) / 2, by = 14;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = acc; ctx.fillRect(bx, by, bw * Math.min(1, game.s.x / (END_X * T)), 12);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, 12);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(p + '%', bx + bw + 12, by + 12);
  }
  const center = (txt, y, size, col = '#fff') => {
    ctx.font = 'bold ' + size + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(txt, W / 2, y);
    ctx.fillStyle = col; ctx.fillText(txt, W / 2, y);
  };
  if (game.scene === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    center('BLOCK DASH', 190, 86, acc);
    center('Springe über Spikes, nutze Pads & Orbs, flieg durchs Schiff-Level', 245, 22);
    center('Leertaste / Klick / Tippen = Start & Springen', 330, 26);
    center('Esc = Pause   ·   R = Neustart', 366, 20, 'rgba(255,255,255,0.75)');
    center('Bestwert: ' + game.best + '%', 430, 28, '#ffe14a');
  } else if (game.scene === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    center('PAUSE', 250, 70);
    center('Leertaste / Klick = weiter', 300, 24);
  } else if (game.scene === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.5, game.winT * 0.4) + ')'; ctx.fillRect(0, 0, W, H);
    if (game.winT > 0.4) {
      center('LEVEL GESCHAFFT!', 230, 70, '#ffe14a');
      center('Versuche: ' + game.attempt, 285, 28);
      center('Leertaste / Klick = zurück zum Menü', 340, 22, 'rgba(255,255,255,0.8)');
    }
  }
}

// ---------- Hauptschleife ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Hooks für automatische Tests
window.__gd = { newState, cloneState, step, END_X, T, DT, objs };
</script>

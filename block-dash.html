function compile(def) {
  const objs = []; let nid = 0, coinN = 0;
  const add = o => { o.id = nid++; objs.push(o); return o; };
  const a = {
    B: (x, y, w = 1, h = 1) => add({ k: 'b', x0: x * T, x1: (x + w) * T, y0: y * T, y1: (y + h) * T, w, h }),
    S: (x, y = 0, flip = false) => add({ k: 's', tx: x, ty: y, flip, hx0: x * T + 13, hx1: x * T + 27,
        hy0: flip ? y * T + T - 22 : y * T, hy1: flip ? (y + 1) * T : y * T + 22, x0: x * T, x1: (x + 1) * T }),
    PAD: (x, kind = 'y', y = 0, flip = false) => add({ k: 'p', kind, flip, tx: x, ty: y, x0: x * T + 4, x1: x * T + 36,
        y0: flip ? (y + 1) * T - 12 : y * T, y1: flip ? (y + 1) * T : y * T + 12 }),
    ORB: (x, y, kind = 'y') => add({ k: 'o', kind, cx: x * T + 20, cy: y * T + 20, x0: x * T, x1: (x + 1) * T }),
    PORTAL: (x, type, y = 0, h = 5, val = 1) => add({ k: 't', type, val, tx: x, ty: y, h, x0: x * T + 10, x1: x * T + 30, y0: y * T, y1: (y + h) * T }),
    SAW: (x, y, r = 30) => add({ k: 'w', cx: x * T + 20, cy: y * T + 20, r, x0: x * T + 20 - r, x1: x * T + 20 + r }),
    COIN: (x, y) => add({ k: 'c', idx: coinN++, cx: x * T + 20, cy: y * T + 20, x0: x * T, x1: (x + 1) * T })
  };
  a.SPIKES = (x, n, y = 0, flip = false) => { for (let i = 0; i < n; i++) a.S(x + i, y, flip); };
  a.PILLAR = (x, gapY, gapH, w = 2) => {
    if (gapY > 0) a.B(x, 0, w, gapY);
    const top = gapY + gapH; if (top < 10) a.B(x, top, w, 10 - top);
  };
  def.build(a);
  const cols = [];
  for (const o of objs) {
    const c0 = Math.floor(o.x0 / T), c1 = Math.floor((o.x1 - 0.001) / T);
    for (let c = Math.max(0, c0); c <= c1; c++) (cols[c] || (cols[c] = [])).push(o);
  }
  return { def, objs, cols, endX: def.endX };
}

// ---------- Level-Generator (setzt Level aus erprobten Bausteinen zusammen) ----------
function generate(a, def) {
  const R = rng(def.seed), rnd = n => Math.floor(R() * n), pick = arr => arr[rnd(arr.length)];
  const { B, S, SPIKES, PAD, ORB, PORTAL, SAW, COIN, PILLAR } = a;
  let x = 16, sp = 1, mode = 'cube', needReset = false;
  const hints = [], stops = [], tier = def.tier || 1;
  const gap = () => Math.round(7 * sp) + rnd(4);
  const enter = type => {
    if (mode === type) return;
    if (needReset) { PORTAL(x, 'gnorm', 0, 10); x += 4; needReset = false; }
    PORTAL(x, type, 0, 10); mode = type; x += 14;
  };
  const CT = {
    single: () => { S(x); hints.push({ x, y: 2 }); return x + 1; },
    double: () => { SPIKES(x, 2); return x + 2; },
    triple: () => { SPIKES(x, 3); hints.push({ x: x + 1, y: 2 }); return x + 3; },
    blockSpike: () => { B(x, 0, 3, 1); const n = sp > 1 ? 2 : 1; SPIKES(x + 5, n); return x + 5 + n; },
    stairs: () => {
      const w = sp > 1 ? 4 : 3;
      B(x, 0, w, 1); B(x + w, 0, w, 2); B(x + 2 * w, 0, w, 3);
      hints.push({ x: x + 2 * w + 1, y: 4 });
      const e = x + 3 * w + (sp > 1 ? 1 : 2), n = sp > 1 ? 5 : 4;
      SPIKES(e, n); return e + n;
    },
    padField: () => { PAD(x, 'y'); const n = sp > 1 ? 6 : 5; SPIKES(x + 4, n); hints.push({ x: x + 6, y: 3 }); return x + 4 + n; },
    padPink: () => { PAD(x, 'p'); if (sp > 1) { SPIKES(x + 4, 3); return x + 7; } SPIKES(x + 3, 2); return x + 5; },
    orb: () => { const n = sp > 1 ? 7 : 6, o = sp > 1 ? 3 : 2; SPIKES(x, n); ORB(x + o, 2); return x + o + Math.round(8 * sp) + 3; },
    saw: () => { SAW(x, 0, 30); return x + 1 + Math.round(10 * sp); },
    spikeBlock: () => { B(x, 0, 1, 1); S(x, 1); return x + 1; },
    plat: () => { PAD(x); B(x + 5, 2, 4, 1); SPIKES(x + 13, 3); return x + 16; }
  };
  const cubeSection = n => {
    enter('cube');
    let names = ['single', 'double', 'triple', 'blockSpike', 'stairs', 'padField', 'spikeBlock'];
    if (tier >= 2) names = names.concat(['padPink', 'orb', 'saw', 'plat']);
    if (sp > 1) names = names.filter(k => k !== 'spikeBlock' && k !== 'plat');
    let prev = '';
    for (let i = 0; i < n; i++) {
      let k = pick(names); if (k === prev && (k === 'orb' || k === 'saw')) k = 'triple';
      if (k === 'blockSpike' || k === 'stairs' || k === 'plat') x += 3;
      x = CT[k](); prev = k; x += gap();
    }
  };
  const gapList = (n, minH, hRand, maxDelta) => {
    const out = []; let prev = -1;
    for (let i = 0; i < n; i++) {
      const gh = minH + rnd(hRand); let gy = 1 + rnd(5);
      if (gy + gh > 10) gy = 10 - gh;
      if (prev >= 0 && Math.abs(gy - prev) > maxDelta) gy = prev + (gy > prev ? maxDelta : -maxDelta);
      gy = Math.max(0, Math.min(10 - gh, gy)); out.push([gy, gh]); prev = gy;
    }
    return out;
  };
  const pillarSection = (type, n, spacing, saws) => {
    enter(type);
    gapList(n, tier >= 3 ? 4 : 4, tier >= 3 ? 1 : 2, 4).forEach((g, i) => {
      PILLAR(x, g[0], g[1]);
      if (saws && i < n - 1 && rnd(2)) SAW(x + (sp > 1 ? 5 : 6), 2 + rnd(5), 26);
      if (i === 1) hints.push({ x: x + 7, y: g[0] + 2 });
      x += spacing;
    });
  };
  const gravSection = n => {
    if (mode !== 'cube') enter('cube');
    PORTAL(x, 'gflip', 0, 10); x += Math.round(11 * sp) + 2;
    for (let i = 0; i < n; i++) {
      const k = i === 0 ? pick(['c2', 'c3', 'blk']) : pick(['c2', 'c3', 'blk', 'saw']);
      if (k === 'c2') { SPIKES(x, 2, 9, true); x += 2; }
      else if (k === 'c3') { SPIKES(x, 3, 9, true); x += 3; }
      else if (k === 'blk') { B(x, 9, 3, 1); S(x + 5, 9, true); hints.push({ x: x + 1, y: 7 }); x += 6; }
      else { SAW(x, 9, 30); x += 1; }
      x += 8;
    }
    PORTAL(x, 'gnorm', 0, 10); x += 12;
  };
  const ballSection = n => {
    enter('ball');
    const sx = sp > 1 ? 13 : 14;
    for (let i = 0; i < n; i++) {
      const floor = rnd(2) === 0;
      if (floor) { if (rnd(3) === 0) B(x, 0, 2, 4); else SPIKES(x, 2 + rnd(2)); }
      else { if (rnd(3) === 0) B(x, 6, 2, 4); else SPIKES(x, 2, 9, true); }
      x += sx;
    }
    needReset = true; x += 4;
  };
  const waveSection = n => {
    enter('wave');
    let prev = -1;
    for (let i = 0; i < n; i++) {
      const gh = 4 + rnd(2); let gy = 1 + rnd(5);

// ---------- Simulation (ohne DOM, damit testbar) ----------
function newState() {
  return { x: 0, y: 0, vy: 0, mode: 'cube', grav: 1, speed: 1, onGround: true,
           dead: false, won: false, t: 0, pressT: -9, lastPress: -9, used: new Set(), coins: new Set() };
}
function cloneState(s) { const c = Object.assign({}, s); c.used = new Set(s.used); c.coins = new Set(s.coins); return c; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function step(s, held, dt) {
  if (s.dead || s.won) return;
  s.t += dt;
  const m = s.mode, D = DIM[m], w = D.w, h = D.h, ox = D.ox; let d = s.grav;
  const near = getNear(s.x);
  const py0 = s.y;
  const ceilOn = m !== 'cube' || d < 0;

  // --- vertikal ---
  if (m === 'ship') {
    s.vy = clamp(s.vy + (held ? SHIP_UP : -SHIP_DN) * d * dt, -SHIP_MAX, SHIP_MAX);
  } else if (m === 'wave') {
    s.vy = (held ? 1 : -1) * d * SPD * s.speed;
  } else if (m === 'ball') {
    if (s.onGround && s.pressT !== s.lastPress && s.t - s.pressT < 0.12) {
      s.lastPress = s.pressT; s.grav = -s.grav; d = s.grav; s.onGround = false; s.vy = -d * 120;
    }
    s.vy -= d * GRAV * 0.75 * dt;
    if (d * s.vy < -700) s.vy = -d * 700;
  } else if (m === 'ufo') {
    if (s.pressT !== s.lastPress && s.t - s.pressT < 0.1) { s.lastPress = s.pressT; s.vy = d * 330; }
    s.vy -= d * GRAV * 0.7 * dt;
    if (d * s.vy < -520) s.vy = -d * 520;
  } else {
    if (s.onGround && held) { s.vy = d * JUMP_V; s.onGround = false; }
    s.vy -= d * GRAV * dt;
    if (d * s.vy < -FALL_MAX) s.vy = -d * FALL_MAX;
  }
  s.y += s.vy * dt;
  s.onGround = false;
  if (s.y <= 0) { s.y = 0; if (s.vy < 0) s.vy = 0; if (d > 0) s.onGround = true; }
  if (ceilOn && s.y + h >= CEIL) { s.y = CEIL - h; if (s.vy > 0) s.vy = 0; if (d < 0) s.onGround = true; }
  let px = s.x + ox;
  for (let i = 0; i < near.length; i++) {
    const o = near[i]; if (o.k !== 'b') continue;
    if (px + w > o.x0 + 0.01 && px < o.x1 - 0.01 && s.y < o.y1 - 0.001 && s.y + h > o.y0 + 0.001) {
      if (s.vy <= 0 && py0 >= o.y1 - 4) {
        if (m === 'cube' && d < 0) { s.dead = true; return; }
        s.y = o.y1; if (s.vy < 0) s.vy = 0; if (d > 0) s.onGround = true;
      } else if (s.vy >= 0 && py0 + h <= o.y0 + 4) {
        if (m === 'cube' && d > 0) { s.dead = true; return; }
        s.y = o.y0 - h; if (s.vy > 0) s.vy = 0; if (d < 0) s.onGround = true;
      }
    }
  }

  // --- horizontal ---
  s.x += SPD * s.speed * dt;
  px = s.x + ox;
  for (let i = 0; i < near.length; i++) {
    const o = near[i]; if (o.k !== 'b') continue;
    if (px + w > o.x0 + 0.01 && px < o.x1 - 0.01 && s.y < o.y1 - 0.001 && s.y + h > o.y0 + 0.001) {
      if (d > 0 && s.y >= o.y1 - 5) { s.y = o.y1; if (s.vy < 0) s.vy = 0; s.onGround = true; }
      else if (d < 0 && s.y + h <= o.y0 + 5) { s.y = o.y0 - h; if (s.vy > 0) s.vy = 0; s.onGround = true; }
      else { s.dead = true; return; }
    }
  }

  // --- Gefahren, Pads, Orbs, Münzen, Portale ---
  const ins = D.ins;
  const bx0 = px + ins, bx1 = px + w - ins, by0 = s.y + ins, by1 = s.y + h - ins;
  const pcx = px + w / 2, pcy = s.y + h / 2;
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    switch (o.k) {
      case 's':
        if (bx1 > o.hx0 && bx0 < o.hx1 && by1 > o.hy0 && by0 < o.hy1) { s.dead = true; return; }
        break;
      case 'w': {
        const cx = clamp(o.cx, bx0, bx1), cy = clamp(o.cy, by0, by1);
        const dx = cx - o.cx, dy = cy - o.cy, r = o.r * 0.82;
        if (dx * dx + dy * dy < r * r) { s.dead = true; return; }
        break;
      }
      case 'p': {
        const hit = px < o.x1 && px + w > o.x0 && s.y < o.y1 && s.y + h > o.y0;
        if (hit && !s.used.has(o.id)) {
          s.used.add(o.id); s.onGround = false;
          if (o.kind === 'b') { s.grav = -s.grav; s.vy = s.grav * -200; }
          else s.vy = d * PAD_V[o.kind];
        } else if (!hit && s.used.has(o.id)) s.used.delete(o.id);
        break;
      }
      case 'o': {
        const dx = pcx - o.cx, dy = pcy - o.cy;
        const hit = dx * dx + dy * dy < 38 * 38;
        if (hit && !s.used.has(o.id) && s.t - s.pressT < 0.1 && m !== 'wave') {
          s.used.add(o.id); s.onGround = false;
          if (o.kind === 'b') { s.grav = -s.grav; s.vy = s.grav * -200; }
          else s.vy = d * ORB_V[o.kind];
        } else if (!hit && s.used.has(o.id)) s.used.delete(o.id);
        break;
      }
      case 'c': {
        const dx = pcx - o.cx, dy = pcy - o.cy;
        if (dx * dx + dy * dy < 30 * 30) s.coins.add(o.idx);
        break;
      }
      case 't':
        if (px < o.x1 && px + w > o.x0 && s.y < o.y1 && s.y + h > o.y0) {
          switch (o.type) {
            case 'ship': if (s.mode !== 'ship') { s.mode = 'ship'; s.vy = clamp(s.vy, -SHIP_MAX, SHIP_MAX); } break;
            case 'wave': s.mode = 'wave'; break;
            case 'ball': if (s.mode !== 'ball') { s.mode = 'ball'; s.vy = clamp(s.vy, -500, 500); } break;
            case 'ufo': if (s.mode !== 'ufo') { s.mode = 'ufo'; s.vy = clamp(s.vy, -500, 500); } break;
            case 'cube': if (s.mode !== 'cube') { s.mode = 'cube'; s.onGround = false; } break;
            case 'gflip': s.grav = -1; break;
            case 'gnorm': s.grav = 1; break;
            case 'spd': s.speed = o.val; break;
          }
        }
        break;
    }
  }
  if (s.x >= LV.endX * T) s.won = true;
}

}

// ---------- Demo-Bot (Hintergrund im Menü) ----------
const BOT = { plan: null, prev: false, acc: 0 }, BH = 50;
function rollout(s0, plan, prev) {
  const s = cloneState(s0);
  for (let f = 0; f < BH; f++) {
    const held = plan[f];
    if (held && !prev) s.pressT = s.t;
    prev = held;
    for (let k = 0; k < 4; k++) { step(s, held, DT); if (s.dead) return false; if (s.won) return true; }
  }
  return true;
}
function randPlan() {
  const p = new Array(BH); let cur = Math.random() < 0.4, f = 0;
  while (f < BH) { const len = 1 + Math.floor(Math.random() * 25); for (let i = 0; i < len && f < BH; i++) p[f++] = cur; cur = !cur; }
  return p;
}
function botDecide(s) {
  let chosen = null;
  if (BOT.plan) { const sh = BOT.plan.slice(1); sh.push(sh[sh.length - 1]); if (rollout(s, sh, BOT.prev)) chosen = sh; }
  if (!chosen) {
    const base = new Array(BH).fill(false);
    if (rollout(s, base, BOT.prev)) chosen = base;
    else for (let i = 0; i < 90 && !chosen; i++) { const p = randPlan(); if (rollout(s, p, BOT.prev)) chosen = p; }
  }
  if (!chosen) chosen = new Array(BH).fill(false);
  BOT.plan = chosen; return chosen[0];
}
function resetDemo() {
  game.s = newState(); BOT.plan = null; BOT.prev = false; BOT.acc = 0; game.rot = 0;
  game.trail.length = 0; game.parts.length = 0; game.rings.length = 0; game.ceilAmt = 0; game.exploded = false; game.prevGround = true;
}

      else { gs.addColorStop(0, '#000'); gs.addColorStop(0.5, '#05060f'); gs.addColorStop(1, rgb(pal.acc, 0.45)); }

    }
    case 'p': {

      const col = o.kind === 'y' ? '#ffe14a' : o.kind === 'p' ? '#ff6fd0' : '#4da6ff';
      const yb = o.flip ? GROUND - o.y1 : GROUND - o.y0, dir = o.flip ? 1 : -1;
      const pl = 1 + Math.sin(t * 8) * 0.12;

      ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x + 4, yb + dir * 12); ctx.lineTo(x + 28, yb + dir * 12); ctx.lineTo(x + 32, yb); ctx.closePath(); ctx.fill();
      ctx.restore();

      const col = o.kind === 'y' ? '#ffe14a' : o.kind === 'p' ? '#ff6fd0' : '#4da6ff';
      const pl = 1 + Math.sin(t * 6) * 0.1;
      ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 22;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 10 * pl, 0, 7); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 19, 0, 7); ctx.stroke();
      ctx.setLineDash([6, 8]); ctx.lineDashOffset = -t * 30; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;

      ctx.restore();

    }
    case 'c': {
      const x = o.cx - camX, y = GROUND - o.cy + Math.sin(t * 3 + o.idx) * 4; if (x > W + 30 || x < -30) break;
      if (game.s.coins.has(o.idx)) break;
      const got = save.coins[LVI][o.idx];
      const sx = Math.abs(Math.cos(t * 3 + o.idx));
      ctx.save(); ctx.translate(x, y); ctx.scale(0.35 + 0.65 * sx, 1);
      ctx.shadowColor = '#ffd24d'; ctx.shadowBlur = 16; ctx.globalAlpha = got ? 0.5 : 1;
      ctx.fillStyle = '#ffd24d'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
      ctx.strokeStyle = '#a86a00'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff1a8'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#a86a00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
      break;
    }
    case 'w': {

      ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 18;

      else if (o.type === 'cube') { ctx.strokeRect(-8, -8, 16, 16); }
      else if (o.type === 'ball') { ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke(); }
      else if (o.type === 'ufo') { ctx.beginPath(); ctx.ellipse(0, 4, 11, 4, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(0, 2, 6, Math.PI, 0); ctx.stroke(); }
      else if (o.type === 'wave') { ctx.beginPath(); ctx.moveTo(-9, 6); ctx.lineTo(-3, -6); ctx.lineTo(3, 6); ctx.lineTo(9, -6); ctx.stroke(); }
      else if (o.type === 'gflip' || o.type === 'gnorm') {
        const up = o.type === 'gflip' ? -1 : 1; ctx.beginPath(); ctx.moveTo(0, -9 * up); ctx.lineTo(0, 9 * up); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-6, 3 * up); ctx.lineTo(0, 9 * up); ctx.lineTo(6, 3 * up); ctx.stroke();

}

// ---------- Spieler zeichnen ----------
function drawPlayerShape(s, camX, alpha) {
  const D = DIM[s.mode], sk = SKINS[game.icon], d = s.grav;
  const x = s.x - camX;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (s.mode === 'ship') {
    const cx = x + T / 2, cy = GROUND - s.y - D.h / 2;
    const ang = clamp(-s.vy / 420, -0.6, 0.6) * d;
    ctx.translate(cx, cy); ctx.rotate(ang); ctx.scale(1, d);
    ctx.shadowColor = sk.glow; ctx.shadowBlur = 18;
    // Kuppel mit kleinem Würfel
    const gr = ctx.createLinearGradient(-9, -22, 11, -2); gr.addColorStop(0, sk.a); gr.addColorStop(1, sk.b);
    ctx.fillStyle = gr; ctx.fillRect(-9, -23, 20, 20);
    ctx.shadowBlur = 0; ctx.strokeStyle = sk.line; ctx.lineWidth = 2; ctx.strokeRect(-9, -23, 20, 20);
    ctx.fillStyle = sk.line; ctx.fillRect(-4, -18, 4, 5); ctx.fillRect(3, -18, 4, 5);
    // Rumpf
    ctx.shadowColor = sk.glow; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(-24, 3); ctx.lineTo(-15, 15); ctx.lineTo(19, 15); ctx.lineTo(26, 0); ctx.lineTo(-13, -4); ctx.closePath();
    const g2 = ctx.createLinearGradient(0, -4, 0, 15); g2.addColorStop(0, '#ffffff'); g2.addColorStop(0.3, sk.a); g2.addColorStop(1, sk.b);
    ctx.fillStyle = g2; ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = sk.line; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = sk.line; ctx.fillRect(-10, 7, 20, 3);
  } else if (s.mode === 'ball') {
    const cx = x + D.ox + D.w / 2, cy = GROUND - s.y - D.h / 2;
    ctx.translate(cx, cy); ctx.rotate(game.rot); ctx.scale(1 + game.squash * 0.6, 1 - game.squash * 0.6);
    ctx.shadowColor = sk.glow; ctx.shadowBlur = 20;
    const gr = ctx.createRadialGradient(-5, -5, 2, 0, 0, 19); gr.addColorStop(0, sk.a); gr.addColorStop(1, sk.b);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = sk.line; ctx.lineWidth = 3; ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.moveTo(0, -14); ctx.lineTo(0, 14); ctx.stroke();
    ctx.fillStyle = sk.line; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, 7); ctx.fill();
  } else if (s.mode === 'ufo') {
    const cx = x + T / 2, cy = GROUND - s.y - D.h / 2;
    ctx.translate(cx, cy); ctx.scale(1, d);
    ctx.shadowColor = sk.glow; ctx.shadowBlur = 18;
    const g1 = ctx.createLinearGradient(0, -20, 0, 0); g1.addColorStop(0, 'rgba(255,255,255,0.9)'); g1.addColorStop(1, sk.a);
    ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(0, -2, 12, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = sk.line; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowColor = sk.glow; ctx.shadowBlur = 14;
    const g2 = ctx.createLinearGradient(0, -2, 0, 12); g2.addColorStop(0, '#ffffff'); g2.addColorStop(0.3, sk.a); g2.addColorStop(1, sk.b);
    ctx.fillStyle = g2; ctx.beginPath(); ctx.ellipse(0, 4, 22, 9, 0, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
    ctx.fillStyle = sk.line; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 10, 5, 2.4, 0, 7); ctx.fill(); }
  } else if (s.mode === 'wave') {
    const cx = x + D.ox + D.w / 2, cy = GROUND - s.y - D.h / 2;
    const up = (s.vy * d) > 0;
    ctx.translate(cx, cy); ctx.rotate((up ? -Math.PI / 4 : Math.PI / 4) * 1);

    ctx.shadowColor = sk.glow; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(-14, -11); ctx.lineTo(16, 0); ctx.lineTo(-14, 11); ctx.lineTo(-8, 0); ctx.closePath();
    const gr = ctx.createLinearGradient(-14, 0, 16, 0); gr.addColorStop(0, sk.b); gr.addColorStop(1, sk.a);
    ctx.fillStyle = gr; ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = sk.line; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();

    const gr = ctx.createLinearGradient(-20, -20, 20, 20); gr.addColorStop(0, sk.a); gr.addColorStop(1, sk.b);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = sk.line; ctx.lineWidth = 3; ctx.strokeRect(-18.5, -18.5, T - 3, T - 3);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(-17, -17, T - 6, 5);
    // Gesicht
    ctx.fillStyle = sk.line; ctx.fillRect(-12, -8, 9, 9); ctx.fillRect(3, -8, 9, 9);
    ctx.fillStyle = '#fff'; ctx.fillRect(-9, -7, 4, 4); ctx.fillRect(6, -7, 4, 4);
    ctx.fillStyle = sk.line; ctx.fillRect(-12, 7, 24, 5);
    ctx.fillStyle = sk.a; ctx.fillRect(-7, 7, 3, 5); ctx.fillRect(0, 7, 3, 5); ctx.fillRect(7, 7, 3, 5);

}

// ---------- Rendering ----------
let vignette = null;
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  buttons = [];
  const s = game.s, pal = palette(s.x / T), camX = s.x - CAMX;
  let ox = 0, oy = 0;
  if (game.shake > 0) { ox = (Math.random() - .5) * 60 * game.shake; oy = (Math.random() - .5) * 60 * game.shake; }
  ctx.save(); ctx.translate(ox, oy);
  drawBackground(camX, pal);

  // Objekte
  const c0 = Math.floor(camX / T) - 3, c1 = c0 + Math.ceil(W / T) + 6;
  const sky = [];
  for (let c = Math.max(0, c0); c <= c1; c++) {
    const l = LV.cols[c]; if (!l) continue;
    for (const o of l) { if (o._f === game.frame) continue; o._f = game.frame; if (o.k === 'b') drawObj(o, camX, pal); else sky.push(o); }
  }
  for (const o of sky) if (o.k === 't' || o.k === 's') drawObj(o, camX, pal);
  for (const o of sky) if (o.k !== 't' && o.k !== 's') drawObj(o, camX, pal);

  // Boden
  const acc = rgb(pal.acc);
  const gg = ctx.createLinearGradient(0, GROUND, 0, H);
  gg.addColorStop(0, rgb(mixC(pal.b, [0, 0, 0], 0.35), 0.96)); gg.addColorStop(1, 'rgba(0,0,0,0.98)');
  ctx.fillStyle = gg; ctx.fillRect(-30, GROUND, W + 60, H - GROUND + 30);
  ctx.strokeStyle = rgb(pal.acc, 0.2); ctx.lineWidth = 2; ctx.beginPath();
  for (let x = -((camX) % 80); x < W + 80; x += 80) { ctx.moveTo(x, GROUND); ctx.lineTo(x - 40, H); }
  for (let y = GROUND + 22; y < H; y += 22) { ctx.moveTo(-30, y); ctx.lineTo(W + 30, y); }
  ctx.stroke();
  // Reflexion
  if (game.scene !== 'dead' && s.grav > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, GROUND, W, H - GROUND); ctx.clip();
    ctx.translate(0, GROUND * 2); ctx.scale(1, -1); drawPlayerShape(s, camX, 0.12); ctx.restore();
  }
  ctx.save(); ctx.shadowColor = acc; ctx.shadowBlur = 24; ctx.fillStyle = acc; ctx.fillRect(-30, GROUND - 2, W + 60, 4); ctx.restore();
  // Decke
  if (game.ceilAmt > 0.01) {
    const cy = GROUND - CEIL;
    ctx.save(); ctx.globalAlpha = game.ceilAmt;
    const cg = ctx.createLinearGradient(0, 0, 0, cy);
    cg.addColorStop(0, 'rgba(0,0,0,0.98)'); cg.addColorStop(1, rgb(mixC(pal.b, [0, 0, 0], 0.35), 0.96));
    ctx.fillStyle = cg; ctx.fillRect(-30, -30, W + 60, cy + 30);
    ctx.strokeStyle = rgb(pal.acc, 0.2); ctx.lineWidth = 2; ctx.beginPath();
    for (let x = -((camX) % 80); x < W + 80; x += 80) { ctx.moveTo(x, cy); ctx.lineTo(x - 40, 0); }
    ctx.stroke();
    ctx.shadowColor = acc; ctx.shadowBlur = 24; ctx.fillStyle = acc; ctx.fillRect(-30, cy - 2, W + 60, 4);
    ctx.restore();
  }

  // Wave-Spur
  if (game.trail.length > 2) {
    const tr = game.trail, sk = SKINS[game.icon];
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = sk.glow; ctx.shadowBlur = 16;
    for (let i = 1; i < tr.length; i++) {
      ctx.globalAlpha = i / tr.length * 0.9; ctx.strokeStyle = i % 2 ? sk.a : sk.glow; ctx.lineWidth = 3 + 7 * i / tr.length;
      ctx.beginPath(); ctx.moveTo(tr[i - 1].x - camX, GROUND - tr[i - 1].y); ctx.lineTo(tr[i].x - camX, GROUND - tr[i].y); ctx.stroke();
    }
    ctx.restore();
  }

  // Ringe
  for (const r of game.rings) {
    const k = 1 - r.life / r.max, rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - k, 2));
    ctx.save(); ctx.globalAlpha = (1 - k) * 0.9; ctx.strokeStyle = r.color; ctx.lineWidth = r.lw * (1 - k * 0.6);
    ctx.shadowColor = r.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(r.x - camX, GROUND - r.y, rad, 0, 7); ctx.stroke(); ctx.restore();
  }
  // Partikel
  for (const p of game.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    const x = p.x - camX, y = GROUND - p.y, sz = p.size * (p.circ ? 1 : (0.4 + 0.6 * a));
    if (p.circ) { ctx.beginPath(); ctx.arc(x, y, sz / 2, 0, 7); ctx.fill(); } else ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // Versuchs-Text
  if (game.scene !== 'menu') {
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 46px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.save(); ctx.shadowColor = acc; ctx.shadowBlur = 14;
    ctx.fillText('Versuch ' + game.attempt, 100 - camX, GROUND - 200); ctx.restore();
  }
  // Spieler
  if (game.scene !== 'dead' && !(game.scene === 'win' && game.winT > 0.25) && !s.dead) drawPlayerShape(s, camX, 1);
  ctx.restore();

  // Vignette
  if (!vignette) {
    vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.0);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (game.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (game.flash * 1.6) + ')'; ctx.fillRect(0, 0, W, H); }

  drawUI(pal);
}

// ---------- UI ----------
function text(txt, x, y, size, col = '#fff', align = 'center', glow) {
  ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
  ctx.lineWidth = Math.max(3, size / 9); ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineJoin = 'round'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.restore();
}
function button(x, y, w, h, label, fn, o = {}) {
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  const col = o.col || '#ffffff';
  ctx.save();
  rr(x, y, w, h, o.r || 14);
  ctx.fillStyle = o.fill || (hov ? 'rgba(255,255,255,0.28)' : 'rgba(10,14,40,0.62)'); ctx.fill();
  ctx.shadowColor = col; ctx.shadowBlur = hov ? 18 : 8; ctx.strokeStyle = col; ctx.lineWidth = o.active ? 4 : 2; ctx.stroke();
  ctx.restore();
  if (label) text(label, x + w / 2, y + h / 2 + 1, o.size || 22, col);
  buttons.push({ x, y, w, h, fn });
}
function drawUI(pal) {
  const acc = rgb(pal.acc);
  const sc = game.scene;
  if (sc === 'play' || sc === 'dead' || sc === 'pause' || sc === 'win') {
    const p = progress(), bw = 420, bx = (W - bw) / 2, by = 16;
    ctx.save();
    rr(bx, by, bw, 14, 7); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    ctx.save(); rr(bx, by, bw, 14, 7); ctx.clip();
    const f = bx + bw * clamp(game.s.x / (LV.endX * T), 0, 1);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, rgb(mixC(pal.acc, [255, 255, 255], 0.2))); g.addColorStop(1, acc);
    ctx.fillStyle = g; ctx.shadowColor = acc; ctx.shadowBlur = 12; ctx.fillRect(bx, by, f - bx, 14); ctx.restore();
    rr(bx, by, bw, 14, 7); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    text(p + '%', bx + bw + 14, by + 8, 22, '#fff', 'left');
    if (sc === 'play') button(W - 66, 8, 50, 42, '❚❚', () => { game.scene = 'pause'; }, { size: 15, r: 10 });
    // Münzen
    for (let i = 0; i < 3; i++) {
      const got = game.s.coins.has(i);
      ctx.save(); ctx.translate(bx - 80 + i * 24, by + 8); ctx.shadowColor = '#ffd24d'; ctx.shadowBlur = got ? 12 : 0;
      ctx.fillStyle = got ? '#ffd24d' : 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = got ? '#a86a00' : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    }
    if (game.practice) {
      text('ÜBUNGSMODUS', 24, 24, 18, '#6dff9a', 'left');
      if (sc === 'play') {
        button(W - 168, H - 46, 74, 34, '+ ◆', placeCp, { size: 18, col: '#6dff9a', r: 10 });
        button(W - 86, H - 46, 74, 34, '− ◆', delCp, { size: 18, col: '#ff9a9a', r: 10 });
      }
    }
    // Level-Name Banner
    if (sc === 'play' && game.s.t < 2.2) {
      const a = clamp(Math.min(game.s.t / 0.3, (2.2 - game.s.t) / 0.5), 0, 1);
      ctx.globalAlpha = a; text(LV.def.name, W / 2, 110, 54, '#fff', 'center', acc); ctx.globalAlpha = 1;
    }
  }
  if (sc === 'dead' && !game.practice) {
    ctx.globalAlpha = clamp((0.85 - game.deadT) * 4, 0, 1);
    text(game.deadPct + '%', W / 2, 150, 60, '#fff', 'center', acc); ctx.globalAlpha = 1;
  }
  if (sc === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSE', W / 2, 130, 72, '#fff', 'center', acc);
    button(W / 2 - 150, 190, 300, 56, 'Weiter', () => { game.scene = 'play'; }, { col: '#6dff9a' });
    button(W / 2 - 150, 258, 300, 56, 'Neustart', restartAll, { col: '#ffd84d' });
    button(W / 2 - 150, 326, 300, 56, 'Zum Menü', toMenu, { col: '#ff9a9a' });
    text('Esc = weiter · R = Neustart · M = Menü', W / 2, 420, 18, 'rgba(255,255,255,0.7)');
  }
  if (sc === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.55, game.winT * 0.5) + ')'; ctx.fillRect(0, 0, W, H);
    if (game.winT > 0.4) {
      const k = clamp((game.winT - 0.4) * 3, 0, 1);
      ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * 30);
      text('LEVEL GESCHAFFT!', W / 2, 120, 68, '#ffe14a', 'center', '#ff9a00');
      text(LV.def.name, W / 2, 180, 30, '#fff');
      text('Versuche: ' + game.attempt + (game.practice ? '   (Übungsmodus)' : ''), W / 2, 230, 26);
      for (let i = 0; i < 3; i++) {
        const got = game.s.coins.has(i);
        ctx.save(); ctx.translate(W / 2 - 50 + i * 50, 280); ctx.shadowColor = '#ffd24d'; ctx.shadowBlur = got ? 18 : 0;
        ctx.fillStyle = got ? '#ffd24d' : 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill();
        ctx.strokeStyle = got ? '#a86a00' : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
      }
      ctx.restore();
      if (game.winT > 0.8) {
        button(W / 2 - 270, 340, 250, 56, 'Nochmal', startLevel, { col: '#6dff9a' });
        button(W / 2 + 20, 340, 250, 56, 'Zum Menü', toMenu, { col: '#ffffff' });
        if (game.sel < LEVELS.length - 1) button(W / 2 - 125, 410, 250, 56, 'Nächstes Level ▶', () => { selectLevel(game.sel + 1); startLevel(); }, { col: '#ffd84d' });
      }
    }
  }
  if (sc === 'menu') drawMenu(pal);
}
function toggleFs() {
  try {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } catch (e) {}
}
function drawMenu(pal) {
  const acc = rgb(pal.acc);
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(0, 0, W, H);
  // Titel
  const bob = Math.sin(game.time * 2) * 3;
  ctx.save(); ctx.translate(W / 2, 62 + bob);
  ctx.font = '900 72px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = acc; ctx.shadowBlur = 30 + Math.exp(-game.beat * 5) * 20;
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineJoin = 'round'; ctx.strokeText('BLOCK DASH', 0, 0);
  const g = ctx.createLinearGradient(0, -36, 0, 36); g.addColorStop(0, '#ffffff'); g.addColorStop(1, acc);
  ctx.fillStyle = g; ctx.fillText('BLOCK DASH', 0, 0); ctx.restore();

  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) button(14, 12, 46, 38, '⛶', toggleFs, { size: 20, r: 10 });
  let tc = 0; save.coins.forEach(arr => arr.forEach(v => { if (v) tc++; }));
  text('Münzen: ' + tc + '/' + LEVELS.length * 3, W - 24, 24, 18, '#ffd24d', 'right');
  // Level-Karten
  const cw = 270, ch = 168, gap = 24, x0 = (W - (cw * 3 + gap * 2)) / 2, y0 = 128;
  const first = clamp(game.sel - 1, 0, Math.max(0, LEVELS.length - 3));
  LEVELS.forEach((L, i) => {
    if (i < first || i >= first + 3) return;
    const d = L.def, sel = i === game.sel, x = x0 + (i - first) * (cw + gap), y = y0 - (sel ? 6 : 0);
    const c0 = hex(d.pal[0].a), c1 = hex(d.pal[0].b), ac = hex(d.pal[0].acc);
    ctx.save();
    rr(x, y, cw, ch, 18);
    const gr = ctx.createLinearGradient(x, y, x, y + ch);
    gr.addColorStop(0, rgb(c0, sel ? 0.92 : 0.6)); gr.addColorStop(1, rgb(c1, sel ? 0.96 : 0.75));
    ctx.fillStyle = gr; ctx.fill();
    ctx.shadowColor = rgb(ac); ctx.shadowBlur = sel ? 28 : 8; ctx.strokeStyle = rgb(ac, sel ? 1 : 0.5); ctx.lineWidth = sel ? 4 : 2; ctx.stroke();
    ctx.restore();
    // Akzentlinie unten
    ctx.save(); rr(x, y, cw, ch, 18); ctx.clip();
    const lg = ctx.createLinearGradient(x, 0, x + cw, 0); lg.addColorStop(0, rgb(ac, 0)); lg.addColorStop(0.5, rgb(ac, 0.9)); lg.addColorStop(1, rgb(ac, 0));
    ctx.fillStyle = lg; ctx.fillRect(x, y + ch - 5, cw, 3);
    ctx.restore();
    text(d.name, x + cw / 2, y + 34, 28, '#fff');
    text(d.diff, x + cw / 2, y + 64, 20, d.diffCol);
    // Fortschritt
    const best = save.best[i];
    rr(x + 24, y + 84, cw - 48, 12, 6); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
    if (best > 0) { ctx.save(); rr(x + 24, y + 84, (cw - 48) * best / 100, 12, 6); ctx.fillStyle = rgb(ac); ctx.shadowColor = rgb(ac); ctx.shadowBlur = 8; ctx.fill(); ctx.restore(); }
    text(best + '%', x + cw / 2, y + 112, 18, 'rgba(255,255,255,0.9)');
    for (let k = 0; k < 3; k++) {
      const got = save.coins[i][k];
      ctx.save(); ctx.translate(x + cw / 2 - 28 + k * 28, y + 138); ctx.shadowColor = '#ffd24d'; ctx.shadowBlur = got ? 10 : 0;
      ctx.fillStyle = got ? '#ffd24d' : 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = got ? '#a86a00' : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    }
    buttons.push({ x, y, w: cw, h: ch, fn: () => { if (game.sel === i) startLevel(); else selectLevel(i); } });
  });
  for (let i = 0; i < LEVELS.length; i++) {
    ctx.fillStyle = i === game.sel ? '#fff' : 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(W / 2 + (i - (LEVELS.length - 1) / 2) * 18, 312, i === game.sel ? 5 : 3.5, 0, 7); ctx.fill();
  }
  // Pfeile
  button(18, y0 + 56, 44, 56, '◀', () => selectLevel(game.sel - 1), { size: 24, r: 12 });
  button(W - 62, y0 + 56, 44, 56, '▶', () => selectLevel(game.sel + 1), { size: 24, r: 12 });

  // Icon-Auswahl
  text('Icon:', 36, 482, 18, 'rgba(255,255,255,0.9)', 'left');
  SKINS.forEach((sk, i) => {
    const cx = 120 + i * 34, cy = 482, active = i === game.icon;
    ctx.save();
    const gr = ctx.createLinearGradient(cx - 11, cy - 11, cx + 11, cy + 11); gr.addColorStop(0, sk.a); gr.addColorStop(1, sk.b);
    ctx.fillStyle = gr; ctx.shadowColor = sk.glow; ctx.shadowBlur = active ? 16 : 0; ctx.fillRect(cx - 11, cy - 11, 22, 22);
    ctx.strokeStyle = active ? '#fff' : sk.line; ctx.lineWidth = active ? 3 : 2; ctx.strokeRect(cx - 11, cy - 11, 22, 22);
    ctx.restore();
    buttons.push({ x: cx - 17, y: cy - 22, w: 34, h: 44, fn: () => { game.icon = i; save.icon = i; persist(); } });
  });
  // Practice + Start
  button(W - 440, 458, 190, 48, game.practice ? 'Übung: AN' : 'Übung: AUS', () => { game.practice = !game.practice; },
         { size: 20, col: game.practice ? '#6dff9a' : '#ffffff', active: game.practice });
  button(W - 236, 452, 200, 60, '▶  SPIELEN', startLevel, { size: 26, col: '#6dff9a', fill: 'rgba(40,160,80,0.45)' });
  text(isTouch ? 'Tippen = Springen · Level antippen = auswählen, nochmal tippen = starten' : '←/→ Level · ↑/↓ Farbe · T Übung · Leertaste Start', W / 2, 526, 14, 'rgba(255,255,255,0.55)');
}

// ---------- Hauptschleife ----------
resetDemo();
let last = performance.now(), slowT = 0, fxOff = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!fxOff) {
    if (dt > 0.026) slowT += dt; else slowT = Math.max(0, slowT - dt * 0.5);
    if (slowT > 2.5) { fxOff = true; try { Object.defineProperty(ctx, 'shadowBlur', { set() {}, get() { return 0; }, configurable: true }); } catch (e) {} }
  }
  if (game.scene !== 'pause') update(dt); else game.time += dt;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Hooks für automatische Tests
window.__gd = { newState, cloneState, step, DT, T, setLevel, levels: LEVELS, endX: () => LV.endX,
  reseed: (i, seed) => { LEVELS[i] = compile(Object.assign({}, ALL_DEFS[i], { seed })); return LEVELS[i].endX; } };
</script>

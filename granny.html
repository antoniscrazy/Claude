<script>

const ORIGIN = new URL(BASE).origin;
// Netz-Sperre: nur das eigene Repo; blob:/data: erlaubt. Werbung/Tracker werden nicht geladen.
(function () {
  function ok(u) { try { var x = new URL(String(u), location.href); return x.protocol === "blob:" || x.protocol === "data:" || x.origin === ORIGIN; } catch (e) { return true; } }
  var open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) { this._blocked = !ok(u); return open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function () {
    if (!this._blocked) return send.apply(this, arguments);
    var x = this; setTimeout(function () { x.dispatchEvent(new ProgressEvent("error")); x.dispatchEvent(new ProgressEvent("loadend")); }, 0);
  };
  var f = window.fetch;
  window.fetch = function (r) { return ok(r && r.url || r) ? f.apply(this, arguments) : Promise.reject(new TypeError("Failed to fetch")); };
  if (navigator.sendBeacon) navigator.sendBeacon = function (u) { return ok(u); };
  window.open = function () { return null; };
})();
// Poki-SDK durch Platzhalter ersetzen: keine Werbung; Belohnungen gelten sofort als angesehen.
window.PokiSDK = {
  init: function () { return Promise.resolve(); }, setDebug: function () {},
  gameLoadingStart: function () {}, gameLoadingFinished: function () {}, gameplayStart: function () {}, gameplayStop: function () {},
  commercialBreak: function () { return Promise.resolve(); }, rewardedBreak: function () { return Promise.resolve(true); },
  displayAd: function () {}, destroyAd: function () {}, customEvent: function () {}, measure: function () {}, logError: function () {},
  isAdBlocked: function () { return false; }, getLanguage: function () { return "de"; }, getURLParam: function () { return ""; },
  shareableURL: function () { return Promise.resolve(location.href); }, enableEventTracking: function () {}
};
window.d0cum3nt = { URLPoki: "https://poki.com/" };
window.pokiReady = true; window._cachedAdPositions = {};
(function () {
  var name = null;
  window.initPokiBridge = function (n) { name = n; var t = setInterval(function () { if (window.unityGame) { clearInterval(t); window.unityGame.SendMessage(n, "ready"); } }, 100); };
  window.commercialBreak = function () { Promise.resolve().then(function () { window.unityGame.SendMessage(name, "commercialBreakCompleted"); }); };
  window.rewardedBreak = function () { Promise.resolve(true).then(function (r) { window.unityGame.SendMessage(name, "rewardedBreakCompleted", r.toString()); }); };
  window.shareableURL = function () { window.unityGame.SendMessage(name, "shareableURLResolved", location.href); };
})();
window.YaGames = window.YaGames || { init: function () { return Promise.resolve({ adv: { showFullscreenAdv: function (o) { o && o.callbacks && o.callbacks.onClose && o.callbacks.onClose(true); }, showRewardedVideo: function (o) { o && o.callbacks && o.callbacks.onRewarded && o.callbacks.onRewarded(); o && o.callbacks && o.callbacks.onClose && o.callbacks.onClose(); } }, getPlayer: function () { return Promise.resolve({ getData: function () { return Promise.resolve({}); }, setData: function () { return Promise.resolve(); }, getName: function () { return "Player"; }, getMode: function () { return "lite"; } }); }, getLeaderboards: function () { return Promise.resolve({ getLeaderboardPlayerEntry: function () { return Promise.resolve(null); }, setLeaderboardScore: function () { return Promise.resolve(); } }); }, features: { LoadingAPI: { ready: function () {} }, GameplayAPI: { start: function () {}, stop: function () {} } }, environment: { i18n: { lang: "de" } }, on: function () {}, dispatchEvent: function () {} }); } };
// Yandex-SDK-Ersatz: Die Spielbuild ruft YaGames fuer Werbung auf. Belohnung wird sofort gewaehrt, keine Werbung.
window.YaGames = { init: function () { return Promise.resolve({
  deviceInfo: { type: "desktop" },
  adv: {
    showRewardedVideo: function (o) { var c = (o && o.callbacks) || {}; c.onOpen && c.onOpen(); c.onRewarded && c.onRewarded(); c.onClose && c.onClose(true); return Promise.resolve(); },
    showFullscreenAdv: function (o) { var c = (o && o.callbacks) || {}; c.onOpen && c.onOpen(); c.onClose && c.onClose(false); return Promise.resolve(); }
  },
  getPlayer: function () { return Promise.reject(new Error("no player")); }
}); } };
const tx = document.getElementById("tx"), pf = document.getElementById("pf");
async function get(f, kind) { const r = await fetch(BASE + f); if (!r.ok) throw new Error(f + ": " + r.status); return r[kind](); }
(async () => {
  try {
    const DATA = ["Build/Granny.data.part1", "Build/Granny.data.part2", "Build/Granny.data.part3", "Build/Granny.data.part4"], WASM = ["Build/Granny.wasm.part1", "Build/Granny.wasm.part2", "Build/Granny.wasm.part3", "Build/Granny.wasm.part4"];
    const [loaderTxt, fw, dataBlobs, wasmBlobs] = await Promise.all([
      get("Build/Granny.loader.js", "text"), get("Build/Granny.framework.js", "blob"),
      Promise.all(DATA.map(f => get(f, "blob"))), Promise.all(WASM.map(f => get(f, "blob")))
    ]);
    pf.style.width = "50%";
    const s = document.createElement("script"); s.textContent = loaderTxt; document.body.appendChild(s);
    tx.textContent = "Starte …";
    const inst = await createUnityInstance(document.getElementById("c"), {
      dataUrl: URL.createObjectURL(new Blob(dataBlobs, { type: "application/octet-stream" })),
      codeUrl: URL.createObjectURL(new Blob(wasmBlobs, { type: "application/wasm" })),
      frameworkUrl: URL.createObjectURL(new Blob([fw], { type: "text/javascript" })),
      streamingAssetsUrl: BASE + "StreamingAssets",
      companyName: "Granny", productName: "Granny", productVersion: "1.0.0"
    }, p => { pf.style.width = (50 + p * 50) + "%"; });
    window.unityGame = inst; window.myGameInstance = inst;
    document.getElementById("ld").remove(); window.__ready = true;
  } catch (e) { tx.textContent = "Fehler beim Laden: " + (e.message || e); }

<script>
(function(){
  const $=id=>document.getElementById(id);
  const jz=$("jz"), jb=$("jb"), jk=$("jk"), look=$("look"), pz=$("pz"), rb=$("rb"), fire=$("fire");
  const KEYS={w:{key:"w",code:"KeyW",keyCode:87},a:{key:"a",code:"KeyA",keyCode:65},s:{key:"s",code:"KeyS",keyCode:83},d:{key:"d",code:"KeyD",keyCode:68},
    e:{key:"e",code:"KeyE",keyCode:69},sp:{key:" ",code:"Space",keyCode:32},c:{key:"c",code:"KeyC",keyCode:67},r:{key:"r",code:"KeyR",keyCode:82},f:{key:"f",code:"KeyF",keyCode:70},tab:{key:"Tab",code:"Tab",keyCode:9}};
  const canvas=()=>$("c")||document.body;
  function key(type,k){ canvas().dispatchEvent(new KeyboardEvent(type,{key:k.key,code:k.code,keyCode:k.keyCode,which:k.keyCode,bubbles:true,cancelable:true})); }
  const held=new Set();
  function setKeys(want){
    for(const k of [...held]) if(!want.has(k)){ held.delete(k); key("keyup",KEYS[k]); }
    for(const k of want) if(!held.has(k)){ held.add(k); key("keydown",KEYS[k]); }
  }
  // Schwebender Stick: Basis erscheint dort, wo der Finger links unten aufsetzt.
  let jid=null, ox=0, oy=0;
  function jMove(e){
    let dx=e.clientX-ox, dy=e.clientY-oy; const R=60; const len=Math.hypot(dx,dy); if(len>R){dx=dx/len*R; dy=dy/len*R;}
    jk.style.transform=`translate(${dx}px,${dy}px)`;
    const want=new Set(); const t=0.35*R;
    if(dy<-t) want.add("w"); if(dy>t) want.add("s"); if(dx<-t) want.add("a"); if(dx>t) want.add("d");
    setKeys(want);
  }
  function jEnd(){ jid=null; jb.style.display="none"; jk.style.transform=""; setKeys(new Set()); }
  jz.addEventListener("touchstart",e=>{ e.preventDefault(); if(jid!==null) return; const t=e.changedTouches[0]; jid=t.identifier; ox=t.clientX; oy=t.clientY; jb.style.left=ox+"px"; jb.style.top=oy+"px"; jb.style.display="block"; },{passive:false});
  jz.addEventListener("touchmove",e=>{ e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===jid) jMove(t); } },{passive:false});
  jz.addEventListener("touchend",e=>{ for(const t of e.changedTouches){ if(t.identifier===jid) jEnd(); } });
  jz.addEventListener("touchcancel",jEnd);
  // Knoepfe rechts: halten = gedrueckt
  function mouse(type){ const c=canvas(); const r=c.getBoundingClientRect(); c.dispatchEvent(new MouseEvent(type,{button:0,buttons:type==="mouseup"?0:1,clientX:vx(),clientY:vy(),bubbles:true,cancelable:true})); }
  function vx(){ const r=canvas().getBoundingClientRect(); return r.left+r.width/2; }
  function vy(){ const r=canvas().getBoundingClientRect(); return r.top+r.height/2; }
  rb.querySelectorAll("button").forEach(b=>{
    if(b.id==="fire"){
      b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); b.setPointerCapture(e.pointerId); b.classList.add("on"); mouse("mousedown"); });
      b.addEventListener("pointerup",e=>{ e.preventDefault(); b.classList.remove("on"); mouse("mouseup"); });
      b.addEventListener("pointercancel",()=>{ b.classList.remove("on"); mouse("mouseup"); });
      return;
    }
    const k=KEYS[b.dataset.k]; let isDown=false;
    const down=()=>{ if(isDown) return; isDown=true; b.classList.add("on"); key("keydown",k); };
    const up=()=>{ if(!isDown) return; isDown=false; b.classList.remove("on"); key("keyup",k); };
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); down(); });
    b.addEventListener("pointerup",e=>{ e.preventDefault(); up(); });
    b.addEventListener("pointercancel",up); b.addEventListener("pointerleave",up);
  });
  // Pause (oben links)
  pz.addEventListener("click",()=>{ const esc={key:"Escape",code:"Escape",keyCode:27}; key("keydown",esc); setTimeout(()=>key("keyup",esc),80); });
  // Umsehen: Ziehen rechts oben, mit virtuellem Cursor, sanft gedaempft.
  let lid=null, lx=0, ly=0, accX=0, accY=0, raf=0, vX=0, vY=0;
  const MAX=18;
  function step(){
    let mx=Math.max(-MAX,Math.min(MAX,accX*0.3)), my=Math.max(-MAX,Math.min(MAX,accY*0.3));
    accX-=mx; accY-=my;
    if(Math.abs(mx)>0.01||Math.abs(my)>0.01){
      const r=canvas().getBoundingClientRect();
      vX=Math.max(r.left+2,Math.min(r.left+r.width-2,vX+mx)); vY=Math.max(r.top+2,Math.min(r.top+r.height-2,vY+my));
      canvas().dispatchEvent(new MouseEvent("mousemove",{clientX:vX,clientY:vY,movementX:mx,movementY:my,bubbles:true}));
    }
    if(lid!==null||Math.abs(accX)>0.5||Math.abs(accY)>0.5){ raf=requestAnimationFrame(step); } else { raf=0; accX=0; accY=0; }
  }
  ["touchstart","touchmove"].forEach(t=>look.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  look.addEventListener("touchstart",e=>{ e.preventDefault(); if(lid!==null) return; const t=e.changedTouches[0]; lid=t.identifier; lx=t.clientX; ly=t.clientY; vX=vx(); vY=vy(); if(!raf) raf=requestAnimationFrame(step); },{passive:false});
  look.addEventListener("touchmove",e=>{ e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===lid){ accX+=t.clientX-lx; accY+=t.clientY-ly; lx=t.clientX; ly=t.clientY; } } },{passive:false});
  const endLook=e=>{ for(const t of e.changedTouches){ if(t.identifier===lid) lid=null; } };
  look.addEventListener("touchend",endLook); look.addEventListener("touchcancel",endLook);
  function vx2(){ return vx(); } function vy2(){ return vy(); }
  function show(){ jz.classList.add("show"); rb.classList.add("show"); pz.classList.add("show"); look.classList.add("show"); }
  function hide(){ jz.classList.remove("show"); rb.classList.remove("show"); pz.classList.remove("show"); look.classList.remove("show"); jEnd(); }
  // Manuell ein- und ausschalten (erscheint erst, wenn das Spiel geladen ist)
  const tog=$("tog");
  tog.addEventListener("click",function(){ if(rb.classList.contains("show")){ hide(); tog.classList.remove("on"); } else { show(); tog.classList.add("on"); } });
  const __iv=setInterval(function(){ if(window.__ready){ tog.classList.add("ready"); clearInterval(__iv); } },300);
  window.addEventListener("blur",hide);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && e.isTrusted) hide(); });
  // Erscheint in der Runde (Ausloeser je Spiel):
  let stage=0;
  document.addEventListener("pointerdown",e=>{
    if(!window.__ready) return; if(!(e.target.closest && e.target.closest("#wrap"))) return;
    if(e.target.closest && e.target.closest("#jz, #look, #rb, #pz")) return;
    const x=e.clientX, y=e.clientY, W=innerWidth, H=innerHeight;
    if(stage===0 && y>H*0.62 && y<H*0.72 && Math.abs(x-W/2)<W*0.12){ stage=1; return; }
    if(stage===1 && y>H*0.88 && Math.abs(x-W/2)<W*0.14){ stage=2; return; }
    if(stage>=2 && y>H*0.88 && Math.abs(x-W/2)<W*0.14){ stage=3; show(); return; }
    if(stage>=2 && y>H*0.62 && y<H*0.72 && Math.abs(x-W/2)<W*0.12){ stage=3; show(); return; }
  },true);
})();
</script>
